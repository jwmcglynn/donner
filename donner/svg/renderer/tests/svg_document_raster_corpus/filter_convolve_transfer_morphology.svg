<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <filter id="f" x="-10%" y="-10%" width="120%" height="120%">
    <feConvolveMatrix order="3" kernelMatrix="1 0 -1 2 0 -2 1 0 -1" divisor="1" bias="0.5"
                      targetX="1" targetY="1" edgeMode="wrap" preserveAlpha="true"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0 0.5 1"/>
      <feFuncG type="discrete" tableValues="0 1"/>
      <feFuncB type="gamma" amplitude="2" exponent="0.5" offset="0.1"/>
      <feFuncA type="linear" slope="0.8" intercept="0.1"/>
    </feComponentTransfer>
    <feMorphology operator="dilate" radius="2 1"/>
  </filter>
  <circle cx="32" cy="32" r="20" fill="teal" filter="url(#f)"/>
</svg>
