<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="566" viewBox="0 0 480 566">
  <title>World-lock jitter artifact</title>
  <desc>A red virtual sticky note makes small unstable movements relative to a fixed physical frame.</desc>

  <rect width="480" height="566" fill="#ffffff"/>

  <!-- The physical-world reference stays fixed. -->
  <rect x="50" y="58" width="330" height="448" fill="#ffffff" stroke="#222222"
        stroke-width="4"/>
  <rect x="380" y="22" width="30" height="520" fill="#f1f1f1" stroke="#222222"
        stroke-width="4"/>

  <!-- The intended stable location remains visible behind the jitter. -->
  <rect x="170" y="216" width="140" height="140" rx="3" fill="none" stroke="#64748b"
        stroke-width="3" stroke-dasharray="9 8" opacity="0.5"/>

  <!-- Short, irregular steps make the rendered object visibly unstable. -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="0.8s"
                      values="0 0;5 -3;-4 2;3 4;-5 -2;2 -4;-2 3;4 1;-3 -4;0 0"
                      keyTimes="0;0.11;0.22;0.33;0.44;0.56;0.67;0.78;0.89;1"
                      calcMode="discrete" repeatCount="indefinite"/>
    <rect x="170" y="216" width="140" height="140" rx="3" fill="#ef5b52"
          stroke="#c92f28" stroke-width="4"/>
  </g>
</svg>
