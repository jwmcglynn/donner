<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Gaussian blur clipped to half the object bounding box</title>
  <clipPath id="half">
    <rect x="4" y="4" width="80" height="80"/>
  </clipPath>
  <filter id="blur" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
          x="4" y="4" width="192" height="192">
    <feGaussianBlur stdDeviation="1.6"/>
  </filter>
  <g clip-path="url(#half)">
    <rect x="20" y="20" width="160" height="160" fill="seagreen" filter="url(#blur)"/>
  </g>
  <path d="M 20 100 L 180 100 M 100 20 L 100 180" stroke="gray" stroke-width="0.5"/>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
