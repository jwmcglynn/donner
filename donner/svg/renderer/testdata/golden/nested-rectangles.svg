<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 200 200">
  <title>Fractional pattern tiles expanded to user-space rectangles</title>
  <defs>
    <clipPath id="top"><rect x="20" y="20" width="160" height="70"/></clipPath>
    <clipPath id="bottom"><rect x="20" y="110" width="160" height="70"/></clipPath>
    <g id="upper-cell">
      <rect width="16" height="7" fill="grey"/>
      <rect x="16" y="7" width="8" height="7" fill="green"/>
    </g>
    <g id="upper-row">
      <use xlink:href="#upper-cell" x="0" y="0"/>
      <use xlink:href="#upper-cell" x="24" y="0"/>
      <use xlink:href="#upper-cell" x="48" y="0"/>
      <use xlink:href="#upper-cell" x="72" y="0"/>
      <use xlink:href="#upper-cell" x="96" y="0"/>
      <use xlink:href="#upper-cell" x="120" y="0"/>
      <use xlink:href="#upper-cell" x="144" y="0"/>
    </g>
    <rect id="grey" width="1" height="1" fill="grey"/>
    <rect id="green" width=".5" height="1" fill="green"/>
    <g id="grey-row">
      <use xlink:href="#grey" x="0" y="0"/>
      <use xlink:href="#grey" x="1.5" y="0"/>
      <use xlink:href="#grey" x="3" y="0"/>
      <use xlink:href="#grey" x="4.5" y="0"/>
      <use xlink:href="#grey" x="6" y="0"/>
      <use xlink:href="#grey" x="7.5" y="0"/>
      <use xlink:href="#grey" x="9" y="0"/>
    </g>
    <g id="green-row" transform="translate(1 1)">
      <use xlink:href="#green" x="0" y="0"/>
      <use xlink:href="#green" x="1.5" y="0"/>
      <use xlink:href="#green" x="3" y="0"/>
      <use xlink:href="#green" x="4.5" y="0"/>
      <use xlink:href="#green" x="6" y="0"/>
      <use xlink:href="#green" x="7.5" y="0"/>
    </g>
    <g id="outer-cell">
      <rect width="10" height="10" fill="grey"/>
      <g transform="translate(10 10)">
        <use xlink:href="#grey-row" x="0" y="0"/>
        <use xlink:href="#grey-row" x="0" y="3"/>
        <use xlink:href="#grey-row" x="0" y="6"/>
        <use xlink:href="#grey-row" x="0" y="9"/>
        <use xlink:href="#green-row" x="0" y="0"/>
        <use xlink:href="#green-row" x="0" y="3"/>
        <use xlink:href="#green-row" x="0" y="6"/>
      </g>
    </g>
    <g id="outer-row">
      <use xlink:href="#outer-cell" x="0" y="0"/>
      <use xlink:href="#outer-cell" x="20" y="0"/>
      <use xlink:href="#outer-cell" x="40" y="0"/>
      <use xlink:href="#outer-cell" x="60" y="0"/>
      <use xlink:href="#outer-cell" x="80" y="0"/>
      <use xlink:href="#outer-cell" x="100" y="0"/>
      <use xlink:href="#outer-cell" x="120" y="0"/>
      <use xlink:href="#outer-cell" x="140" y="0"/>
    </g>
  </defs>
  <g clip-path="url(#top)">
    <g transform="translate(20 20)">
      <use xlink:href="#upper-row" x="0" y="0"/>
      <use xlink:href="#upper-row" x="0" y="21"/>
      <use xlink:href="#upper-row" x="0" y="42"/>
      <use xlink:href="#upper-row" x="0" y="63"/>
    </g>
  </g>
  <g clip-path="url(#bottom)">
    <g transform="translate(20 100)">
      <use xlink:href="#outer-row" x="0" y="0"/>
      <use xlink:href="#outer-row" x="0" y="20"/>
      <use xlink:href="#outer-row" x="0" y="40"/>
      <use xlink:href="#outer-row" x="0" y="60"/>
    </g>
  </g>
  <g fill="none" stroke="darkblue">
    <rect x="20" y="20" width="160" height="70"/>
    <rect x="20" y="110" width="160" height="70"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
