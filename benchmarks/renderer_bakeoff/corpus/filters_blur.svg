<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="8" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#ffffff"/>
  <circle cx="130" cy="130" r="80" fill="#ff006e" filter="url(#blur)"/>
  <rect x="220" y="60" width="140" height="140" rx="16" fill="#3a86ff" filter="url(#shadow)"/>
  <path d="M60 300 Q200 220 340 300 T200 380 Z" fill="#8338ec" filter="url(#blur)"/>
</svg>
