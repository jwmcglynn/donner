<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <clipPath id="inner"><rect x="100" y="0" width="200" height="400"/></clipPath>
    <clipPath id="outer"><circle cx="200" cy="200" r="150" clip-path="url(#inner)"/></clipPath>
    <clipPath id="layered" clip-path="url(#inner)"><rect x="50" y="150" width="300" height="100"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#ffffff"/>
  <rect width="400" height="400" fill="#264653" clip-path="url(#outer)"/>
  <rect width="400" height="400" fill="#e76f51" fill-opacity="0.8" clip-path="url(#layered)"/>
</svg>
