<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.7" stop-color="#e09f3e"/>
      <stop offset="1" stop-color="#9e2a2b"/>
    </radialGradient>
    <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#335c67"/>
    </radialGradient>
    <radialGradient id="ring" gradientUnits="userSpaceOnUse" cx="300" cy="300" r="40"
                    spreadMethod="repeat">
      <stop offset="0" stop-color="#540b0e"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="fr" cx="0.5" cy="0.5" r="0.5" fr="0.2">
      <stop offset="0" stop-color="#2d00f7"/>
      <stop offset="1" stop-color="#f20089"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#eeeeee"/>
  <circle cx="110" cy="110" r="90" fill="url(#sun)"/>
  <ellipse cx="290" cy="110" rx="90" ry="60" fill="url(#focal)"/>
  <rect x="210" y="210" width="180" height="180" fill="url(#ring)"/>
  <rect x="20" y="220" width="170" height="160" fill="url(#fr)"/>
</svg>
