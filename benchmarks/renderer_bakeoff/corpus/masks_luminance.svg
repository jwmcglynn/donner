<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="m1"><rect width="400" height="200" fill="url(#fade)"/></mask>
    <mask id="m2"><circle cx="200" cy="300" r="80" fill="#fff"/><circle cx="200" cy="300" r="40" fill="#777"/></mask>
    <mask id="m3" style="mask-type: alpha"><rect x="20" y="220" width="100" height="160" fill="#000" fill-opacity="0.4"/></mask>
  </defs>
  <rect width="400" height="400" fill="#fdf0d5"/>
