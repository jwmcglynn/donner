<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" fill="white" pointer-events="none"/>
  <rect id="trigger" x="2" y="2" width="4" height="4" fill="red"/>
  <rect id="response" x="2" y="10" width="4" height="4" fill="blue">
    <animate id="motion" attributeName="x" from="2" to="10" begin="trigger.click"
             dur="2s" repeatCount="2" restart="never" fill="freeze"/>
  </rect>
</svg>
