name: Sanitizers PR

on:
  pull_request:
    branches: [main]
    paths:
      - "donner/svg/renderer/geode/**"
      - "donner/svg/renderer/RendererDriver.*"
      - "donner/svg/renderer/RendererGeode.*"

permissions:
  contents: read

# Superseded PR pushes cancel their in-flight sanitizer run so a rapid push
# storm does not pile up redundant hosted sanitizer builds.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('push-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  asan-geode:
    name: asan-geode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev clang-tidy-19

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-geode
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Geode with ASan
        run: |
          bazelisk test --config=asan --config=geode --test_output=errors \
            //donner/svg/renderer/tests:resvg_test_suite_geode
