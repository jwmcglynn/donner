name: Sanitizers PR

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  pull_request:
    paths:
      - "tools/ci/**"
      - ".github/actions/buildbuddy-cache/**"
      - "donner/gpu/shader/**"
      - "donner/svg/renderer/geode/**"
      - "donner/svg/renderer/RendererDriver.*"
      - "donner/svg/renderer/RendererGeode.*"

permissions:
  contents: read

jobs:
  # Classify pull request trust at job level, so the build job can bind the
  # BuildBuddy write environment only for runs allowed to write.
  trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
    steps:
      - name: Checkout trust action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/pr-trust

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust

  asan-geode:
    name: asan-geode
    runs-on: ubuntu-24.04
    needs: trust
    # Trusted pull requests bind buildbuddy-pr, whose key writes the pull request cache. This
    # pull-request-only workflow never receives main's key.
    environment:
      name: ${{ needs.trust.outputs.trusted_pr == 'true' && 'buildbuddy-pr' || '' }}
      deployment: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev clang-tidy-19

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-geode
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      # BuildBuddy remote cache (docs/building.md). Trusted maintainer pull requests
      # write the pull request cache; Renovate pull requests only read main's;
      # every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        if: needs.trust.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          pr-api-key: ${{ secrets.BUILDBUDDY_PR_API_KEY }}
          trusted-pr: ${{ needs.trust.outputs.trusted_pr }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Configure BuildBuddy read-only cache
        if: needs.trust.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Test Geode with ASan
        run: bazelisk test --config=asan-geode-pr //tools/ci:asan_geode_pr
