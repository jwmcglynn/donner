name: Sanitizers PR

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  pull_request:
    paths:
      # A change to this workflow must run it, or the change merges untested.
      - ".github/workflows/sanitizers-pr.yml"
      - "tools/ci/**"
      - ".github/actions/buildbuddy-cache/**"
      - "donner/gpu/shader/**"
      - "donner/svg/renderer/geode/**"
      - "donner/svg/renderer/RendererDriver.*"
      - "donner/svg/renderer/RendererGeode.*"

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read

jobs:
  # Classify pull request trust at job level, so the build job can bind the
  # BuildBuddy write environment only for runs allowed to write.
  trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
    steps:
      - name: Checkout trust action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/pr-trust

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust

  asan-geode:
    name: asan-geode
    runs-on: ubuntu-24.04
    needs: trust
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.trust.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    # Budget: the test step takes 3 to 15 minutes and a normal apt step under 30 seconds. Every
    # run cancelled at this limit had a hosted runner whose Ubuntu mirror served 38 to 64 kB/s,
    # which stretched a 59.4 MB apt step to 15 to 24 minutes before the build started; the CI linux
    # job saw the same slow mirror in about one run in ten. This job now downloads only Mesa's
    # 17.5 MB Vulkan driver, about 8 minutes at the slowest rate seen. If the lane approaches the
    # limit, cut work or restore caching; do not raise it.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Geode test suite links only libdl and libpthread from the host, against the LLVM
      # toolchain's own sysroot, and loads the Vulkan loader and Mesa's software Vulkan driver at
      # run time. Development packages and compilers from the archive would only lengthen this
      # download, which a slow mirror turns into most of the job's budget.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers libvulkan1
          # One attempt at the slowest mirror rate seen takes about 8 minutes, so an attempt still
          # running at 10 is stalled. The default 15 minutes left too little of the job's budget
          # for the retry and the build that follow it.
          attempt-timeout: 10m

      # This workflow runs only for pull requests, which never save caches, so nothing keyed on
      # this job is ever written: its disk cache and external repository manifest were never
      # restored, and every run fetched the LLVM toolchain and sysroot again during analysis.
      # Restore the external repositories that the CI workflow's linux job saves from main instead.
      # They are keyed by repository name and MODULE.bazel, so the same entries serve this lane;
      # the manifest entries below skip the browser and WebAssembly toolchains it never uses. A
      # repository missing from that manifest is fetched during analysis, as before.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: |
            name: ci-linux
            manifest:
              "emsdk++emscripten_deps+emscripten_bin_linux": false
              "+_repo_rules3+playwright_chromium_headless_linux_x64": false
              "+_repo_rules3+playwright_chromium_linux_x64": false
              "rules_nodejs++node+nodejs_linux_amd64": false
          cache-save: false

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.trust.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.trust.outputs.trusted_pr }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Configure BuildBuddy read-only cache
        if: needs.trust.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Test Geode with ASan
        run: bazelisk test --config=asan-geode-pr //tools/ci:asan_geode_pr
