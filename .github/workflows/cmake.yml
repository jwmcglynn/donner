name: CMake Build

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: ["*"]
  pull_request:

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
      is_duplicate_push: ${{ steps.dup_push.outputs.is_duplicate_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: dup_push
        name: Detect duplicate push (PR already open for this branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py duplicate-push

      - id: docs_only
        name: Detect docs-only PR
        run: python3 tools/ci/gatekeeper.py docs-only

  validate-generator:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This check queries the Bazel graph, so retry it once when the first
      # attempt fails. Deterministic generator failures fail again on retry;
      # compile and test steps remain single-attempt.
      - id: cmake-generator-check
        name: Validate generated CMakeLists.txt
        continue-on-error: true
        run: python3 tools/cmake/gen_cmakelists.py --check

      - name: Retry generated CMakeLists.txt validation
        if: steps.cmake-generator-check.outcome == 'failure'
        run: python3 tools/cmake/gen_cmakelists.py --check

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [gatekeeper, validate-generator]
    # PRs and main build and test this consumer in the consolidated CI Linux job.
    # Keep standalone branch-push coverage before a PR exists.
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 750M
    # Keep the only active backend as a non-matrix job so a superseded run and
    # its replacement use the same stable check name. Reintroduce distinct jobs
    # when the Skia CMake lane is restored.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        uses: ./.github/actions/apt-install
        with:
          packages: ccache ninja-build

      # Only main writes the Actions cache, and this job never runs on main, so
      # it builds without restoring CMake dependency or compiler caches.

      - name: Build with CMake (tiny_skia)
        run: tools/ci/cmake_consumer.sh build --ccache

  macos:
    runs-on: xcode-27
    timeout-minutes: 60
    needs: [gatekeeper, validate-generator]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 750M
    # Keep this paired with the stable Linux job name above.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      - name: Install build tools
        run: tools/ci/cmake_consumer.sh install-tools

      # Cache key includes both gen_cmakelists.py AND MODULE.bazel because the
      # generated CMakeLists.txt embeds FetchContent versions extracted from
      # MODULE.bazel. A version bump must invalidate the cached build/_deps
      # tree -- otherwise FetchContent's git stash/unstash dance fails when it
      # tries to retarget a cached source checkout to the new tag.
      # external_deps.json and the Bazel lock/module-extension files are included
      # because they can change emitted CMake dependency edges.
      # restore-keys is intentionally absent: a partial-match restore would
      # bring in incompatible state.
      # Every run restores; only main pushes save (below), so pull requests
      # read main's entries without spending the shared cache budget.
      - name: Restore CMake dependencies
        id: cmake-deps
        uses: actions/cache/restore@v6
        with:
          path: build/_deps
          key: cmake-deps-macos-tiny_skia-${{ env.DONNER_CI_XCODE_IDENTITY }}-${{ hashFiles('tools/cmake/gen_cmakelists.py', 'tools/cmake/external_deps.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'third_party/bazel/non_bcr_deps.bzl') }}

      - name: Restore compiler outputs
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-macos-tiny_skia-${{ env.DONNER_CI_XCODE_IDENTITY }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-tiny_skia-${{ env.DONNER_CI_XCODE_IDENTITY }}-

      - name: Build with CMake (tiny_skia)
        run: tools/ci/cmake_consumer.sh build --ccache

      - name: Save main CMake dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cmake-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/_deps
          # The restore step's key: the build writes MODULE.bazel.lock, so
          # recomputing it here would save under a key no restore requests.
          key: ${{ steps.cmake-deps.outputs.cache-primary-key }}

      - name: Save main compiler outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
