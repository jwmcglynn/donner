          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/bazelisk
          test -x /opt/homebrew/bin/bazel
          test -x /opt/homebrew/opt/llvm@19/bin/clang-tidy

      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: |
          bazelisk --nohome_rc --nosystem_rc fetch --force --lockfile_mode=off \
            --repo=@@bazel_tools+xcode_configure_extension+local_config_xcode \
            --repo=@@apple_support++apple_cc_configure_extension+local_config_apple_cc \
            --repo=@@apple_support++apple_cc_configure_extension+local_config_apple_cc_toolchains

      - name: Ensure offline Metal compiler
        id: metal_setup
        timeout-minutes: 12
        run: python3 tools/ci_metal_toolchain.py --install-missing

      - name: Report Metal component status
        if: ${{ failure() && steps.metal_setup.outcome == 'failure' }}
        timeout-minutes: 2
        run: python3 tools/ci_metal_toolchain.py --describe

      # The only shader-validation gate in CI: the hosted image's virtual GPU cannot run it,
      # so main runs none. The capability probe and native suites are mandatory whenever this job runs.
      - name: Require full Metal shader validation
        id: metal_profile
        shell: bash
        run: |
          set -euo pipefail
          bazelisk --nohome_rc --nosystem_rc test --config=ci --nocache_test_results --noskip_incompatible_explicit_targets --test_tag_filters= --test_output=errors \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS \
            //tools/ci:metal_full_validation

      - name: Metal validation preflight
        id: metal_preflight
        shell: bash
        run: |
          set -euo pipefail
          tools/ci_bazel_test.sh bazelisk --nohome_rc --nosystem_rc test --config=ci --nocache_test_results --noskip_incompatible_explicit_targets --test_output=errors \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS \
            //tools/ci:metal_preflight

      - name: Validate offline Metal compiler
        id: metal_compiler
        shell: bash
        run: |
          set -euo pipefail
          tools/ci_bazel_test.sh bazelisk --nohome_rc --nosystem_rc test --config=ci --nocache_test_results --noskip_incompatible_explicit_targets --test_output=errors \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS \
            //tools/ci:metal_offline_compiler

      - name: Test remaining native Metal suite
        id: metal_native
        shell: bash
        run: |
          set -euo pipefail
          tools/ci_bazel_test.sh bazelisk --nohome_rc --nosystem_rc test --config=ci --nocache_test_results --noskip_incompatible_explicit_targets --test_output=errors \
            --build_event_json_file="$RUNNER_TEMP/coverage-metal_native.bep.json" \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS \
            //tools/ci:metal_native

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.metal_compiler.outcome == 'failure' || steps.metal_profile.outcome == 'failure' || steps.metal_preflight.outcome == 'failure' || steps.metal_native.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt macos-metal

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-macos-metal
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      # Remove the BuildBuddy key and its workspace helper, whatever the outcome.
      - name: Remove BuildBuddy credentials
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/buildbuddy" "${GITHUB_WORKSPACE}/.buildbuddy.bazelrc"

  macos-hosted-parity:
    # Hosted-parity subset for trusted PRs: after the fast lane, reruns the affected
    # `hosted_parity` tests and the Geode editor lane under main's hosted macOS configuration
    # (--config=hosted-parity in .bazelrc), only when the affected set reaches one. It can queue
    # another pull request's fast lane on the shared runner for its duration.
    runs-on: [self-hosted, macOS-vm, ARM64]
    needs: [gatekeeper, determine-targets, macos-self-hosted]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos == 'true' && (needs.determine-targets.outputs.fallback == 'true' || needs.determine-targets.outputs.hosted_parity_affected == 'true') }}
    timeout-minutes: 60
    # Bound to the trusted-PR BuildBuddy write environment exactly like macos-self-hosted.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      # The key-affecting flags of every macOS lane (//tools:macos_cache_key_parity_tests), so
      # this job builds with the fast lane's action keys and its builds hit the remote cache.
      BAZEL_MACOS_BUILD_FLAGS: "--config=ci-macos --macos_minimum_os=13.3"
      # Main's hosted test environment under this lane's own name, so its test results are never
      # shared with the hosted lane's or the fast lane's.
      BAZEL_MACOS_TEST_FLAGS: "--test_env=HOME --//build_defs:metal_shader_validation=off --test_env=MTL_SHADER_VALIDATION_TEXTURE_USAGE=0 --test_env=DONNER_CI_MACOS_LANE=hosted-parity-vm"
      # Free space, in GiB, required before Bazel runs: the fast lane's threshold, since this job
      # writes the same output root and can fall back to //....
      MIN_FREE_DISK_GIB: "30"
      GEODE_EDITOR_TARGETS: >-
        //tools/ci:editor_geode
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before Bazel, so a full disk fails in seconds with a clear error instead of
      # minutes to an hour in as a Bazel ENOSPC, a job timeout or a lost runner
      # connection, which read like failures of the change under test.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # Select from the same approved policy as the fast lane. The actual tuple
      # determines which hosted lanes can share its action and cache keys.
      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      - name: Prepare self-hosted macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/bazelisk
          test -x /opt/homebrew/bin/bazel
          test -x /opt/homebrew/opt/llvm@19/bin/clang-tidy

      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: |
          bazelisk --nohome_rc --nosystem_rc fetch --force --lockfile_mode=off \
            --repo=@@bazel_tools+xcode_configure_extension+local_config_xcode \
            --repo=@@apple_support++apple_cc_configure_extension+local_config_apple_cc \
            --repo=@@apple_support++apple_cc_configure_extension+local_config_apple_cc_toolchains

      - name: Test
        id: test
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the test step."
            exit 1
          fi
          tools/ci_bazel_test.sh bazelisk --nohome_rc --nosystem_rc test --config=ci \
            --config=hosted-parity-subset --test_output=errors \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $TARGETS

      - name: Test (Geode editor lane)
        id: geode_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          bazelisk --nohome_rc --nosystem_rc test --config=ci --config=geode --config=hosted-parity-runtime \
            --test_output=errors --build_event_json_file="$RUNNER_TEMP/coverage-geode_test.bep.json" \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $GEODE_EDITOR_TARGETS

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.test.outcome == 'failure' || steps.geode_test.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt macos-hosted-parity

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-macos-hosted-parity
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      # Remove the BuildBuddy key and its workspace helper, whatever the outcome.
      - name: Remove BuildBuddy credentials
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/buildbuddy" "${GITHUB_WORKSPACE}/.buildbuddy.bazelrc"

  coverage-contract:
    # Fails a trusted pull request whose lanes skipped a phase or test class that main's hosted
    # lanes run. tools/ci/coverage_contract.json declares each main-hosted phase, the classes of
    # tests it covers and the pull request steps that cover each class; every job above uploads a
    # receipt of the steps it ran, with test counts from Bazel's build events. A class this pull
    # request's changes select must have a counterpart that ran, or a reviewed exception in the
    # manifest that names its owner; the exceptions are printed on every run. Untrusted pull
    # requests and main pushes run main's hosted lanes themselves, so this runs when the
    # self-hosted Linux lane replaced hosted Linux; when hosted macOS ran (the ci:hosted-macos
    # label or a disabled macOS runner), the macOS lane needs no counterparts. It runs no build:
    # it reads receipts on a self-hosted Linux runner, so a trusted pull request gains no hosted
    # job. Hosted main also retains browser and Geode build event files for consistent
    # reporting across the different execution venues.
    runs-on: [self-hosted, linux, arm64]
    needs: [gatekeeper, determine-targets, linux, linux-self-hosted, macos-self-hosted, macos-metal, macos-browser, macos-hosted-parity]
    if: ${{ !cancelled() && needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download coverage receipts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-receipt-*
          path: ${{ runner.temp }}/coverage-receipts

      - name: Compare receipts with the coverage contract
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci_coverage_contract.py check | tee -a "$GITHUB_STEP_SUMMARY"
