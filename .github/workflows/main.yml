name: CI

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Validate PRs targeting main or a dependency branch in a stack.
#
# Title and description edits do not run CI. A base-branch change calls this workflow through
# pr_base_change.yml; later edits of that head do not rerun it, and its run stays on the head.
# The PR body check runs separately in pr_metadata.yml.
on:
  push:
    branches: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    # The repository secrets a step here reads. A called workflow receives only the
    # secrets its caller passes. A job that binds the buildbuddy-write environment can
    # also read that environment's key; base-change runs bind it only for trusted
    # maintainer pull requests, which may write the cache.
    secrets:
      BUILDBUDDY_API_KEY_READONLY:
        required: false

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read
  pull-requests: read
  actions: read

# Retry policy: network-sensitive steps (checkout, apt install, bazel fetch)
# are retried to survive transient GitHub/registry outages. Build/test steps
# are NOT retried -- a real test failure should surface immediately.

# Self-hosted runner gates (repo Settings -> Variables). Enabled switches
# route only same-repository operator PRs to the matching ARM64 runner; main
# pushes and untrusted PRs use GitHub-hosted runners. Both the original actor
# and rerun actor must be the operator. An explicit false switch keeps the
# hosted lane available during a runner outage.

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
      is_duplicate_push: ${{ steps.dup_push.outputs.is_duplicate_push }}
      use_self_hosted_linux: ${{ steps.runner_gate.outputs.use_self_hosted_linux }}
      use_self_hosted_macos: ${{ steps.runner_gate.outputs.use_self_hosted_macos }}
      # The one pull request trust rule (.github/actions/pr-trust), shared with BuildBuddy.
      unified_re_default: ${{ steps.pr_trust.outputs.unified_re_default }}
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
    steps:
      - id: admission_source
        name: Checkout trusted admission code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: |
            tools/ci/gatekeeper.py
            tools/ci/github_rate_limit.py
            .github/actions/pr-trust
          sparse-checkout-cone-mode: false

      - id: comparison_source
        name: Checkout PR files for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          path: pr-input
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      # Admission and trust execute only base-pinned code; PR files are comparison data.
      - id: dup_push
        name: Detect duplicate push (PR already open for this branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py duplicate-push

      - id: docs_only
        name: Detect docs-only PR
        working-directory: ${{ github.event_name == 'pull_request' && 'pr-input' || '.' }}
        run: python3 "$GITHUB_WORKSPACE/tools/ci/gatekeeper.py" docs-only

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust

      - id: runner_gate
        name: Determine trusted self-hosted runner routing
        env:
          TRUSTED_PR: ${{ steps.pr_trust.outputs.trusted_pr }}
          SELFHOSTED_LINUX_RUNNER: ${{ vars.SELFHOSTED_LINUX_RUNNER }}
          SELFHOSTED_MACOS_RUNNER: ${{ vars.SELFHOSTED_MACOS_RUNNER }}
        shell: bash
        run: |
          set -euo pipefail

          hosted_macos_label="$(
            python3 - <<'PY'
          import json
          import os

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          labels = (event.get("pull_request") or {}).get("labels") or []
          print("true" if isinstance(labels, list) and any(
              isinstance(label, dict) and label.get("name") == "ci:hosted-macos"
              for label in labels
          ) else "false")
          PY
          )"

          use_linux=false
          use_macos=false
          if [[ "$TRUSTED_PR" == "true" && "$SELFHOSTED_LINUX_RUNNER" == "true" ]]; then
            use_linux=true
          fi
          # An operator PR can select hosted macOS for this run without changing Linux routing.
          if [[ "$TRUSTED_PR" == "true" && "$SELFHOSTED_MACOS_RUNNER" == "true" &&
                "$hosted_macos_label" != "true" ]]; then
            use_macos=true
          fi

          echo "use_self_hosted_linux=$use_linux" >> "$GITHUB_OUTPUT"
          echo "use_self_hosted_macos=$use_macos" >> "$GITHUB_OUTPUT"
          echo "runner_route trusted_pr=$TRUSTED_PR linux=$use_linux macos=$use_macos"

  determine-targets:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') }}
    env:
      BAZEL_DIFF_TAG: "v18.1.0"
      BAZEL_DIFF_SHA256: "eadec6d0ca0991de78bd9e063bfed993a359ed3bc60e507818077c300b6f58e0"
    outputs:
      fallback: ${{ steps.determine.outputs.fallback }}
      affected: ${{ steps.determine.outputs.affected }}
      full_test: ${{ steps.determine.outputs.full_test }}
      browser_affected: ${{ steps.determine.outputs.browser_affected }}
      metal_affected: ${{ steps.determine.outputs.metal_affected }}
      wgpu_reference: ${{ steps.select_wgpu_resvg.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: pr-meta
        name: Extract SHA for hash caching
        shell: bash
        run: tools/ci/determine_targets.sh pr-meta

      - name: Setup Java
        if: steps.pr-meta.outputs.identical_tree != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Bazel
        if: steps.pr-meta.outputs.identical_tree != 'true'
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: false

      - name: Download bazel-diff
        if: steps.pr-meta.outputs.identical_tree != 'true'
        shell: bash
        run: tools/ci/fetch_bazel_diff.sh

      # Base hashes are a pure function of (bazel-diff version, base SHA), and
      # generating them is roughly half of this job's bazel-diff wall time.
      # PRs restore them here; pushes to main generate and save them below so
      # the first PR against any main commit already hits warm. Caches created
      # on main are visible to all PR branches. Only main writes this cache.
      - name: Restore bazel-diff base hashes
        id: base-hashes
        if: steps.pr-meta.outputs.identical_tree != 'true' && steps.pr-meta.outputs.base_sha != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bazel-diff-base-hashes/${{ steps.pr-meta.outputs.base_sha }}.json
          key: bazel-diff-base-hashes-tt-${{ env.BAZEL_DIFF_TAG }}-${{ steps.pr-meta.outputs.base_sha }}

      - id: determine
        name: Determine affected Bazel targets
        shell: bash
        run: tools/ci/determine_targets.sh determine

      # A failed pre-warm removes its partial file; saving a missing path only warns.
      - name: Save main bazel-diff base hashes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.pr-meta.outputs.base_sha != '' && steps.base-hashes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bazel-diff-base-hashes/${{ steps.pr-meta.outputs.base_sha }}.json
          key: ${{ steps.base-hashes.outputs.cache-primary-key }}

      - name: Select Linux WebGPU resvg reference
        id: select_wgpu_resvg
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          WGPU_REFERENCE_AFFECTED: ${{ steps.determine.outputs.wgpu_reference_affected }}
          WGPU_REFERENCE_CHANGED: ${{ steps.determine.outputs.wgpu_reference_changed }}
          WGPU_REFERENCE_UNKNOWN: ${{ steps.determine.outputs.wgpu_reference_unknown }}
          FULL_TEST: ${{ steps.determine.outputs.full_test }}
        run: tools/ci/determine_targets.sh select-wgpu-reference

  linux:
    # One x86_64 workspace owns native, local-display, linker and closure checks.
    runs-on: ubuntu-24.04
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux != 'true' }}
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      # The planner's selection, which tools/ci/lane.py reads.
      TARGETS_FALLBACK: ${{ needs.determine-targets.outputs.fallback }}
      TARGETS_AFFECTED: ${{ needs.determine-targets.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            ninja-build pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6 clang-tidy-19 xvfb xauth

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Restore Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        id: buildbuddy
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          remote-execution: "true"
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Configure BuildBuddy read-only cache
        if: needs.gatekeeper.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Verify BuildBuddy remote execution
        id: buildbuddy_verify
        if: steps.buildbuddy.outputs.bazel-flags != ''
        env:
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: python3 tools/ci/lane.py phase linux buildbuddy_verify

      - name: Build
        id: build
        if: ${{ needs.gatekeeper.outputs.use_self_hosted_linux != 'true' }}
        env:
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: python3 tools/ci/lane.py phase linux build

      - name: Test
        id: test
        if: ${{ !cancelled() && needs.gatekeeper.outputs.use_self_hosted_linux != 'true' && (success() || needs.determine-targets.outputs.wgpu_reference == 'true') }}
        env:
          LINUX_REFERENCE_ONLY: ${{ steps.build.outcome != 'success' }}
          WGPU_REFERENCE: ${{ needs.determine-targets.outputs.wgpu_reference }}
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: python3 tools/ci/lane.py phase linux test

      - name: Probe runner resources after tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: python3 -u tools/ci_disk_cache.py probe --stage after-test --marker "${RUNNER_TEMP}/bazel-disk-restore.marker"

      - name: Upload Bazel test failure artifacts
        if: failure() && steps.test.outcome == 'failure'
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Linker canary (non-lld linker support)
        id: linker_canary
        shell: bash
        run: python3 tools/ci/lane.py phase linux linker_canary

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Save Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native
          mode: save

  # Admit the operator's ARM64 Linux job from a hosted runner. The FIFO wait
  # cannot run on the constrained self-hosted pool itself: newer runs could
  # occupy every runner while the oldest lane job remains queued, creating a
  # head-of-line deadlock. This lightweight prerequisite waits off-pool and
  # releases dependent self-hosted jobs in submission order. The pool is sized
  # to the runner fleet, so up to four Linux jobs run at once.
  linux-self-hosted-turnstile:
    runs-on: ubuntu-24.04
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    timeout-minutes: 165
    steps:
      - name: Checkout turnstile action
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for Linux self-hosted lane
        uses: ./.github/actions/re-turnstile
        with:
          lane: linux-self-hosted
          pool: linux-self-hosted
          # pr_base_change.yml runs this workflow as a reusable workflow call
          # after a base-branch change, so its runs share the pool.
          pool-workflows: main.yml pr_base_change.yml
          capacity: "4"
          token: ${{ github.token }}
          timeout-minutes: "150"

  # Operator's ARM64 Linux runs on the operator's self-hosted runner.
  # Replaces hosted Linux for trusted operator PRs; x86_64 remains on main.
  # Main pushes, Renovate, and non-operator runs stay hosted.
  # The runner host pre-provisions the toolchain (fontconfig, freetype, mesa,
  # vulkan, X11, clang-tidy) and its own Bazel cache configuration, so there
  # is no apt/setup-bazel step. The runner intentionally has
  # no host GPU device passthrough; Mesa llvmpipe/lavapipe provide the same
  # software rendering path used by GitHub-hosted Linux so this lane runs the
  # same test surface instead of excluding graphics targets.
  linux-self-hosted:
    runs-on: [self-hosted, linux, arm64]
    needs: [gatekeeper, determine-targets, linux-self-hosted-turnstile]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    # RE-availability SLA lane. A healthy affected-target run is ~21 min. This
    # budget applies only after the hosted turnstile admits this job. It retains
    # ample room for an unusually slow build without making the admission wait
    # consume a constrained runner. RE-degradation fast-fail is unchanged and
    # lives at the Bazel layer (no local fallback + --remote_timeout=60s
    # below), so a
    # wedged/degraded backend still fails in about a minute regardless of this
    # backstop.
    timeout-minutes: 210
    # Admission control on the shared remote-execution backend. The self-hosted
    # Linux lane executes on a backend that an interactive development host also uses
    # with priority; unbounded concurrent operator PRs oversubscribe it and
    # crawl into the 60 min timeout (measured). Admission is enforced by the
    # hosted re-turnstile prerequisite above, NOT by a GitHub concurrency group.
    # A concurrency group caps the queue at one pending run and cancels any
    # older pending run when a third concurrent run arrives, so a parallel-PR
    # burst drops pending PR runs. The turnstile instead holds each run until
    # its turn, FIFO,
    # so N concurrent runs all execute in submission order and none are
    # cancelled. Bounding CI's demand on the backend also protects the
    # interactive host's latency. The bound is a pool sized to the runner
    # fleet.
    env:
      # Every self-hosted run uploads its diagnostics report, Bazel profiles
      # and any stall note so slow runs can be attributed to targets/actions
      # without live SSH. The build event and execution logs feed the report
      # but stay on the runner: they record the host's effective Bazel
      # configuration, which a public artifact must not carry. Keep artifacts
      # small; retention is 3 days. DIAG_DIR is exported from the first step
      # ($RUNNER_TEMP; the `runner` context is not available in job-level env).
      # The planner's selection, which tools/ci/lane.py reads.
      TARGETS_FALLBACK: ${{ needs.determine-targets.outputs.fallback }}
      TARGETS_AFFECTED: ${{ needs.determine-targets.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record target selection
        shell: bash
        run: |
          set -euo pipefail
          DIAG_DIR="$RUNNER_TEMP/donner-ci-diagnostics"
          echo "DIAG_DIR=$DIAG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$DIAG_DIR"/{fetch,build,test}
          {
            echo "run_id=${{ github.run_id }} attempt=${{ github.run_attempt }} sha=${{ github.sha }}"
            echo "fallback=${{ needs.determine-targets.outputs.fallback }}"
          } | tee "$DIAG_DIR/manifest.txt"
          if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..." > "$DIAG_DIR/target-list.txt"
          else
            echo "${{ needs.determine-targets.outputs.affected }}" | tr ' ' '\n' > "$DIAG_DIR/target-list.txt"
          fi
          echo "target_count=$(grep -c . "$DIAG_DIR/target-list.txt")" | tee -a "$DIAG_DIR/manifest.txt"

      - name: Check native consumer tools
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in xvfb-run Xvfb xauth; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::Self-hosted Linux is missing required native consumer tool: $tool"
              missing=1
            fi
          done
          exit "$missing"

      - name: Sync Bazel toolchain
        # NixOS injects include paths via NIX_CFLAGS_COMPILE, which Bazel does
        # not track in cc_configure's cache key; a stale @local_config_cc then
        # omits them and the hermetic include scanner rejects /nix/store
        # headers. Surgically reset ONLY @local_config_cc so it regenerates
        # against the current env. This replaces `bazelisk clean --expunge`,
        # which also wiped the persistent /var/cache/bazel LLVM toolchain and
        # forced a ~5-minute re-download+re-extract of it on every run.
        shell: bash
        run: |
          set -euo pipefail
          output_base=$(bazelisk info output_base)
          bazelisk shutdown
          # Match the repo dir + marker under any Bzlmod canonical name
          # (local_config_cc, ...+local_config_cc, @local_config_cc.marker).
          find "$output_base/external" -maxdepth 1 -name '*local_config_cc*' \
            -print -exec rm -rf {} + 2>/dev/null || true

      - name: Test Linux and macOS with native platform transitions
        id: unified
        if: github.event_name == 'pull_request' && vars.UNIFIED_RE_CANARY != 'false' && (needs.gatekeeper.outputs.unified_re_default == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:native-platform-canary'))
        timeout-minutes: ${{ needs.determine-targets.outputs.affected == '//tools/ci:no_affected_targets' && 10 || (needs.determine-targets.outputs.fallback == 'true' && 150 || 90) }}
        env:
          WGPU_REFERENCE: ${{ needs.determine-targets.outputs.wgpu_reference }}
          RUN_DARWIN: ${{ needs.gatekeeper.outputs.use_self_hosted_macos }}
          RUN_METAL: ${{ needs.gatekeeper.outputs.use_self_hosted_macos == 'true' && (needs.determine-targets.outputs.metal_affected == 'true' || needs.determine-targets.outputs.fallback == 'true') }}
          RUN_BROWSER: ${{ needs.determine-targets.outputs.browser_affected == 'true' || needs.determine-targets.outputs.fallback == 'true' }}
          WORKER_QUALIFICATION: ${{ contains(github.event.pull_request.labels.*.name, 'ci:vm-qualification') }}
          BROWSER_DIAGNOSTIC: ${{ contains(github.event.pull_request.labels.*.name, 'ci:browser-context-probe') }}
        shell: bash
        run: |
          set -euo pipefail
          remote_identity=$(tools/ci_select_macos_xcode.sh --remote-canary-env)
          coordinator_cc=$(command -v "${CC:-clang}")
          suites=(//tools/ci:dual_platform_canary)
          if [[ "$RUN_METAL" == true ]]; then
            suites+=(//tools/ci:unified_metal_{full_validation,preflight,offline_compiler,native})
          fi
          options=()
          ordinary="$RUNNER_TEMP/darwin-targets.txt"
          linux="$RUNNER_TEMP/linux-targets.txt"
          : > "$ordinary"
          : > "$linux"
          requested=(//...)
          if [[ "$TARGETS_FALLBACK" != true ]]; then read -ra requested <<< "$TARGETS_AFFECTED"; fi
          if [[ "$TARGETS_AFFECTED" != //tools/ci:no_affected_targets ]]; then
            python3 tools/ci/darwin_selection.py query > "$ordinary.query"
            bazelisk query --nokeep_going --output=streamed_jsonproto --proto:rule_inputs_and_outputs=false \
              --proto:output_rule_attrs=tags --noproto:default_values --query_file="$ordinary.query" > "$linux.jsonl"
            python3 tools/ci_remote_gpu_targets.py --native-linux-patterns < "$linux.jsonl" > "$linux"
            if [[ "$RUN_DARWIN" == true ]]; then
              python3 tools/ci/darwin_selection.py variants < "$linux.jsonl" > "$ordinary"
            fi
          fi
          suites+=(//tools/ci:deterministic_fuzzer_soak)
          if [[ "$WGPU_REFERENCE" == true ]]; then suites+=(//tools/ci:linux_wgpu_resvg_reference); fi
          if [[ "$RUN_DARWIN" == true ]]; then
            suites+=(//tools/ci:unified_editor_geode)
            if [[ "$RUN_BROWSER" == true ]]; then
              suites+=(//tools/ci:unified_mac_browser_archive)
            fi
            if [[ "$WORKER_QUALIFICATION" == true ]]; then
              suites+=(//tools/ci:unified_worker_qualification)
              options+=(--runs_per_test='.*:ci_darwin_qualify_.*@4')
            fi
            if [[ "$BROWSER_DIAGNOSTIC" == true ]]; then
              suites+=(//tools/ci:unified_browser_diagnostic)
            fi
          fi
          patterns="$RUNNER_TEMP/native-target-patterns.txt"
          { printf '%s\n' "${suites[@]}"; cat "$ordinary" "$linux"; } > "$patterns"
          bep="$DIAG_DIR/test/bep.json"
          policy='flag_policies {flag_name:"remote_executor" commands:"test" disallow_values {disallowed_values:""}} flag_policies {flag_name:"experimental_remote_scrubbing_config" commands:"test" use_default {}}'
          env "$remote_identity" tools/ci/bazel_watchdog.sh "$DIAG_DIR/test/console.log" bazelisk --invocation_policy="$policy" test \
            --config=ci --config=ci-platforms --repo_env=CC="$coordinator_cc" --test_output=errors \
            --aspects=//tools/ci:linux_test_venue.bzl%linux_test_venue --experimental_google_legacy_api --noexperimental_merged_skyframe_analysis_execution \
            --strategy=TestRunner=remote,local --remote_local_fallback=false --incompatible_remote_local_fallback_for_remote_cache=false \
            --remote_timeout=60s --remote_download_outputs=minimal --remote_download_regex='.*(test[.]log|test[.]xml|outputs[.]zip)$' \
            --nokeep_going --nobuild_tests_only --skip_incompatible_explicit_targets --profile="$DIAG_DIR/test/profile.gz" \
            --execution_log_compact_file="$DIAG_DIR/test/exec.log.zst" --build_event_json_file="$bep" "${options[@]}" --target_pattern_file="$patterns"
          python3 tools/ci_remote_gpu_targets.py --check-results "$bep" "${requested[@]}"
          python3 tools/ci/verify_unified_tests.py --ordinary "$ordinary" --linux "$linux" "$bep" "${suites[@]}"
          cp "$bep" "$RUNNER_TEMP/coverage-unified.bep.json"

      - name: Stage failed mixed-platform test outputs
        if: failure() && steps.unified.outcome == 'failure'
        shell: bash
        run: python3 tools/ci/verify_unified_tests.py --stage-failed "$RUNNER_TEMP/unified" "$DIAG_DIR/test/bep.json"

      - name: Upload mixed-platform test failure artifacts
        if: failure() && steps.unified.outcome == 'failure'
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-unified-${{ github.run_attempt }}
          testlogs: ${{ runner.temp }}/unified/test-artifacts/mixed

      - name: Fetch Bazel LLVM toolchain
        if: steps.unified.outcome == 'skipped'
        shell: bash
        run: python3 tools/ci/lane.py phase linux-self-hosted fetch

      - name: Build
        id: build
        if: steps.unified.outcome == 'skipped'
        shell: bash
        run: python3 tools/ci/lane.py phase linux-self-hosted build

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.unified.outcome == 'skipped' && (success() || needs.determine-targets.outputs.wgpu_reference == 'true') }}
        env:
          LINUX_REFERENCE_ONLY: ${{ steps.build.outcome != 'success' }}
          WGPU_REFERENCE: ${{ needs.determine-targets.outputs.wgpu_reference }}
        shell: bash
        run: python3 tools/ci/lane.py phase linux-self-hosted test

      - name: Finish selected reference after mixed graph failure
        if: ${{ !cancelled() && steps.unified.outcome == 'failure' && needs.determine-targets.outputs.wgpu_reference == 'true' }}
        env:
          WGPU_REFERENCE: "true"
        run: python3 tools/ci/lane.py finish-reference

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt linux-self-hosted

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-linux-self-hosted
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Summarize diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diag_dir="${DIAG_DIR:-$RUNNER_TEMP/donner-ci-diagnostics}"
          if [[ -f tools/ci_diagnostics_report.py && ( -f "$diag_dir/build/profile.gz" || -f "$diag_dir/test/profile.gz" ) ]]; then
            python3 tools/ci_diagnostics_report.py "$diag_dir" | tee "$diag_dir/report.md" || true
            if [[ -s "$diag_dir/report.md" ]]; then
              cat "$diag_dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          # Derived files only; see the job environment comment above.
          path: |
            ${{ runner.temp }}/donner-ci-diagnostics/manifest.txt
            ${{ runner.temp }}/donner-ci-diagnostics/target-list.txt
            ${{ runner.temp }}/donner-ci-diagnostics/report.md
            ${{ runner.temp }}/donner-ci-diagnostics/*/profile.gz
            ${{ runner.temp }}/donner-ci-diagnostics/*/stall.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Bazel test failure artifacts
        if: failure() && steps.test.outcome == 'failure'
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

  # Advisory macOS shadow lane: the selection built and tested for macOS from a self-hosted Linux
  # runner, every action on a remote macOS executor. Opt-in, never gating, after this run's Linux
  # lane, one at a time; "Remote macOS shadow lane" in docs/building.md describes it.
  macos-remote-shadow-turnstile:
    runs-on: ubuntu-24.04
    needs: [gatekeeper, determine-targets, linux-self-hosted]
    if: ${{ !cancelled() && (needs.linux-self-hosted.result == 'success' || needs.linux-self-hosted.result == 'failure') && needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' && github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:macos-remote-shadow') || vars.MACOS_REMOTE_SHADOW_LANE == 'true') }}
    # Advisory like the lane: a crash or timeout here never fails the run.
    continue-on-error: true
    timeout-minutes: 40
    outputs:
      admitted: ${{ steps.wait.outputs.admitted }}
    steps:
      - name: Checkout turnstile action
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for the macOS remote shadow lane
        id: wait
        uses: ./.github/actions/re-turnstile
        with:
          lane: macos-remote-shadow
          pool: macos-remote-shadow
          pool-workflows: main.yml pr_base_change.yml
          pool-upstream: linux-self-hosted macos-remote-shadow-turnstile
          upstream-grace-minutes: "5"
          capacity: "1"
          token: ${{ github.token }}
          timeout-minutes: "30"
          timeout-result: skip

  macos-remote-shadow:
    runs-on: [self-hosted, linux, arm64]
    needs: [gatekeeper, determine-targets, linux-self-hosted, macos-remote-shadow-turnstile]
    if: ${{ !cancelled() && (needs.linux-self-hosted.result == 'success' || needs.linux-self-hosted.result == 'failure') && needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' && github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:macos-remote-shadow') || vars.MACOS_REMOTE_SHADOW_LANE == 'true') && needs.macos-remote-shadow-turnstile.outputs.admitted == 'true' }}
    # Never fails the run, even when the runner or the job itself fails.
    continue-on-error: true
    # The lane's --budget-minutes in tools/ci/lanes.py stays below this with room to report.
    timeout-minutes: 90
    env:
      # The planner's selection, which tools/ci/lane.py reads.
      TARGETS_FALLBACK: ${{ needs.determine-targets.outputs.fallback }}
      TARGETS_AFFECTED: ${{ needs.determine-targets.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test for macOS on the remote executor
        id: shadow
        continue-on-error: true
        shell: bash
        run: python3 tools/ci/lane.py phase macos-remote-shadow shadow

      # Derived files only; consoles, build event and execution logs stay on the runner.
      - name: Upload shadow lane summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-remote-shadow-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-remote-shadow/report.md
            ${{ runner.temp }}/macos-remote-shadow/shadow-summary.json
            ${{ runner.temp }}/macos-remote-shadow/*/profile.gz
          retention-days: 14
          if-no-files-found: ignore

      # Staged by the lane; the lane step continues on error, so its outcome decides.
      - name: Upload failed test logs and outputs
        if: ${{ !cancelled() && steps.shadow.outcome == 'failure' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: macos-remote-shadow-test-failures-${{ github.run_attempt }}
          testlogs: ${{ runner.temp }}/macos-remote-shadow/test-artifacts

  macos:
    runs-on: xcode-27
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos != 'true' }}
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      # Free space, in GiB, required after the caches are restored: a cold build of the tree
      # peaked near 27 GiB on this image, before tests and browser trees.
      MIN_FREE_DISK_GIB: "45"
      # The planner's selection, which tools/ci/lane.py reads.
      TARGETS_FALLBACK: ${{ needs.determine-targets.outputs.fallback }}
      TARGETS_AFFECTED: ${{ needs.determine-targets.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every macOS lane selects an approved tuple from tools/ci_macos_xcode.txt.
      # Lanes selecting the same version/build share action keys and a remote
      # cache partition; different tuples remain isolated. Missing all approved
      # versions or finding an ambiguous installation/build mismatch fails closed.
      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      # The xcode-27 image starts with far less free disk than a cold build of the tree needs.
      - name: Free hosted macOS disk
        shell: bash
        run: tools/ci/free_hosted_macos_disk.sh

      - name: Install clang-tidy
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            brew install --quiet llvm@19
            echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Restore Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      - name: Configure BuildBuddy read-only cache
        if: needs.gatekeeper.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      # Before Bazel, so a full disk fails in seconds with a clear error instead of an ENOSPC
      # late in the build.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # Regenerate the Xcode and Apple toolchain repositories for the selected
      # Xcode, as macos-self-hosted does; a restored external cache must not
      # carry another Xcode's.
      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: python3 tools/ci/lane.py phase macos refresh_xcode

      - name: Build and test
        id: test
        shell: bash
        run: python3 tools/ci/lane.py phase macos test

      # Browser tests hold wall-clock deadlines (a 10 s GPU device request, 30 s
      # test timeouts) that a browser starved of CPU cannot meet. On this
      # three-core runner, browsers co-scheduled with each other and with the
      # rest of the suite received about 5% of a core each and missed them,
      # while the same targets passed when rerun as a separate phase. Run every
      # test that launches a browser after the rest of the suite, one at a time.
      - name: Qualify pinned Chromium archive
        id: browser_preflight
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos browser_preflight

      - name: Test (browser targets)
        id: browser_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos browser_test

      - name: Test (Geode editor lane)
        id: geode_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos geode_test

      # Diagnostic only: disk, cache and memory use once the tests have run.
      - name: Probe runner resources after tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: python3 -u tools/ci_disk_cache.py probe --stage after-test --marker "${RUNNER_TEMP}/bazel-disk-restore.marker"

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.browser_preflight.outcome == 'failure' || steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure' || steps.geode_test.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      # A browser test that ended at its deadline records the window from its browser's
      # launch to that deadline. Slice the runner's system log to those windows for the browser's
      # own processes and for executable code-signing checks, which can delay a
      # browser helper's first launch. The unified log is host-wide, so only this
      # ephemeral hosted job collects it.
      - name: Collect browser stall system log
        id: browser_stall_log
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/browser-stall-system-log"
          mkdir -p "$out"
          iso='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          predicate='eventType == logEvent AND (process BEGINSWITH "Google Chrome for Testing" OR process == "syspolicyd" OR process == "amfid")'
          count=0
          while IFS= read -r -d '' window; do
            start=""
            end=""
            read -r start end _ < "$window" || true
            if [[ ! "$start" =~ $iso || ! "$end" =~ $iso ]]; then
              echo "Skipping malformed window: $window"
              continue
            fi
            count=$((count + 1))
            start="${start/T/ }"
            end="${end/T/ }"
            raw="${RUNNER_TEMP}/browser-stall-window-${count}.raw"
            if ! log show --style compact --timezone UTC \
                --start "${start%Z}+0000" --end "${end%Z}+0000" \
                --predicate "$predicate" > "$raw"; then
              echo "System log slice ${count} failed: $window"
            fi
            # Keep the launch end of the window, where a stalled first launch shows.
            head -c 2097152 "$raw" > "${out}/window-${count}.log"
            rm -f "$raw"
            if (( count == 4 )); then
              break
            fi
          done < <(find -H bazel-testlogs -path '*/browser-stall/system-log-window.txt' -type f -print0 2>/dev/null | sort -z)
          echo "Collected ${count} browser stall system log window(s)."

      - name: Upload browser stall system log
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-stall-system-log-${{ github.job }}
          path: ${{ runner.temp }}/browser-stall-system-log
          if-no-files-found: ignore
          retention-days: 14

      - name: Detect browser GPU acquisition failure
        id: browser_gpu_failure
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:browser-gpu-diagnostics'))) }}
        shell: bash
        env:
          BROWSER_GPU_DIAGNOSTICS_REQUESTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:browser-gpu-diagnostics') }}
        run: |
          set -euo pipefail
          should_probe="$BROWSER_GPU_DIAGNOSTICS_REQUESTED"
          for target in standalone_geode_browser_renderer_test; do
            log="bazel-testlogs/donner/editor/wasm/tests/${target}/test.log"
            if [[ -f "$log" ]] && grep -qF 'stage=selection outcome=deadline_pending' "$log"; then
              should_probe=true
            fi
            # A browser test ended at its deadline; its browser process states were recorded.
            if [[ -f "$log" ]] && grep -qF 'browser-stall-diagnostics deadline' "$log"; then
              should_probe=true
            fi
          done
          echo "run_probe=$should_probe" >> "$GITHUB_OUTPUT"

      - name: Compare browser GPU tests (serial)
        id: browser_gpu_serial
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: python3 tools/ci/lane.py phase macos browser_gpu_serial

      - name: Upload browser GPU comparison (serial)
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: browser-gpu-serial-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Compare browser GPU tests (parallel)
        id: browser_gpu_parallel
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: python3 tools/ci/lane.py phase macos browser_gpu_parallel

      - name: Upload browser GPU comparison (parallel)
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: browser-gpu-parallel-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Upload bounded browser GPU timing summaries
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-gpu-timings-${{ github.job }}
          path: |
            ${{ runner.temp }}/browser-gpu-serial-summary.json
            ${{ runner.temp }}/browser-gpu-parallel-summary.json
          if-no-files-found: warn
          retention-days: 14

      # Last step, after every Bazel command: evicts the action cache to its budget and saves
      # it on a main push.
      - name: Save Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native
          mode: save

  # Desktop-session browser cases have one native owner; headless cases run in the VM.

  macos-browser:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos == 'true' && (needs.determine-targets.outputs.fallback == 'true' || needs.determine-targets.outputs.browser_affected == 'true') }}
    timeout-minutes: 60
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      MIN_FREE_DISK_GIB: "30"
      # The planner's selection, which tools/ci/lane.py reads.
      TARGETS_FALLBACK: ${{ needs.determine-targets.outputs.fallback }}
      TARGETS_AFFECTED: ${{ needs.determine-targets.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      - name: Prepare self-hosted macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/bazelisk
          test -x /opt/homebrew/bin/bazel
          test -x /opt/homebrew/opt/llvm@19/bin/clang-tidy

      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: python3 tools/ci/lane.py phase macos-browser refresh_xcode

      - name: Qualify pinned Chromium archive
        id: browser_preflight
        shell: bash
        run: python3 tools/ci/lane.py phase macos-browser browser_preflight

      - name: Test (browser targets)
        id: browser_test
        shell: bash
        run: python3 tools/ci/lane.py phase macos-browser browser_test

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.browser_preflight.outcome == 'failure' || steps.browser_test.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt macos-browser

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-macos-browser
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Remove BuildBuddy credentials
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/buildbuddy" "${GITHUB_WORKSPACE}/.buildbuddy.bazelrc"

  macos-self-hosted:
    runs-on: [self-hosted, macOS-vm, ARM64]
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos == 'true' }}
    # Bound at 60 min so healthy affected-target runs have buffer while a stuck
    # run still fails instead of tailing for hours.
    timeout-minutes: 60
    # Shares the BuildBuddy remote cache with the GitHub-hosted macOS lanes. This job only runs for trusted maintainer
    # pull requests, so it binds the buildbuddy-write environment exactly as the
    # `macos` job does for them.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      # Free space, in GiB, required on every filesystem this job writes. It
      # bounds the job's working set: infrastructure PRs and full-graph
      # fallbacks build and test all of //... with locally executed actions.
      # This is
      # intended to cover such a run with margin.
      MIN_FREE_DISK_GIB: "30"
      # The planner's selection, which tools/ci/lane.py reads.
      TARGETS_FALLBACK: ${{ needs.determine-targets.outputs.fallback }}
      TARGETS_AFFECTED: ${{ needs.determine-targets.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before Bazel, so a full disk fails in seconds with a clear error instead of
      # minutes to an hour in as a Bazel ENOSPC, a job timeout or a lost runner
      # connection, which read like failures of the change under test.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # When this lane selects the same approved tuple as a hosted lane, their
      # action keys match. Missing all approved versions, ambiguous discovery or
      # an unexpected build fails here rather than selecting another toolchain.
      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      # BuildBuddy remote cache, shared with the GitHub-hosted macOS lanes under
      # the selected approved tuple's partition (docs/building.md). The action fails
      # rather than writing to another partition when this runner has none. It
      # runs before "Prepare self-hosted macOS toolchain", the first step that
      # touches Bazel.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      - name: Prepare self-hosted macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/bazelisk
          test -x /opt/homebrew/bin/bazel
          test -x /opt/homebrew/opt/llvm@19/bin/clang-tidy

      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: python3 tools/ci/lane.py phase macos-self-hosted refresh_xcode

      - name: Build and test
        id: test
        shell: bash
        run: python3 tools/ci/lane.py phase macos-self-hosted test

      # Browser tests share the GPU with native replays and need their own serial phase.
      # Headed-browser tests need a desktop session; the required native desktop browser job runs them.

      - name: Qualify pinned Chromium archive
        id: browser_preflight
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos-self-hosted browser_preflight

      - name: Test (browser targets)
        id: browser_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos-self-hosted browser_test

      - name: Test (Geode editor lane)
        id: geode_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos-self-hosted geode_test

      - name: Diagnose Chromium context lifecycle
        id: browser_context_diagnostic
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gatekeeper.outputs.trusted_pr == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:browser-context-probe') }}
        shell: bash
        run: python3 tools/ci/lane.py phase macos-self-hosted browser_context_diagnostic

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.browser_preflight.outcome == 'failure' || steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure' || steps.geode_test.outcome == 'failure' || steps.browser_context_diagnostic.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt macos-self-hosted

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-macos-self-hosted
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      # Remove the BuildBuddy key and its workspace helper, whatever the outcome.
      - name: Remove BuildBuddy credentials
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/buildbuddy" "${GITHUB_WORKSPACE}/.buildbuddy.bazelrc"

  macos-vm-qualification:
    runs-on: [self-hosted, macOS-vm-qualification, ARM64]
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:vm-qualification') }}
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4]
    timeout-minutes: 60
    env:
      MIN_FREE_DISK_GIB: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check runner disk space
        run: tools/ci_check_runner_disk.sh

      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: python3 tools/ci/lane.py phase macos-vm-qualification refresh_xcode

      - name: Qualify concurrent VM workload
        id: qualification
        shell: bash
        run: python3 tools/ci/lane.py phase macos-vm-qualification qualification

      - name: Record VM qualification execution evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt macos-vm-qualification

      - name: Require four executed qualification tests
        if: success()
        shell: bash
        run: python3 tools/ci/lane.py phase macos-vm-qualification require_executed

      - name: Retain VM qualification execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-qualification-evidence-${{ matrix.instance }}
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload Bazel test failure artifacts
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ matrix.instance }}

  macos-metal:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos == 'true' && (needs.determine-targets.outputs.fallback == 'true' || needs.determine-targets.outputs.metal_affected == 'true') }}
    # Bound at 60 min so healthy affected-target runs have buffer while a stuck
    # run still fails instead of tailing for hours.
    timeout-minutes: 60
    # Shares the BuildBuddy remote cache with the GitHub-hosted macOS lanes. This job only runs for trusted maintainer
    # pull requests, so it binds the buildbuddy-write environment exactly as the
    # `macos` job does for them.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      # Free space, in GiB, required on every filesystem this job writes. It
      # bounds the job's working set: infrastructure PRs and full-graph
      # fallbacks build and test all of //... with locally executed actions.
      # This is
      # intended to cover such a run with margin.
      MIN_FREE_DISK_GIB: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before Bazel, so a full disk fails in seconds with a clear error instead of
      # minutes to an hour in as a Bazel ENOSPC, a job timeout or a lost runner
      # connection, which read like failures of the change under test.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # Select an approved tuple from tools/ci_macos_xcode.txt. Action keys match
      # hosted lanes on that tuple; missing all approved versions or invalid
      # discovery/build identity fails closed.
      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      # BuildBuddy remote cache, shared with the GitHub-hosted macOS lanes under
      # the selected approved tuple's partition (docs/building.md). The action fails
      # rather than writing to another partition when this runner has none. It
      # runs before "Prepare self-hosted macOS toolchain", the first step that
      # touches Bazel.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      - name: Prepare self-hosted macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/bazelisk
          test -x /opt/homebrew/bin/bazel
          test -x /opt/homebrew/opt/llvm@19/bin/clang-tidy

      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: python3 tools/ci/lane.py phase macos-metal refresh_xcode

      - name: Ensure offline Metal compiler
        id: metal_setup
        timeout-minutes: 12
        run: python3 tools/ci_metal_toolchain.py --install-missing

      - name: Report Metal component status
        if: ${{ failure() && steps.metal_setup.outcome == 'failure' }}
        timeout-minutes: 2
        run: python3 tools/ci_metal_toolchain.py --describe

      # The only shader-validation gate in CI: the hosted image's virtual GPU cannot run it,
      # so main runs none. The capability probe and native suites are mandatory whenever this job runs.
      - name: Require full Metal shader validation
        id: metal_profile
        shell: bash
        run: python3 tools/ci/lane.py phase macos-metal metal_profile

      - name: Metal validation preflight
        id: metal_preflight
        shell: bash
        run: python3 tools/ci/lane.py phase macos-metal metal_preflight

      - name: Validate offline Metal compiler
        id: metal_compiler
        shell: bash
        run: python3 tools/ci/lane.py phase macos-metal metal_compiler

      - name: Test remaining native Metal suite
        id: metal_native
        shell: bash
        run: python3 tools/ci/lane.py phase macos-metal metal_native

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.metal_compiler.outcome == 'failure' || steps.metal_profile.outcome == 'failure' || steps.metal_preflight.outcome == 'failure' || steps.metal_native.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt macos-metal

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-macos-metal
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      # Remove the BuildBuddy key and its workspace helper, whatever the outcome.
      - name: Remove BuildBuddy credentials
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/buildbuddy" "${GITHUB_WORKSPACE}/.buildbuddy.bazelrc"

  coverage-contract:
    # Fails a trusted pull request whose lanes skipped a phase or test class that main's hosted
    # lanes run. tools/ci/coverage_contract.json declares each main-hosted phase, the classes of
    # tests it covers and the pull request steps that cover each class; every job above uploads a
    # receipt of the steps it ran, with test counts from Bazel's build events. A class this pull
    # request's changes select must have a counterpart that ran, or a reviewed exception in the
    # manifest that names its owner; the exceptions are printed on every run. Untrusted pull
    # requests and main pushes run main's hosted lanes themselves, so this runs when the
    # self-hosted Linux lane replaced hosted Linux; when hosted macOS ran (the ci:hosted-macos
    # label or a disabled macOS runner), the macOS lane needs no counterparts. It runs no build:
    # it reads receipts on a self-hosted Linux runner, so a trusted pull request gains no hosted
    # job. Hosted main also retains browser and Geode build event files for consistent
    # reporting across the different execution venues.
    runs-on: [self-hosted, linux, arm64]
    needs: [gatekeeper, determine-targets, linux, linux-self-hosted, macos-self-hosted, macos-metal, macos-browser]
    if: ${{ !cancelled() && needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download coverage receipts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-receipt-*
          path: ${{ runner.temp }}/coverage-receipts

      - name: Compare receipts with the coverage contract
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci_coverage_contract.py check | tee -a "$GITHUB_STEP_SUMMARY"
