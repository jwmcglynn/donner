name: CI

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Validate PRs targeting main or a dependency branch in a stack.
#
# Title and description edits do not run CI. A base-branch change calls this workflow through
# pr_base_change.yml; later edits of that head do not rerun it, and its run stays on the head.
# The PR body check runs separately in pr_metadata.yml.
on:
  push:
    branches: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    # The repository secrets a step here reads. A called workflow receives only the
    # secrets its caller passes. A job that binds the buildbuddy-write environment can
    # also read that environment's key; base-change runs bind it only for trusted
    # maintainer pull requests, which may write the cache.
    secrets:
      BUILDBUDDY_API_KEY_READONLY:
        required: false

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read
  pull-requests: read
  actions: read

# Retry policy: network-sensitive steps (checkout, apt install, bazel fetch)
# are retried to survive transient GitHub/registry outages. Build/test steps
# are NOT retried -- a real test failure should surface immediately.

# Self-hosted runner gates (repo Settings -> Variables). Enabled switches
# route only same-repository operator PRs to the matching ARM64 runner; main
# pushes and untrusted PRs use GitHub-hosted runners. Both the original actor
# and rerun actor must be the operator. An explicit false switch keeps the
# hosted lane available during a runner outage.

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
      is_duplicate_push: ${{ steps.dup_push.outputs.is_duplicate_push }}
      use_self_hosted_linux: ${{ steps.runner_gate.outputs.use_self_hosted_linux }}
      use_self_hosted_macos: ${{ steps.runner_gate.outputs.use_self_hosted_macos }}
      # The one pull request trust rule (.github/actions/pr-trust), shared with BuildBuddy.
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
    steps:
      - id: admission_source
        name: Checkout trusted admission code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: |
            tools/ci/gatekeeper.py
            tools/ci/github_rate_limit.py
            .github/actions/pr-trust
          sparse-checkout-cone-mode: false

      - id: comparison_source
        name: Checkout PR files for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          path: pr-input
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      # Admission and trust execute only base-pinned code; PR files are comparison data.
      - id: dup_push
        name: Detect duplicate push (PR already open for this branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py duplicate-push

      - id: docs_only
        name: Detect docs-only PR
        working-directory: ${{ github.event_name == 'pull_request' && 'pr-input' || '.' }}
        run: python3 "$GITHUB_WORKSPACE/tools/ci/gatekeeper.py" docs-only

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust

      - id: runner_gate
        name: Determine trusted self-hosted runner routing
        env:
          TRUSTED_PR: ${{ steps.pr_trust.outputs.trusted_pr }}
          SELFHOSTED_LINUX_RUNNER: ${{ vars.SELFHOSTED_LINUX_RUNNER }}
          SELFHOSTED_MACOS_RUNNER: ${{ vars.SELFHOSTED_MACOS_RUNNER }}
        shell: bash
        run: |
          set -euo pipefail

          hosted_macos_label="$(
            python3 - <<'PY'
          import json
          import os

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          labels = (event.get("pull_request") or {}).get("labels") or []
          print("true" if isinstance(labels, list) and any(
              isinstance(label, dict) and label.get("name") == "ci:hosted-macos"
              for label in labels
          ) else "false")
          PY
          )"

          use_linux=false
          use_macos=false
          if [[ "$TRUSTED_PR" == "true" && "$SELFHOSTED_LINUX_RUNNER" == "true" ]]; then
            use_linux=true
          fi
          # An operator PR can select hosted macOS for this run without changing Linux routing.
          if [[ "$TRUSTED_PR" == "true" && "$SELFHOSTED_MACOS_RUNNER" == "true" &&
                "$hosted_macos_label" != "true" ]]; then
            use_macos=true
          fi

          echo "use_self_hosted_linux=$use_linux" >> "$GITHUB_OUTPUT"
          echo "use_self_hosted_macos=$use_macos" >> "$GITHUB_OUTPUT"
          echo "runner_route trusted_pr=$TRUSTED_PR linux=$use_linux macos=$use_macos"

  determine-targets:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') }}
    env:
      BAZEL_DIFF_TAG: "v18.1.0"
      BAZEL_DIFF_SHA256: "eadec6d0ca0991de78bd9e063bfed993a359ed3bc60e507818077c300b6f58e0"
    outputs:
      fallback: ${{ steps.determine.outputs.fallback }}
      affected: ${{ steps.determine.outputs.affected }}
      full_test: ${{ steps.determine.outputs.full_test }}
      browser_affected: ${{ steps.determine.outputs.browser_affected }}
      hosted_parity_affected: ${{ steps.determine.outputs.hosted_parity_affected }}
      hosted_parity_tests_affected: ${{ steps.determine.outputs.hosted_parity_tests_affected }}
      wgpu_reference: ${{ steps.select_wgpu_resvg.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: false

      # Transient release-CDN failures (dropped connections, 5xx) have failed
      # this job outright and cost whole CI round trips. Retry the download as
      # a whole with backoff, and let curl retry inside each attempt too.
      - name: Download bazel-diff
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Tinder/bazel-diff/releases/download/${BAZEL_DIFF_TAG}/bazel-diff_deploy.jar"
          out="$RUNNER_TEMP/bazel-diff.jar"
          for delay in 2 4 8 16 0; do
            if curl -fsSL --retry 4 --retry-delay 2 --retry-all-errors \
                --connect-timeout 15 --max-time 300 -o "$out" "$url" \
                && [[ -s "$out" ]]; then
              if printf '%s  %s\n' "$BAZEL_DIFF_SHA256" "$out" \
                  | sha256sum --check --status; then
                exit 0
              fi
              echo "bazel-diff digest mismatch for ${BAZEL_DIFF_TAG}; refusing artifact." >&2
            fi
            rm -f "$out"
            if [[ "$delay" -eq 0 ]]; then
              break
            fi
            echo "bazel-diff download failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
          echo "error: bazel-diff download failed after 5 attempts." >&2
          exit 1

      - id: pr-meta
        name: Extract SHA for hash caching
        shell: bash
        run: |
          set -euo pipefail
          base_sha=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("pull_request", {}).get("base", {}).get("sha", ""))')"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Pre-warm the cache for future PRs whose base is this main commit.
            base_sha="${{ github.sha }}"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      # Base hashes are a pure function of (bazel-diff version, base SHA), and
      # generating them is roughly half of this job's bazel-diff wall time.
      # PRs restore them here; pushes to main generate and save them below so
      # the first PR against any main commit already hits warm. Caches created
      # on main are visible to all PR branches. Only main writes this cache.
      - name: Restore bazel-diff base hashes
        id: base-hashes
        if: steps.pr-meta.outputs.base_sha != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bazel-diff-base-hashes/${{ steps.pr-meta.outputs.base_sha }}.json
          key: bazel-diff-base-hashes-tt-${{ env.BAZEL_DIFF_TAG }}-${{ steps.pr-meta.outputs.base_sha }}

      - id: determine
        name: Determine affected Bazel targets
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Non-PR event; keeping full //... coverage."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            echo "full_test=false" >> "$GITHUB_OUTPUT"

            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              cached="$HOME/.cache/bazel-diff-base-hashes/${{ github.sha }}.json"
              if [[ ! -f "$cached" ]]; then
                echo "Pre-warming bazel-diff hash cache for ${{ github.sha }}."
                mkdir -p "$(dirname "$cached")"
                java -jar "$RUNNER_TEMP/bazel-diff.jar" generate-hashes \
            --includeTargetType \
                  -w "$GITHUB_WORKSPACE" \
                  -b bazelisk \
                  "$cached" || rm -f "$cached"
              fi
            fi
            exit 0
          fi

          eval "$(
            python3 -c 'import json, os, shlex; event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); pr = event.get("pull_request", {}); labels = [label.get("name", "") for label in pr.get("labels", [])]; values = {"BASE_SHA": pr.get("base", {}).get("sha", ""), "HEAD_SHA": pr.get("head", {}).get("sha", ""), "FORCE_FULL_TEST": "true" if "ci:full-test" in labels else "false"}; print("\n".join(f"{key}={shlex.quote(value)}" for key, value in values.items()))'
          )"

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Missing PR base/head SHA; falling back to //...."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            echo "full_test=false" >> "$GITHUB_OUTPUT"
            echo "wgpu_reference_unknown=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE_FULL_TEST" == "true" ]]; then
            echo "ci:full-test label present; forcing full //... coverage."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            echo "full_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "full_test=false" >> "$GITHUB_OUTPUT"

          # Diff from the merge-base, not the base tip. The event payload's
          # base.sha is the base branch's CURRENT tip, so a two-dot diff
          # attributes post-fork drift on main (e.g. a workflow file merged
          # after this branch forked) to the PR, tripping the infra detector
          # and forcing a spurious full //... fallback. Merge-base semantics
          # sees only branch-side changes. Fail closed: if merge-base cannot
          # be computed, keep the base-tip diff (over-inclusion only ever
          # widens to the fallback path, never skips it).
          if diff_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "Using merge-base $diff_base as diff basis."
          else
            echo "git merge-base failed; using base tip $BASE_SHA as diff basis."
            diff_base="$BASE_SHA"
          fi
          changed_files="$(git diff --name-only "$diff_base" "$HEAD_SHA")"

          if [[ -z "$changed_files" ]]; then
            echo "No changed files detected; falling back to //...."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            echo "wgpu_reference_unknown=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Direct renderer/GPU/image inputs and this lane's workflow still select the oracle
          # when an infra change makes bazel-diff fall back before it can report affected targets.
          wgpu_reference_changed=false
          while IFS= read -r path; do
            case "$path" in
              donner/svg/renderer/*|donner/gpu/*|donner/svg/resources/*|donner/svg/components/resources/*)
                wgpu_reference_changed=true
                break
                ;;
              donner/svg/SVGImageElement.*|donner/svg/SVGFEImageElement.*|third_party/resvg-test-suite/*)
                wgpu_reference_changed=true
                break
                ;;
              third_party/bazel/non_bcr_deps.bzl|third_party/BUILD.wgpu_native*|MODULE.bazel|MODULE.bazel.lock|.bazelrc|build_defs/*|.github/workflows/main.yml)
                wgpu_reference_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "wgpu_reference_changed=$wgpu_reference_changed" >> "$GITHUB_OUTPUT"

          # The browser tests' npm lockfile and Playwright browser manifest reach Bazel
          # through module extensions, not as files in the build graph, so bazel-diff
          # cannot attribute a change to them. A change to them adds every browser test to
          # the selection below. (The tests list package.json as a data file, so bazel-diff
          # sees it, but a dependency bump changes it together with the lockfile.)
          browser_inputs_changed=false
          while IFS= read -r path; do
            case "$path" in
              donner/editor/wasm/tests/package.json|donner/editor/wasm/tests/package-lock.json|donner/editor/wasm/tests/pnpm-lock.yaml|donner/editor/wasm/tests/browsers.*.json)
                echo "Browser test dependency change selects the browser partitions: $path"
                browser_inputs_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          should_fallback=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              MODULE.bazel|.bazelversion|WORKSPACE|WORKSPACE.*|.bazelrc|build_defs/*|.github/workflows/*|.github/actions/*)
                echo "Infra change requires full //... coverage: $path"
                should_fallback=true
                break
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$should_fallback" == "true" ]]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          work_dir="$(mktemp -d)"
          base_dir="$work_dir/base"
          head_dir="$work_dir/head"
          cleanup() {
            git worktree remove --force "$base_dir" 2>/dev/null || true
            git worktree remove --force "$head_dir" 2>/dev/null || true
            rm -rf "$work_dir"
          }
          trap cleanup EXIT

          # Hash the current base TIP against the PR's MERGE commit (the
          # workspace checkout, refs/pull/N/merge), not against HEAD_SHA.
          # Hashing base-tip vs HEAD_SHA attributes post-fork drift on main to
          # the PR, inflating the affected set on any branch that has not
          # rebased (measured up to 126x over-inclusion; see
          # docs/design_docs/0029-2). In the tip-vs-merge comparison, drift is
          # present on BOTH sides, so unchanged-by-the-PR targets hash
          # identically and drop out; and because the merge graph is the one
          # hashed, reverse dependencies that exist ONLY in the merge (a dep
          # edge added on main after the fork onto code this PR touches) are
          # still caught - the downstream jobs build this same merge ref.
          # Fail closed: if the workspace is not a merge commit (e.g. a
          # checkout override), it IS the PR head and this degrades to exactly
          # the old base-tip-vs-head comparison.
          merge_sha="$(git rev-parse HEAD)"
          git worktree add --detach "$head_dir" "$merge_sha"

          cached_base="$HOME/.cache/bazel-diff-base-hashes/$BASE_SHA.json"
          if [[ -s "$cached_base" ]]; then
            echo "Using cached bazel-diff base hashes for $BASE_SHA."
            cp "$cached_base" "$work_dir/base-hashes.json"
          else
            git worktree add --detach "$base_dir" "$BASE_SHA"
            java -jar "$RUNNER_TEMP/bazel-diff.jar" generate-hashes \
            --includeTargetType \
              -w "$base_dir" \
              -b bazelisk \
              "$work_dir/base-hashes.json"
            # Save for subsequent pushes to this PR (post-job cache step).
            mkdir -p "$(dirname "$cached_base")"
            cp "$work_dir/base-hashes.json" "$cached_base"
          fi

          java -jar "$RUNNER_TEMP/bazel-diff.jar" generate-hashes \
            --includeTargetType \
            -w "$head_dir" \
            -b bazelisk \
            "$work_dir/head-hashes.json"

          java -jar "$RUNNER_TEMP/bazel-diff.jar" get-impacted-targets \
            -tt Rule \
            -w "$head_dir" \
            -b bazelisk \
            -sh "$work_dir/base-hashes.json" \
            -fh "$work_dir/head-hashes.json" \
            -o "$work_dir/affected.txt"

          affected="$(
            python3 -c 'import pathlib, sys; labels = [line.strip() for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip()]; print(" ".join(labels))' "$work_dir/affected.txt"
          )"

          if [[ -z "$affected" ]]; then
            echo "bazel-diff produced no affected targets; falling back to //...."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The manual reference is removed from normal affected targets below. Capture its
          # pre-filter impact so only PRs that reach the pixel corpus run its 16 Linux shards.
          reference_targets="$(
            cd "$head_dir"
            bazelisk query --keep_going \
              'tests(//tools/ci:linux_wgpu_resvg_reference) union labels(dep, tests(//tools/ci:linux_wgpu_resvg_reference))'
          )"
          if [[ -z "$reference_targets" ]]; then
            echo "::error::Linux WebGPU resvg suite has no test target."
            exit 1
          fi
          for reference_target in $reference_targets; do
            if [[ " $affected " == *" $reference_target "* ]]; then
              echo "wgpu_reference_affected=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

          manual_affected="$(
            # Quote each label: npm package labels contain query operators such as `+`.
            quoted_affected="$(
              python3 -c 'import pathlib, sys; print(" ".join("\"%s\"" % line.strip() for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip()))' "$work_dir/affected.txt"
            )"
            cd "$head_dir"
            bazelisk query --keep_going "attr(\"tags\", \"manual\", set($quoted_affected))"
          )"
          if [[ -n "$manual_affected" ]]; then
            printf '%s\n' "$manual_affected" > "$work_dir/manual-affected.txt"
            affected="$(
              python3 -c 'import pathlib, sys; manual = set(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()); labels = [line.strip() for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip() and line.strip() not in manual]; print(" ".join(labels))' "$work_dir/affected.txt" "$work_dir/manual-affected.txt"
            )"
            echo "Filtered $(grep -c . "$work_dir/manual-affected.txt") manual-tagged affected target(s)."
          fi

          if [[ -z "$affected" ]]; then
            echo "Only manual-tagged affected targets detected; falling back to //... coverage."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "affected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dependency manifests feed every browser test: add them all to the selection, so
          # each browser partition sees the changed dependency inputs. Fail closed: if they
          # cannot be listed, fall back to //....
          if [[ "$browser_inputs_changed" == "true" ]]; then
            if manifest_tests="$(
              cd "$head_dir"
              bazelisk query --keep_going \
                'attr("tags", "launches-browser", tests(//...)) except attr("tags", "manual", //...)'
            )" && [[ -n "$manifest_tests" ]]; then
              manifest_labels=()
              while IFS= read -r label; do
                if [[ -n "$label" ]]; then
                  manifest_labels+=("$label")
                fi
              done <<< "$manifest_tests"
              affected="$affected ${manifest_labels[*]}"
              echo "Added browser tests for changed dependency manifests: ${manifest_labels[*]}"
            else
              echo "Could not list browser tests for changed dependency manifests; falling back to //...."
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              echo "affected=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Trusted PRs split browser tests between the VM and native desktop. Ask
          # the PR's merge graph whether any affected test launches a browser. bazel-diff hashes
          # every transitive input in the build graph, including the Wasm package and the spec
          # files these tests read; changed dependency manifests added their tests above.
          # Fail closed: a failed query selects the browser job.
          if browser_targets="$(
            cd "$head_dir"
            bazelisk query --keep_going "attr(\"tags\", \"launches-browser\", set($affected))"
          )"; then
            if [[ -n "$browser_targets" ]]; then
              echo "Affected browser targets:"
              printf '%s\n' "$browser_targets"
              echo "browser_affected=true" >> "$GITHUB_OUTPUT"
            else
              echo "browser_affected=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Browser target query failed; selecting the native desktop browser job."
            echo "browser_affected=true" >> "$GITHUB_OUTPUT"
          fi

          # Trusted PRs run the hosted-parity subset (the macos-hosted-parity job) only when an
          # affected test is one whose result can depend on the runner: a `hosted_parity` test
          # or a test of the Geode editor lane. Labels are quoted (npm package labels contain
          # query operators), and the tag is matched as a whole list element. Fail closed: a
          # failed query selects the job.
          # Intentional word splitting: each affected label is one argument.
          # shellcheck disable=SC2086
          parity_set="$(python3 -c 'import sys; print(" ".join("\"%s\"" % label for label in sys.argv[1:]))' $affected)"
          if parity_targets="$(
            cd "$head_dir"
            bazelisk query --keep_going \
              "attr(\"tags\", \"[\\[ ]hosted_parity[,\\]]\", tests(set($parity_set))) union (set($parity_set) intersect tests(//tools/ci:editor_geode))"
          )"; then
            if [[ -n "$parity_targets" ]]; then
              echo "Affected hosted-parity targets:"
              printf '%s\n' "$parity_targets"
              echo "hosted_parity_affected=true" >> "$GITHUB_OUTPUT"
            else
              echo "hosted_parity_affected=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Hosted-parity target query failed; selecting the hosted-parity job."
            echo "hosted_parity_affected=true" >> "$GITHUB_OUTPUT"
          fi
          # The hosted Linux job reruns only the tagged tests (the Geode editor lane is macOS
          # only), so it has its own selection. Fail closed as above; if the query fails, the
          # step may find no tagged test and the coverage contract then reports it.
          if tagged_targets="$(
            cd "$head_dir"
            bazelisk query --keep_going \
              "attr(\"tags\", \"[\\[ ]hosted_parity[,\\]]\", tests(set($parity_set)))"
          )"; then
            if [[ -n "$tagged_targets" ]]; then
              echo "hosted_parity_tests_affected=true" >> "$GITHUB_OUTPUT"
            else
              echo "hosted_parity_tests_affected=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "hosted_parity_tests_affected=true" >> "$GITHUB_OUTPUT"
          fi

          echo "fallback=false" >> "$GITHUB_OUTPUT"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      # A failed pre-warm removes its partial file; saving a missing path only warns.
      - name: Save main bazel-diff base hashes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.pr-meta.outputs.base_sha != '' && steps.base-hashes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bazel-diff-base-hashes/${{ steps.pr-meta.outputs.base_sha }}.json
          key: ${{ steps.base-hashes.outputs.cache-primary-key }}

      - name: Select Linux WebGPU resvg reference
        id: select_wgpu_resvg
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          run_reference=false
          if [[ "${{ steps.determine.outputs.wgpu_reference_affected }}" == "true" ||
                "${{ steps.determine.outputs.wgpu_reference_changed }}" == "true" ||
                "${{ steps.determine.outputs.wgpu_reference_unknown }}" == "true" ||
                "${{ steps.determine.outputs.full_test }}" == "true" ]]; then
            run_reference=true
          fi
          echo "run=$run_reference" >> "$GITHUB_OUTPUT"

  linux:
    # One x86_64 workspace owns native, local-display, linker and closure checks.
    runs-on: ubuntu-24.04
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') }}
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            ninja-build pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6 clang-tidy-19 xvfb xauth

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Restore Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        id: buildbuddy
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          remote-execution: "true"
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Configure BuildBuddy read-only cache
        if: needs.gatekeeper.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          download-outputs: minimal

      - name: Verify BuildBuddy remote execution
        id: buildbuddy_verify
        if: steps.buildbuddy.outputs.bazel-flags != ''
        env:
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: |
          set -euo pipefail
          bazelisk build --config=ci --config=latest_llvm ${BUILDBUDDY_FLAGS} \
            --remote_accept_cached=false --disk_cache= \
            "--copt=-DBUILDBUDDY_RE_PROBE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --execution_log_json_file="${RUNNER_TEMP}/buildbuddy-execution.json" \
            //tools/ci:buildbuddy_compile_probe
          jq -s -e 'any(.[]; .mnemonic == "CppCompile" and .runner == "remote" and .cacheHit != true)' \
            "${RUNNER_TEMP}/buildbuddy-execution.json"
          bazelisk build --config=ci --config=latest_llvm ${BUILDBUDDY_FLAGS} //...

      - name: Build
        id: build
        if: ${{ needs.gatekeeper.outputs.use_self_hosted_linux != 'true' }}
        env:
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          bazelisk build --config=ci --config=latest_llvm ${BUILDBUDDY_FLAGS} $TARGETS

      - name: Test
        if: ${{ needs.gatekeeper.outputs.use_self_hosted_linux != 'true' }}
        id: test
        env:
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          # An empty selection is a defect in the target derivation, not a
          # change with nothing to test. With no patterns, bazel falls back to
          # its default target pattern (the working directory's package, which
          # holds no tests here), so the step would build something nobody
          # selected and then report that empty test set as success.
          # Unreachable today because the deriving job widens an empty result
          # to //..., and cheap to keep unreachable.
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the test step."
            exit 1
          fi
          # A change-based selection can legitimately contain zero test
          # targets (docs, tooling, a vendored subtree tested from its own
          # workspace), which `bazel test` reports as exit 4. The wrapper
          # maps only that status to success; every other failure still fails.
          tools/ci_bazel_test.sh bazelisk test --config=ci --config=latest_llvm ${BUILDBUDDY_FLAGS} \
            --test_output=errors \
            --test_tag_filters=-manual,-perf,-ci-remote-gpu,-fuzz_soak \
            $TARGETS

      - name: Test deterministic fuzzer soak wrapper
        id: deterministic_soak_probe
        shell: bash
        run: |
          set -euo pipefail
          bazelisk test --config=ci --config=latest_llvm \
            --test_output=all --test_tag_filters= --nocache_test_results \
            --noskip_incompatible_explicit_targets \
            --build_event_json_file="$RUNNER_TEMP/coverage-deterministic_soak_probe.bep.json" \
            //tools/ci:deterministic_fuzzer_soak

      - name: Test Linux WebGPU resvg reference
        id: wgpu_resvg_reference
        if: ${{ !cancelled() && needs.gatekeeper.outputs.use_self_hosted_linux != 'true' && needs.determine-targets.outputs.wgpu_reference == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bazelisk test --config=ci --config=latest_llvm --test_output=errors \
            --test_tag_filters= --test_env=XDG_RUNTIME_DIR=/tmp \
            //tools/ci:linux_wgpu_resvg_reference

      - name: Test local Xvfb targets
        id: local_xvfb
        if: ${{ !cancelled() && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the local Xvfb test step."
            exit 1
          fi
          tools/ci_bazel_test.sh bazelisk test --config=ci --config=latest_llvm --nocache_test_results \
            --test_output=errors --test_tag_filters=requires_xvfb,-fuzz_soak \
            --strategy=TestRunner=local $TARGETS

      # Trusted PRs run the Build and Test steps above only on the self-hosted ARM64 lane. The
      # runner-sensitive `hosted_parity` tests also run here, on the hosted x86_64 image main
      # runs, when the change reaches one: main's Test step, narrowed to those tests.
      - name: Test (hosted parity subset)
        id: hosted_parity_test
        if: ${{ !cancelled() && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' && (needs.determine-targets.outputs.fallback == 'true' || needs.determine-targets.outputs.hosted_parity_tests_affected == 'true') }}
        env:
          BUILDBUDDY_FLAGS: ${{ steps.buildbuddy.outputs.bazel-flags }}
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the hosted parity step."
            exit 1
          fi
          tools/ci_bazel_test.sh bazelisk test --config=ci --config=latest_llvm ${BUILDBUDDY_FLAGS} \
            --test_output=errors \
            --build_tests_only --build_event_json_file="$RUNNER_TEMP/coverage-hosted_parity_test.bep.json" \
            --test_tag_filters=hosted_parity,-manual,-perf,-ci-remote-gpu,-fuzz_soak \
            $TARGETS

      # Diagnostic only: disk, cache and memory use once the tests have run.
      - name: Probe runner resources after tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: python3 -u tools/ci_disk_cache.py probe --stage after-test --marker "${RUNNER_TEMP}/bazel-disk-restore.marker"

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.test.outcome == 'failure' || steps.deterministic_soak_probe.outcome == 'failure' || steps.wgpu_resvg_reference.outcome == 'failure' || steps.local_xvfb.outcome == 'failure' || steps.hosted_parity_test.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Linker canary (non-lld linker support)
        id: linker_canary
        shell: bash
        run: |
          bazelisk build --config=ci --linkopt=-fuse-ld=gold \
            //tools/ci:linker_canary

      - name: Build and test CMake consumer
        id: cmake_consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cmake/gen_cmakelists.py --check
          python3 tools/cmake/gen_cmakelists.py
          cmake -S examples/cmake_consumer -B build -G Ninja \
            -DDONNER_SOURCE_DIR="$PWD" \
            -DDONNER_RENDERER_BACKEND=tiny_skia
          cmake --build build --target donner_cmake_consumer --parallel 2
          ctest --test-dir build --output-on-failure

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt linux

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-linux
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      # Last step, after every Bazel command: evicts the action cache to its budget and saves
      # it on a main push.
      - name: Save Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native
          mode: save

  # Admit the operator's ARM64 Linux job from a hosted runner. The FIFO wait
  # cannot run on the constrained self-hosted pool itself: newer runs could
  # occupy every runner while the oldest lane job remains queued, creating a
  # head-of-line deadlock. This lightweight prerequisite waits off-pool and
  # releases dependent self-hosted jobs in submission order. The pool is sized
  # to the runner fleet, so up to four Linux jobs run at once.
  linux-self-hosted-turnstile:
    runs-on: ubuntu-24.04
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    timeout-minutes: 165
    steps:
      - name: Checkout turnstile action
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for Linux self-hosted lane
        uses: ./.github/actions/re-turnstile
        with:
          lane: linux-self-hosted
          pool: linux-self-hosted
          # pr_base_change.yml runs this workflow as a reusable workflow call
          # after a base-branch change, so its runs share the pool.
          pool-workflows: main.yml pr_base_change.yml
          capacity: "4"
          token: ${{ github.token }}
          timeout-minutes: "150"

  # Operator's ARM64 Linux runs on the operator's self-hosted runner.
  # Replaces `linux` for trusted operator PRs (extra architecture coverage).
  # Main pushes, Renovate, and non-operator runs stay hosted.
  # The runner host pre-provisions the toolchain (fontconfig, freetype, mesa,
  # vulkan, X11, clang-tidy) and its own Bazel cache configuration, so there
  # is no apt/setup-bazel step. The runner intentionally has
  # no host GPU device passthrough; Mesa llvmpipe/lavapipe provide the same
  # software rendering path used by GitHub-hosted Linux so this lane runs the
  # same test surface instead of excluding graphics targets.
  linux-self-hosted:
    runs-on: [self-hosted, linux, arm64]
    needs: [gatekeeper, determine-targets, linux-self-hosted-turnstile]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    # RE-availability SLA lane. A healthy affected-target run is ~21 min. This
    # budget applies only after the hosted turnstile admits this job. It retains
    # ample room for an unusually slow build without making the admission wait
    # consume a constrained runner. RE-degradation fast-fail is unchanged and
    # lives at the Bazel layer (no local fallback + --remote_timeout=60s
    # below), so a
    # wedged/degraded backend still fails in about a minute regardless of this
    # backstop.
    timeout-minutes: 210
    # Admission control on the shared remote-execution backend. The self-hosted
    # Linux lane executes on a backend that an interactive development host also uses
    # with priority; unbounded concurrent operator PRs oversubscribe it and
    # crawl into the 60 min timeout (measured). Admission is enforced by the
    # hosted re-turnstile prerequisite above, NOT by a GitHub concurrency group.
    # A concurrency group caps the queue at one pending run and cancels any
    # older pending run when a third concurrent run arrives, so a parallel-PR
    # burst drops pending PR runs. The turnstile instead holds each run until
    # its turn, FIFO,
    # so N concurrent runs all execute in submission order and none are
    # cancelled. Bounding CI's demand on the backend also protects the
    # interactive host's latency. The bound is a pool sized to the runner
    # fleet.
    env:
      # The runner host may add a remote Bazel cache from its own rc files.
      # Use that acceleration when healthy, but do NOT fall back to local
      # execution when remote execution is down/degraded: a CPU-capped runner
      # executing the whole graph locally is the measured 2-3 h tail. Fast-fail
      # on RE degradation; backend health monitoring and a rerun recover.
      # --remote_timeout is 60s (not 5s): a healthy-but-BUSY endpoint
      # legitimately takes >5s on bulk transfers under a multi-job burst
      # (observed as spurious DEADLINE_EXCEEDED-after-4.999s failures on
      # full-`//...` fallback runs, 2026-07-11, twice in a row on organic load;
      # the same signature appeared on 2026-07-02 for large coverage uploads).
      # 60s still fast-fails a genuinely dead endpoint.
      BAZEL_SELF_HOSTED_REMOTE_FALLBACK_FLAGS: "--strategy=TestRunner=remote --remote_local_fallback=false --incompatible_remote_local_fallback_for_remote_cache=false --remote_timeout=60s"
      # Every self-hosted run uploads its diagnostics report, Bazel profiles
      # and any stall note so slow runs can be attributed to targets/actions
      # without live SSH. The build event and execution logs feed the report
      # but stay on the runner: they record the host's effective Bazel
      # configuration, which a public artifact must not carry. Keep artifacts
      # small; retention is 3 days. DIAG_DIR is exported from the first step
      # ($RUNNER_TEMP; the `runner` context is not available in job-level env).
      # Build without the Bytes: the runner is a thin remote-execution client on
      # a CPU-capped host. Downloading every toplevel output (unstripped ARM64
      # test binaries) added minutes of pure transfer per run. Tests execute
      # remotely, so only test logs/XML need to come back.
      DIAG_BUILD_FLAGS: "--remote_download_outputs=minimal"
      DIAG_TEST_FLAGS: "--remote_download_outputs=minimal --remote_download_regex=.*(test\\.log|test\\.xml|outputs\\.zip)$"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record target selection
        shell: bash
        run: |
          set -euo pipefail
          DIAG_DIR="$RUNNER_TEMP/donner-ci-diagnostics"
          echo "DIAG_DIR=$DIAG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$DIAG_DIR"/{fetch,build,test,test-wgpu}
          {
            echo "run_id=${{ github.run_id }} attempt=${{ github.run_attempt }} sha=${{ github.sha }}"
            echo "fallback=${{ needs.determine-targets.outputs.fallback }}"
          } | tee "$DIAG_DIR/manifest.txt"
          if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..." > "$DIAG_DIR/target-list.txt"
          else
            echo "${{ needs.determine-targets.outputs.affected }}" | tr ' ' '\n' > "$DIAG_DIR/target-list.txt"
          fi
          echo "target_count=$(grep -c . "$DIAG_DIR/target-list.txt")" | tee -a "$DIAG_DIR/manifest.txt"
          # Heartbeat + stall watchdog. The heartbeat alone is not diagnosis: a
          # run can print "still running for 12190s" 200 times while Bazel has
          # been parked on one target the whole time. Nothing else catches that
          # - a per-test timeout only starts counting once a test RUNS, so a
          # target that is queued and never scheduled is bounded by nothing but
          # the job's own `timeout-minutes`, which kills the run without saying
          # which target it was waiting on.
          #
          # The watchdog watches Bazel's own progress output. Bazel re-emits its
          # progress line with updated elapsed time while an action is in
          # flight, so a log whose last Bazel-authored line has not changed for
          # BAZEL_STALL_LIMIT_SECONDS means the invocation has stopped making
          # observable progress. When that happens, print that line as an error
          # (it names the target and its state, e.g. `[Sched] Testing
          # //path:target (shard 1 of 16)`), save it next to the other
          # diagnostics, and fail immediately instead of burning the rest of the
          # job budget in silence.
          cat > "$DIAG_DIR/run_bazel_with_heartbeat.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          log_path="$1"
          shift
          started=$SECONDS
          stall_limit="${BAZEL_STALL_LIMIT_SECONDS:-900}"
          heartbeat_interval="${BAZEL_HEARTBEAT_INTERVAL_SECONDS:-60}"
          stall_report="$(dirname "$log_path")/stall.txt"
          heartbeat_control="${log_path}.heartbeat-control.$$"
          mkfifo "$heartbeat_control"
          exec 9<> "$heartbeat_control"

          # Killing only the launcher is not enough: bazelisk forks the Bazel
          # client, which keeps the write end of this pipeline open, so `tee`
          # never sees EOF and the step hangs anyway - the watchdog would report
          # the stall and then stall itself. Signal the whole descendant tree.
          # (Process-group signalling is not reliable here: this block already
          # runs as one stage of a pipeline, so `set -m` does not consistently
          # give the background job a group of its own.)
          child_processes() {
            local root="$1" children="" child parent
            if [[ -r "/proc/$root/task/$root/children" ]]; then
              IFS= read -r children < "/proc/$root/task/$root/children" || true
              for child in $children; do
                printf '%s\n' "$child"
              done
              return
            fi
            while read -r child parent; do
              if [[ "$parent" == "$root" ]]; then
                printf '%s\n' "$child"
              fi
            done < <(ps -A -o pid=,ppid= 2>/dev/null)
          }

          kill_tree() {
            local signal="$1" root="$2" child
            while IFS= read -r child; do
              [[ -n "$child" ]] || continue
              kill_tree "$signal" "$child"
            done < <(child_processes "$root")
            kill "-$signal" "$root" 2>/dev/null || true
          }

          set +e
          {
            set -e
            "$@" &
            command_pid=$!

            (
              last_progress=""
              last_change=$SECONDS

              while kill -0 "$command_pid" 2>/dev/null; do
                if IFS= read -r -t "$heartbeat_interval" _ <&9; then
                  exit 0
                fi
                kill -0 "$command_pid" 2>/dev/null || break

                # Ignore our own annotations so the watchdog cannot see its own
                # output as progress.
                current="$(grep -v '^::' "$log_path" 2>/dev/null | tail -n 1 || true)"
                if [[ "$current" != "$last_progress" ]]; then
                  last_progress="$current"
                  last_change=$SECONDS
                  echo "::notice::Bazel command still running for $((SECONDS - started))s"
                  continue
                fi

                stalled=$((SECONDS - last_change))
                if (( stalled < stall_limit )); then
                  echo "::notice::Bazel command still running for $((SECONDS - started))s (no new progress for ${stalled}s)"
                  continue
                fi

                {
                  echo "Bazel made no observable progress for ${stalled}s (limit ${stall_limit}s)."
                  echo "Last Bazel progress line, which names what it was waiting on:"
                  echo "$last_progress"
                } | tee "$stall_report"
                echo "::error::Bazel stalled for ${stalled}s on: ${last_progress:-<no progress output>}"
                kill_tree TERM "$command_pid"
                sleep 15
                kill_tree KILL "$command_pid"
                break
              done
            ) &
            heartbeat_pid=$!

            set +e
            wait "$command_pid"
            status=$?
            set -e

            printf 'stop\n' >&9
            wait "$heartbeat_pid" 2>/dev/null || true
            exit "$status"
          } 2>&1 | tee "$log_path"
          status="${PIPESTATUS[0]}"
          set -e
          exec 9>&-
          rm -f "$heartbeat_control"
          exit "$status"
          EOF
          chmod +x "$DIAG_DIR/run_bazel_with_heartbeat.sh"

      - name: Sync Bazel toolchain
        # NixOS injects include paths via NIX_CFLAGS_COMPILE, which Bazel does
        # not track in cc_configure's cache key; a stale @local_config_cc then
        # omits them and the hermetic include scanner rejects /nix/store
        # headers. Surgically reset ONLY @local_config_cc so it regenerates
        # against the current env. This replaces `bazelisk clean --expunge`,
        # which also wiped the persistent /var/cache/bazel LLVM toolchain and
        # forced a ~5-minute re-download+re-extract of it on every run.
        shell: bash
        run: |
          set -euo pipefail
          output_base=$(bazelisk info output_base)
          bazelisk shutdown
          # Match the repo dir + marker under any Bzlmod canonical name
          # (local_config_cc, ...+local_config_cc, @local_config_cc.marker).
          find "$output_base/external" -maxdepth 1 -name '*local_config_cc*' \
            -print -exec rm -rf {} + 2>/dev/null || true

      - name: Fetch Bazel LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)

          fetch_llvm() {
            bazelisk fetch --config=ci --config=latest_llvm \
              $BAZEL_SELF_HOSTED_REMOTE_FALLBACK_FLAGS \
              $TARGETS
          }

          cleanup_partial_llvm_fetch() {
            local output_base
            output_base=$(bazelisk info output_base 2>/dev/null || true)
            bazelisk shutdown || true

            echo "::group::Bazel disk state before LLVM fetch retry"
            df -h /var/cache/bazel "$GITHUB_WORKSPACE" || true
            if [[ -n "$output_base" && -d "$output_base/external" ]]; then
              du -sh "$output_base"/external/*llvm_toolchain_linux_aarch64_llvm* 2>/dev/null || true
            fi
            echo "::endgroup::"

            if [[ -n "$output_base" && -d "$output_base/external" ]]; then
              find "$output_base/external" -maxdepth 1 -name '*llvm_toolchain_linux_aarch64_llvm*' \
                -print -exec rm -rf {} + 2>/dev/null || true
            fi
          }

          if ! fetch_llvm; then
            cleanup_partial_llvm_fetch
            fetch_llvm
          fi
          # NOTE: no `bazelisk shutdown` here. Keeping the server alive lets
          # Build reuse this invocation's loading/analysis instead of paying
          # a fresh JVM start + ~30 s re-analysis.

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          "$DIAG_DIR/run_bazel_with_heartbeat.sh" "$DIAG_DIR/build/console.log" \
            bazelisk build --config=ci --config=latest_llvm \
            $BAZEL_SELF_HOSTED_REMOTE_FALLBACK_FLAGS \
            $DIAG_BUILD_FLAGS \
            --profile="$DIAG_DIR/build/profile.gz" \
            --build_event_json_file="$DIAG_DIR/build/bep.json" \
            --execution_log_compact_file="$DIAG_DIR/build/exec.log.zst" \
            $TARGETS

      - name: Test
        id: test
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the test step."
            exit 1
          fi
          # The paired targets share the same transitioned implementation and
          # shard count. Their no-local requirement fails closed if remote
          # execution is unavailable.
          # Intentional word splitting: each Bazel label is one argument.
          # shellcheck disable=SC2086
          if ! mapped_targets="$(python3 tools/ci_remote_gpu_targets.py $TARGETS)"; then
            echo "::error::Failed to select remote GPU test targets."
            exit 1
          fi
          if [[ -z "${mapped_targets// /}" ]]; then
            echo "::error::Remote GPU target selection became empty."
            exit 1
          fi
          TARGETS="$mapped_targets"
          tools/ci_bazel_test.sh "$DIAG_DIR/run_bazel_with_heartbeat.sh" "$DIAG_DIR/test/console.log" \
            bazelisk test --config=ci --config=latest_llvm --test_output=errors \
            $BAZEL_SELF_HOSTED_REMOTE_FALLBACK_FLAGS \
            $DIAG_TEST_FLAGS \
            --test_tag_filters=-manual,-perf,-local-gpu-isolated,-fuzz_soak \
            --profile="$DIAG_DIR/test/profile.gz" \
            --build_event_json_file="$DIAG_DIR/test/bep.json" \
            --execution_log_compact_file="$DIAG_DIR/test/exec.log.zst" \
            $TARGETS

      - name: Test Linux WebGPU resvg reference
        id: wgpu_resvg_reference
        if: ${{ !cancelled() && needs.determine-targets.outputs.wgpu_reference == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          "$DIAG_DIR/run_bazel_with_heartbeat.sh" "$DIAG_DIR/test-wgpu/console.log" \
            bazelisk test --config=ci --config=latest_llvm --test_output=errors \
            $BAZEL_SELF_HOSTED_REMOTE_FALLBACK_FLAGS \
            $DIAG_TEST_FLAGS \
            --test_tag_filters= --test_env=XDG_RUNTIME_DIR=/tmp \
            --profile="$DIAG_DIR/test-wgpu/profile.gz" \
            --build_event_json_file="$DIAG_DIR/test-wgpu/bep.json" \
            --execution_log_compact_file="$DIAG_DIR/test-wgpu/exec.log.zst" \
            //tools/ci:linux_wgpu_resvg_reference

      # The steps this job ran, for the coverage contract (tools/ci/coverage_contract.json).
      - name: Record coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_coverage_contract.py receipt linux-self-hosted

      - name: Upload coverage receipt
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-receipt-linux-self-hosted
          path: ${{ runner.temp }}/coverage-receipt/coverage-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Summarize diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diag_dir="${DIAG_DIR:-$RUNNER_TEMP/donner-ci-diagnostics}"
          if [[ -f tools/ci_diagnostics_report.py && -f "$diag_dir/build/profile.gz" ]]; then
            python3 tools/ci_diagnostics_report.py "$diag_dir" | tee "$diag_dir/report.md" || true
            if [[ -s "$diag_dir/report.md" ]]; then
              cat "$diag_dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          # Derived files only; see the job environment comment above.
          path: |
            ${{ runner.temp }}/donner-ci-diagnostics/manifest.txt
            ${{ runner.temp }}/donner-ci-diagnostics/target-list.txt
            ${{ runner.temp }}/donner-ci-diagnostics/report.md
            ${{ runner.temp }}/donner-ci-diagnostics/*/profile.gz
            ${{ runner.temp }}/donner-ci-diagnostics/*/stall.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.test.outcome == 'failure' || steps.wgpu_resvg_reference.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

  macos:
    runs-on: xcode-27
    needs: [gatekeeper, determine-targets]
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || needs.gatekeeper.outputs.docs_only != 'true') && needs.gatekeeper.outputs.use_self_hosted_macos != 'true' }}
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    env:
      # Xcode's libc++ marks std::format floating-point support as macOS 13.3+.
      # Set the CI deployment target explicitly so hosted and self-hosted macOS
      # compile the same target instead of inheriting host defaults.
      # --config=ci-macos pins the action PATH. Lanes selecting the same approved
      # Xcode tuple compute identical action keys; "Select pinned Xcode" adds
      # --xcode_version. Self-hosted lanes pass these same key-affecting flags
      # (//tools:macos_cache_key_parity_tests).
      BAZEL_MACOS_BUILD_FLAGS: "--config=ci-macos --macos_minimum_os=13.3"
      # gen_cmakelists_test invokes Homebrew LLVM from inside Bazel's test
      # sandbox; Homebrew's tool wrappers require HOME. The hosted image's virtual
      # GPU cannot run Metal shader validation (docs/metal_validation.md): with the
      # texture check on, validated pipelines fail to compile, so it stays off here.
      # The Metal device tests request API validation only, through the config the
      # Test step passes.
      BAZEL_MACOS_TEST_FLAGS: "--test_env=HOME --test_env=MTL_SHADER_VALIDATION_TEXTURE_USAGE=0 --test_env=DONNER_CI_MACOS_LANE=hosted"
      # Free space, in GiB, required after the caches are restored: a cold build of the tree
      # peaked near 27 GiB on this image, before tests and browser trees.
      MIN_FREE_DISK_GIB: "45"
      # Enables the browser tests' timeout recorder (browser-stall-diagnostics.mjs). It
      # records host load, memory and process call graphs, so only this ephemeral hosted
      # job sets it; a persistent self-hosted runner never publishes them.
      BROWSER_STALL_TEST_FLAGS: "--test_env=DONNER_BROWSER_STALL_DIAGNOSTICS=1"
      # Both gating test steps pass the hosted-macos-quarantine config (.bazelrc). Only the Test
      # step adds the config that gives the Metal device tests API validation only.
      # Each Bazel step here changes a build option from the step before it (Build passes no
      # test configs, and the Chromium qualification step omits the quarantine config), so each
      # discards Bazel's analysis cache and re-analyzes, about 15 to 35 s per step on this image.
      # Exercise the Geode editor configuration through transitioned wrappers, which
      # locate declared shared libraries consistently on clean workers.
      GEODE_EDITOR_TARGETS: >-
        //tools/ci:editor_geode
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every macOS lane selects an approved tuple from tools/ci_macos_xcode.txt.
      # Lanes selecting the same version/build share action keys and a remote
      # cache partition; different tuples remain isolated. Missing all approved
      # versions or finding an ambiguous installation/build mismatch fails closed.
      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      # The xcode-27 image starts with far less free disk than a cold build of the tree needs.
      - name: Free hosted macOS disk
        shell: bash
        run: tools/ci/free_hosted_macos_disk.sh

      - name: Install clang-tidy
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            brew install --quiet llvm@19
            echo "/opt/homebrew/opt/llvm@19/bin" >> "$GITHUB_PATH"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Restore Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: native

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.gatekeeper.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.gatekeeper.outputs.trusted_pr }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      - name: Configure BuildBuddy read-only cache
        if: needs.gatekeeper.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.gatekeeper.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: minimal

      # Before Bazel, so a full disk fails in seconds with a clear error instead of an ENOSPC
      # late in the build.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # Regenerate the Xcode and Apple toolchain repositories for the selected
      # Xcode, as macos-self-hosted does; a restored external cache must not
      # carry another Xcode's.
      - name: Refresh Xcode toolchain configuration
        shell: bash
        run: |
          bazelisk fetch --force --lockfile_mode=off \
            --repo=@@bazel_tools+xcode_configure_extension+local_config_xcode \
            --repo=@@apple_support++apple_cc_configure_extension+local_config_apple_cc \
            --repo=@@apple_support++apple_cc_configure_extension+local_config_apple_cc_toolchains

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          bazelisk build --config=ci $BAZEL_MACOS_BUILD_FLAGS $TARGETS

      - name: Test
        id: test
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the test step."
            exit 1
          fi
          # The GitHub-hosted macOS image ships Xcode without the offline Metal
          # compiler, which is a separate ~700 MB downloadable component. The MSL
          # validation suite fails rather than skips when it cannot find that
          # compiler, so this lane drops it by tag and says so in the run summary
          # instead of collecting silent skips. Trusted PRs run it on the
          # capable self-hosted runner; every PR still needs exact-head full
          # Metal validation before merge (docs/metal_validation.md). Main's
          # hosted result alone does not establish that hardware signal.
          echo "::notice::Excluding requires_metal_toolchain targets: the hosted macOS image has no offline Metal compiler."
          # Its virtual GPU cannot run shader validation either, so the tests that assert it
          # (the validation profile probe and the out-of-bounds canary) run only on the
          # self-hosted real GPU (docs/metal_validation.md).
          echo "::notice::Excluding requires_shader_validation targets: the hosted macOS image's virtual GPU cannot run Metal shader validation."
          # Tests that launch a browser run in the next step instead.
          tools/ci_bazel_test.sh bazelisk test --config=ci --test_output=errors \
            --test_tag_filters=-manual,-perf,-requires_metal_toolchain,-requires_shader_validation,-ci-remote-gpu,-launches-browser,-fuzz_soak \
            --config=hosted-macos-quarantine --config=hosted-macos-unvalidated \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $BROWSER_STALL_TEST_FLAGS $TARGETS
        # Deterministic fuzzer corpus replay remains in this Bazel suite. Every lane here excludes
        # the `fuzz_soak` mutation targets; they run nightly or on demand in
        # `.github/workflows/fuzz.yml`, under sanitizers.

      # Browser tests hold wall-clock deadlines (a 10 s GPU device request, 30 s
      # test timeouts) that a browser starved of CPU cannot meet. On this
      # three-core runner, browsers co-scheduled with each other and with the
      # rest of the suite received about 5% of a core each and missed them,
      # while the same targets passed when rerun as a separate phase. Run every
      # test that launches a browser after the rest of the suite, one at a time.
      - name: Qualify pinned Chromium archive
        id: browser_preflight
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the browser preflight."
            exit 1
          fi
          browser_targets=$(bazelisk query "attr('tags', 'launches-browser', tests(set($TARGETS)))")
          if [[ -z "$browser_targets" ]]; then
            echo "No browser targets selected."
          else
            tools/ci_bazel_test.sh bazelisk test --config=ci --nocache_test_results --test_output=errors \
              $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS \
              //tools/ci:mac_browser_archive
          fi

      - name: Test (browser targets)
        id: browser_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=$(if [[ "${{ needs.determine-targets.outputs.fallback }}" == "true" ]]; then
            echo "//..."
          else
            echo "${{ needs.determine-targets.outputs.affected }}"
          fi)
          if [[ -z "${TARGETS// /}" ]]; then
            echo "::error::Empty target selection reached the test step."
            exit 1
          fi
          tools/ci_bazel_test.sh bazelisk test --config=ci --test_output=errors \
            --local_test_jobs=1 --build_event_json_file="$RUNNER_TEMP/coverage-browser_test.bep.json" \
            --test_tag_filters=launches-browser,-manual,-perf,-requires_metal_toolchain,-ci-remote-gpu,-fuzz_soak \
            --config=hosted-macos-quarantine \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $BROWSER_STALL_TEST_FLAGS $TARGETS

      - name: Test (Geode editor lane)
        id: geode_test
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          bazelisk test --config=ci --config=geode --test_output=errors \
            --build_event_json_file="$RUNNER_TEMP/coverage-geode_test.bep.json" \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $GEODE_EDITOR_TARGETS

      # Diagnostic only: disk, cache and memory use once the tests have run.
      - name: Probe runner resources after tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: python3 -u tools/ci_disk_cache.py probe --stage after-test --marker "${RUNNER_TEMP}/bazel-disk-restore.marker"

      - name: Upload Bazel test failure artifacts
        if: failure() && (steps.browser_preflight.outcome == 'failure' || steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure' || steps.geode_test.outcome == 'failure')
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: bazel-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      # A browser test that ended at its deadline records the window from its browser's
      # launch to that deadline. Slice the runner's system log to those windows for the browser's
      # own processes and for executable code-signing checks, which can delay a
      # browser helper's first launch. The unified log is host-wide, so only this
      # ephemeral hosted job collects it.
      - name: Collect browser stall system log
        id: browser_stall_log
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/browser-stall-system-log"
          mkdir -p "$out"
          iso='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          predicate='eventType == logEvent AND (process BEGINSWITH "Google Chrome for Testing" OR process == "syspolicyd" OR process == "amfid")'
          count=0
          while IFS= read -r -d '' window; do
            start=""
            end=""
            read -r start end _ < "$window" || true
            if [[ ! "$start" =~ $iso || ! "$end" =~ $iso ]]; then
              echo "Skipping malformed window: $window"
              continue
            fi
            count=$((count + 1))
            start="${start/T/ }"
            end="${end/T/ }"
            raw="${RUNNER_TEMP}/browser-stall-window-${count}.raw"
            if ! log show --style compact --timezone UTC \
                --start "${start%Z}+0000" --end "${end%Z}+0000" \
                --predicate "$predicate" > "$raw"; then
              echo "System log slice ${count} failed: $window"
            fi
            # Keep the launch end of the window, where a stalled first launch shows.
            head -c 2097152 "$raw" > "${out}/window-${count}.log"
            rm -f "$raw"
            if (( count == 4 )); then
              break
            fi
          done < <(find -H bazel-testlogs -path '*/browser-stall/system-log-window.txt' -type f -print0 2>/dev/null | sort -z)
          echo "Collected ${count} browser stall system log window(s)."

      - name: Upload browser stall system log
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-stall-system-log-${{ github.job }}
          path: ${{ runner.temp }}/browser-stall-system-log
          if-no-files-found: ignore
          retention-days: 14

      - name: Detect browser GPU acquisition failure
        id: browser_gpu_failure
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.browser_test.outcome == 'failure' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:browser-gpu-diagnostics'))) }}
        shell: bash
        env:
          BROWSER_GPU_DIAGNOSTICS_REQUESTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:browser-gpu-diagnostics') }}
        run: |
          set -euo pipefail
          should_probe="$BROWSER_GPU_DIAGNOSTICS_REQUESTED"
          for target in chromium_remote_smoke catalog_font_loading_test browser_presentation_regression_test standalone_geode_browser_renderer_test; do
            log="bazel-testlogs/donner/editor/wasm/tests/${target}/test.log"
            if [[ -f "$log" ]] && grep -qF 'stage=selection outcome=deadline_pending' "$log"; then
              should_probe=true
            fi
            # A browser test ended at its deadline; its browser process states were recorded.
            if [[ -f "$log" ]] && grep -qF 'browser-stall-diagnostics deadline' "$log"; then
              should_probe=true
            fi
          done
          echo "run_probe=$should_probe" >> "$GITHUB_OUTPUT"

      - name: Compare browser GPU tests (serial)
        id: browser_gpu_serial
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          bazel_status=0
          bazelisk test --config=ci --test_output=errors --nocache_test_results \
            --flaky_test_attempts=1 --runs_per_test=1 --local_test_jobs=1 --keep_going \
            --build_event_json_file="${RUNNER_TEMP}/browser-gpu-serial.bep.json" \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $BROWSER_STALL_TEST_FLAGS \
            //tools/ci:browser_gpu_comparison || bazel_status=$?
          report_status=0
          python3 tools/browser_gpu_test_summary.py \
            "${RUNNER_TEMP}/browser-gpu-serial.bep.json" \
            "${RUNNER_TEMP}/browser-gpu-serial-summary.json" || report_status=$?
          if [[ "$bazel_status" -ne 0 ]]; then exit "$bazel_status"; fi
          exit "$report_status"

      - name: Upload browser GPU comparison (serial)
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: browser-gpu-serial-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Compare browser GPU tests (parallel)
        id: browser_gpu_parallel
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          bazel_status=0
          bazelisk test --config=ci --test_output=errors --nocache_test_results \
            --flaky_test_attempts=1 --runs_per_test=1 --local_test_jobs=4 --keep_going \
            --build_event_json_file="${RUNNER_TEMP}/browser-gpu-parallel.bep.json" \
            $BAZEL_MACOS_BUILD_FLAGS $BAZEL_MACOS_TEST_FLAGS $BROWSER_STALL_TEST_FLAGS \
            //tools/ci:browser_gpu_comparison || bazel_status=$?
          report_status=0
          python3 tools/browser_gpu_test_summary.py \
            "${RUNNER_TEMP}/browser-gpu-parallel.bep.json" \
            "${RUNNER_TEMP}/browser-gpu-parallel-summary.json" || report_status=$?
          if [[ "$bazel_status" -ne 0 ]]; then exit "$bazel_status"; fi
          exit "$report_status"

      - name: Upload browser GPU comparison (parallel)
        if: ${{ !cancelled() && steps.browser_gpu_failure.outputs.run_probe == 'true' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: browser-gpu-parallel-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Upload bounded browser GPU timing summaries
