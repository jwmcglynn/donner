name: BCR Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"
  PRODUCER_COMMIT: 3f9011f1bf2efec8694795d45875ab5317a2caef

jobs:
  native-producer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x86-64
            architecture: x86_64
          - os: xcode-27
            platform: darwin-arm64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCHITECTURE: ${{ matrix.architecture }}
      MIN_FREE_DISK_GIB: "45"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCER_COMMIT }}
          persist-credentials: false

      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        run: tools/ci_select_macos_xcode.sh

      - name: Free hosted macOS disk
        if: runner.os == 'macOS'
        run: tools/ci/free_hosted_macos_disk.sh

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          cache-save: false

      - name: Install CLI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libncurses-dev lld

      - name: Check runner disk space
        if: runner.os == 'macOS'
        run: tools/ci_check_runner_disk.sh

      - name: Verify fresh paired release products without publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCHITECTURE"
          test "$(git rev-parse HEAD)" = "$PRODUCER_COMMIT"
          python3 -B -m tools.bcr_preflight --temp "$RUNNER_TEMP" --commit "$PRODUCER_COMMIT" \
            cli --platform "$PLATFORM" --prepare-native-delivery
          # The producer has validated the exact digest, identity and allowlisted pair.
          # Print that JSON receipt only. The executable and symbols stay on the runner.
          cat "$RUNNER_TEMP/donner-native-symbols/$PLATFORM/custody.json"
