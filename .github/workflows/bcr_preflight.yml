name: BCR Preflight

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: [main]
  # A pull request runs the preflight only when it changes something the preflight consumes:
  # the module and its build configuration (MODULE.bazel, .bazel* files, .bzl macros,
  # build_defs, config, third-party BUILD files, patches and licenses), the BUILD files of the
  # packages a consumer's libraries reach (donner/base, css, gpu and svg, apart from tests,
  # benchmarks, the Wasm bindings and the command-line tool), the archive's own rules
  # (.gitattributes, LICENSE, NOTICE), the BCR templates and example consumer, the release and
  # packaging inputs that select the full matrix (tools/bcr_preflight.py RELEASE_PATHS), and
  # the scripts its steps run. A change to sources or tests alone is built and tested by CI on
  # the same pull request, and the preflight still runs on every push to main, so a
  # consumer-only regression surfaces there the same day. Order matters: the negative
  # patterns drop only paths matched by the build-graph patterns above them.
  # tools/security_workflow_policy_tests.py checks that every RELEASE_PATHS input and every
  # tool a step runs starts the preflight, and that a source-only change does not.
  pull_request:
    paths:
      - .bazelignore
      - .bazelrc
      - .bazelversion
      - .bcr/**
      - .gitattributes
      - .github/workflows/bcr_preflight.yml
      - .github/workflows/publish_bcr.yml
      - .github/workflows/release.yml
      - "**/*.bzl"
      - donner/base/**/BUILD.bazel
      - donner/css/**/BUILD.bazel
      - donner/gpu/**/BUILD.bazel
      - donner/svg/**/BUILD.bazel
      - third_party/**/BUILD*
      - third_party/*.BUILD
      - third_party/*.patch
      - third_party/bazel/**
      - third_party/licenses/**
      - third_party/patches/**
      - "!**/tests/**"
      - "!**/*_tests/**"
      - "!**/benchmarks/**"
      - "!**/testdata/**"
      - "!donner/svg/renderer/wasm/**"
      - "!donner/svg/tool/**"
      - "!third_party/resvg-test-suite/**"
      - BUILD.bazel
      - LICENSE
      - MODULE.bazel
      - MODULE.bazel.lock
      - NOTICE
      - build_defs/**
      - config/**
      - donner/editor/BUILD.bazel
      - donner/editor/art/Donner.icns
      - donner/editor/art/Info.plist
      - donner/editor/write_build_info.sh
      - examples/bazel_consumer/**
      - tools/BUILD.bazel
      - tools/bcr_*
      - tools/ci/BUILD.bazel
      - tools/ci/free_hosted_macos_disk.sh
      - tools/ci/github_rate_limit.py
      - tools/ci/release_*
      - tools/ci_check_runner_disk.sh
      - tools/ci_macos_xcode.txt
      - tools/ci_select_macos_xcode.sh
      - tools/default_notice*
      - tools/editor_build_info_tests.py
      - tools/macos_editor_test_bundle*
      - tools/notice*
      - tools/release_*
      - tools/render_notice*
  # The full matrix qualifies a release candidate: run it nightly and on
  # request. Pushes to main run the slim check (see the prepare job).
  schedule:
    # After the other nightly workflows (latest: Coverage at 08:15 UTC).
    - cron: "35 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: donner
    outputs:
      source_commit: ${{ steps.archive.outputs.source_commit }}
      source_artifact: donner-bcr-source-${{ steps.archive.outputs.producer_run_attempt }}
      entry_artifact: donner-bcr-entry-${{ steps.archive.outputs.producer_run_attempt }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: donner
          fetch-depth: 0
          persist-credentials: false

      # Two scopes. The full matrix (Ubuntu and macOS consumers on Bazel 7 and
      # 8, both CLI builds, attestation and qualification) is what qualifies a
      # release candidate; it runs on schedule, on manual dispatch, and for a
      # pull request that changes release or packaging inputs. Pushes to main
      # and every other pull request run the slim check: this archive, the
      # registry admission check and one Ubuntu consumer on the newest Bazel,
      # so archive and basic consumer breakage still shows at once. A diff
      # that cannot be listed selects the full matrix. tools/bcr_preflight.py
      # lists the release and packaging inputs.
      - name: Select the preflight scope
        id: scope
        run: python3 -B -m tools.bcr_preflight scope

      - name: Prepare committed source archive
        id: archive
        run: |
          python3 -B -m tools.bcr_source archive \
            --output "$RUNNER_TEMP/donner-bcr/artifacts" --github-output "$GITHUB_OUTPUT"

      # An explicit ref: without one the checkout asks the REST API for the default branch,
      # which spends the repository's shared hourly API budget and fails when it is exhausted.
      - name: Checkout current BCR admission tools and registry metadata
        uses: actions/checkout@v7
        with:
          repository: bazelbuild/bazel-central-registry
          ref: main
          path: upstream-bcr
          persist-credentials: false

      - name: Prepare a disposable registry
        env:
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          python3 -B -m tools.bcr_source registry --upstream ../upstream-bcr \
            --output "$RUNNER_TEMP/donner-bcr/registry" --version "$VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate the candidate BCR entry without publishing
        uses: bazel-contrib/publish-to-bcr@v1.5.1
        with:
          tag: v${{ steps.archive.outputs.version }}
          module-version: ${{ steps.archive.outputs.version }}
          # Select the root template set; MODULE.bazel is read from the archive.
          module-roots: .
          templates-dir: donner/.bcr
          local-registry: ${{ runner.temp }}/donner-bcr/registry
          local-artifact-path: ${{ runner.temp }}/donner-bcr/artifacts
          attest: false

      - name: Validate registry admission against the candidate bytes
        env:
          SOURCE_COMMIT: ${{ steps.archive.outputs.source_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B -m tools.bcr_preflight admission --upstream ../upstream-bcr

      - name: Preserve candidate source bytes
        uses: actions/upload-artifact@v7
        with:
          name: donner-bcr-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: donner-bcr-entry-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/donner-bcr/registry/
            ${{ runner.temp }}/donner-bcr/admission.json
          if-no-files-found: ignore
          retention-days: 90

  consumer:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
        bazel: ['7.x', '8.x']
        # The slim check keeps only the Ubuntu consumer on the newest Bazel;
        # the full matrix excludes nothing.
        exclude:
          - os: ${{ needs.prepare.outputs.full_matrix == 'true' && 'none' || 'xcode-27' }}
          - bazel: ${{ needs.prepare.outputs.full_matrix == 'true' && 'none' || '7.x' }}
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: tools/ci_select_macos_xcode.sh
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bcr-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_artifact }}
          path: ${{ runner.temp }}/donner-bcr/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.entry_artifact }}
          path: ${{ runner.temp }}/donner-bcr/entry
      # Test and build from a consumer module, then audit the configured
      # closure of the Donner libraries it built (tools/bcr_preflight.py).
      - name: Exercise the archive through registry resolution
        run: python3 -B -m tools.bcr_preflight consumer

  cli-linux:
    needs: prepare
    if: ${{ needs.prepare.outputs.full_matrix == 'true' }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Install CLI build dependencies
        run: sudo apt-get install -y libncurses-dev
      # Resolve, prove the lockfile, test NOTICE coverage, then package
      # (tools/bcr_preflight.py).
      - name: Build and bind the Linux CLI to the preflight candidate
        run: python3 -B -m tools.bcr_preflight cli --platform linux-x86-64
      - uses: actions/upload-artifact@v7
        with:
          name: donner-svg-linux-x86-64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-cli-linux/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cli-macos:
    needs: prepare
    if: ${{ needs.prepare.outputs.full_matrix == 'true' }}
    runs-on: xcode-27
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      # Free space, in GiB, required before the build.
      MIN_FREE_DISK_GIB: "45"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh
      - name: Free hosted macOS disk
        shell: bash
        run: tools/ci/free_hosted_macos_disk.sh
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh
      - name: Build and bind the macOS CLI to the preflight candidate
        run: python3 -B -m tools.bcr_preflight cli --platform darwin-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: donner-svg-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-cli-macos/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: donner-editor-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-editor-macos/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest-artifacts:
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.full_matrix == 'true'
    needs: [prepare, cli-linux, cli-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_artifact }}
          path: ${{ runner.temp }}/donner-bcr/source
      # The CLI artifacts are bound to the attempt that built them; the release path pins that.
      - id: cli-linux-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-linux-x86-64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-linux
      - id: cli-macos-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-macos
      - id: editor-macos-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-editor-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/editor-macos
      - name: Explain missing CLI artifacts
        if: failure() && (steps.cli-linux-artifact.outcome == 'failure' || steps.cli-macos-artifact.outcome == 'failure')
        run: python3 -B -m tools.bcr_preflight explain-missing-cli
      - name: Verify the exact preflight source and CLI bytes
        run: python3 -B -m tools.bcr_preflight verify --with-source
      - name: Attest the preflight build artifacts
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/donner-bcr/editor-macos/donner-editor_darwin_arm64.zip
            ${{ runner.temp }}/donner-bcr/editor-macos/donner-editor_darwin_arm64.zip.bazel.lock
            ${{ runner.temp }}/donner-bcr/editor-macos/donner-editor_darwin_arm64.zip.NOTICE.txt
            ${{ runner.temp }}/donner-bcr/source/*.tar.gz
            ${{ runner.temp }}/donner-bcr/cli-linux/donner-svg_linux_x86_64
            ${{ runner.temp }}/donner-bcr/cli-linux/donner-svg_linux_x86_64.bazel.lock
            ${{ runner.temp }}/donner-bcr/cli-linux/donner-svg_linux_x86_64.NOTICE.txt
            ${{ runner.temp }}/donner-bcr/cli-macos/donner-svg_darwin_arm64
            ${{ runner.temp }}/donner-bcr/cli-macos/donner-svg_darwin_arm64.bazel.lock
            ${{ runner.temp }}/donner-bcr/cli-macos/donner-svg_darwin_arm64.NOTICE.txt

  qualify:
    needs: [prepare, consumer, cli-linux, cli-macos]
    if: ${{ needs.prepare.outputs.full_matrix == 'true' }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_artifact }}
          path: ${{ runner.temp }}/donner-bcr/artifacts
      # The CLI artifacts are bound to the attempt that built them; the release path pins that.
      - id: cli-linux-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-linux-x86-64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-linux
      - id: cli-macos-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-macos
      - id: editor-macos-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-editor-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/editor-macos
      - name: Explain missing CLI artifacts
        if: failure() && (steps.cli-linux-artifact.outcome == 'failure' || steps.cli-macos-artifact.outcome == 'failure')
        run: python3 -B -m tools.bcr_preflight explain-missing-cli
      - name: Verify both CLI artifacts from this preflight attempt
        run: python3 -B -m tools.bcr_preflight verify
      - name: Bind the source archive to the completed test matrix
        run: |
          python3 -B -m tools.bcr_source qualify --artifacts "$RUNNER_TEMP/donner-bcr/artifacts" \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v7
        with:
          name: donner-bcr-qualified-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
