name: BCR Preflight

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .bazelignore
      - .bazelrc
      - .bazelversion
      - .bcr/**
      - .gitattributes
      - .github/workflows/bcr_preflight.yml
      - .github/workflows/publish_bcr.yml
      - .github/workflows/release.yml
      - BUILD.bazel
      - MODULE.bazel
      - MODULE.bazel.lock
      - build_defs/**
      - config/**
      - donner/**
      - examples/bazel_consumer/**
      - third_party/**
      - tools/BUILD.bazel
      - tools/bcr_*.py
      - tools/notice_coverage*.py
      - tools/render_notice.py
      - "tools/ci/**"
      - tools/release_cli*.py
      - tools/release_artifact_publisher*.py
  # The full matrix qualifies a release candidate: run it nightly and on
  # request. Pushes to main run the slim check (see the prepare job).
  schedule:
    # After the other nightly workflows (latest: Coverage at 08:15 UTC).
    - cron: "35 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: donner
    outputs:
      source_commit: ${{ steps.archive.outputs.source_commit }}
      source_artifact: donner-bcr-source-${{ steps.archive.outputs.producer_run_attempt }}
      entry_artifact: donner-bcr-entry-${{ steps.archive.outputs.producer_run_attempt }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: donner
          fetch-depth: 0
          persist-credentials: false

      # Two scopes. The full matrix (Ubuntu and macOS consumers on Bazel 7 and
      # 8, both CLI builds, attestation and qualification) is what qualifies a
      # release candidate; it runs on schedule, on manual dispatch, and for a
      # pull request that changes release or packaging inputs. Pushes to main
      # and every other pull request run the slim check: this archive, the
      # registry admission check and one Ubuntu consumer on the newest Bazel,
      # so archive and basic consumer breakage still shows at once. A diff
      # that cannot be listed selects the full matrix.
      - name: Select the preflight scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          full_matrix=true
          if [[ "$EVENT_NAME" == "push" ]]; then
            full_matrix=false
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if diff_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" &&
                changed="$(git -c core.quotePath=false diff --no-renames --name-only \
                  "$diff_base" "$HEAD_SHA")" &&
                [[ -n "$changed" ]]; then
              full_matrix=false
              while IFS= read -r path; do
                case "$path" in
                  MODULE.bazel|MODULE.bazel.lock|.bazelversion|.bazelrc|.bcr/*|\
                  examples/bazel_consumer/*|third_party/licenses/*|third_party/bazel/*|\
                  third_party/BUILD*|third_party/*.BUILD|third_party/*.bzl|\
                  third_party/patches/*|build_defs/licenses.bzl|build_defs/dep_audit.bzl|\
                  tools/BUILD.bazel|tools/bcr_*|tools/release_*|tools/notice*|\
                  tools/render_notice*|tools/default_notice*|tools/ci/BUILD.bazel|\
                  tools/ci/release_*|.github/workflows/bcr_preflight.yml|\
                  .github/workflows/publish_bcr.yml|.github/workflows/release.yml)
                    echo "Full preflight matrix selected by $path"
                    full_matrix=true
                    break
                    ;;
                esac
              done <<< "$changed"
            else
              echo "Could not list the pull request's changes; selecting the full matrix."
            fi
          fi
          echo "full_matrix=$full_matrix" >> "$GITHUB_OUTPUT"

      - name: Prepare committed source archive
        id: archive
        run: |
          python3 -B -m tools.bcr_source archive \
            --output "$RUNNER_TEMP/donner-bcr/artifacts" --github-output "$GITHUB_OUTPUT"

      - name: Checkout current BCR admission tools and registry metadata
        uses: actions/checkout@v7
        with:
          repository: bazelbuild/bazel-central-registry
          path: upstream-bcr
          persist-credentials: false

      - name: Prepare a disposable registry
        env:
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          python3 -B -m tools.bcr_source registry --upstream ../upstream-bcr \
            --output "$RUNNER_TEMP/donner-bcr/registry" --version "$VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate the candidate BCR entry without publishing
        uses: bazel-contrib/publish-to-bcr@v1.5.1
        with:
          tag: v${{ steps.archive.outputs.version }}
          module-version: ${{ steps.archive.outputs.version }}
          # Select the root template set; MODULE.bazel is read from the archive.
          module-roots: .
          templates-dir: donner/.bcr
          local-registry: ${{ runner.temp }}/donner-bcr/registry
          local-artifact-path: ${{ runner.temp }}/donner-bcr/artifacts
          attest: false

      - name: Validate registry admission against the candidate bytes
        env:
          SOURCE_COMMIT: ${{ steps.archive.outputs.source_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/bcr-validator"
          "$RUNNER_TEMP/bcr-validator/bin/pip" install --require-hashes \
            -r ../upstream-bcr/tools/requirements_lock.txt
          "$RUNNER_TEMP/bcr-validator/bin/python" -B -m tools.bcr_admission \
            --upstream ../upstream-bcr --registry "$RUNNER_TEMP/donner-bcr/registry" \
            --artifacts "$RUNNER_TEMP/donner-bcr/artifacts" --commit "$SOURCE_COMMIT" \
            --report "$RUNNER_TEMP/donner-bcr/admission.json"

      - name: Preserve candidate source bytes
        uses: actions/upload-artifact@v7
        with:
          name: donner-bcr-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: donner-bcr-entry-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/donner-bcr/registry/
            ${{ runner.temp }}/donner-bcr/admission.json
          if-no-files-found: ignore
          retention-days: 90

  consumer:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
        bazel: ['7.x', '8.x']
        # The slim check keeps only the Ubuntu consumer on the newest Bazel;
        # the full matrix excludes nothing.
        exclude:
          - os: ${{ needs.prepare.outputs.full_matrix == 'true' && 'none' || 'xcode-27' }}
          - bazel: ${{ needs.prepare.outputs.full_matrix == 'true' && 'none' || '7.x' }}
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: tools/ci_select_macos_xcode.sh
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: bcr-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_artifact }}
          path: ${{ runner.temp }}/donner-bcr/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.entry_artifact }}
          path: ${{ runner.temp }}/donner-bcr/entry
      - name: Exercise the archive through registry resolution
        run: |
          python3 -B -m tools.bcr_source consumer --artifacts "$RUNNER_TEMP/donner-bcr/artifacts" \
            --registry "$RUNNER_TEMP/donner-bcr/entry/registry" \
            --output "$RUNNER_TEMP/donner-bcr/consumer-test" --commit "$SOURCE_COMMIT"
          cd "$RUNNER_TEMP/donner-bcr/consumer-test/consumer"
          bazelisk test --lockfile_mode=off \
            --registry="file://${RUNNER_TEMP}/donner-bcr/consumer-test/registry" \
            --registry=https://bcr.bazel.build //:all
          bazelisk build --lockfile_mode=off \
            --registry="file://${RUNNER_TEMP}/donner-bcr/consumer-test/registry" \
            --registry=https://bcr.bazel.build \
            @donner//donner/base:base @donner//donner/css:css \
            @donner//donner/svg:svg @donner//donner/svg/renderer:renderer

          # Audit the configured closure of the Donner libraries built above, not the consumer
          # test, whose GoogleTest/pixelmatch dev deps must not mask Donner's production
          # dependency boundary. The audit rejects development-only, Geode, WebGPU and test
          # targets and any Rust rule, source, toolchain or crate, requires a cc_toolchain rule
          # and a C++ exec tool outside the libraries' configuration, then requires Rust rows
          # appended to this query output to be rejected.
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_COMMIT"
          bazelisk cquery --lockfile_mode=off \
            --registry="file://${RUNNER_TEMP}/donner-bcr/consumer-test/registry" \
            --registry=https://bcr.bazel.build \
            'deps(@donner//donner/base:base + @donner//donner/css:css +
              @donner//donner/svg:svg + @donner//donner/svg/renderer:renderer)' \
            --output=label_kind > "$RUNNER_TEMP/donner-bcr/consumer-closure.labels"
          python3 -B "$GITHUB_WORKSPACE/tools/bcr_dependency_closure.py" \
            --module "$GITHUB_WORKSPACE/MODULE.bazel" \
            --labels "$RUNNER_TEMP/donner-bcr/consumer-closure.labels"

  cli-linux:
    needs: prepare
    if: ${{ needs.prepare.outputs.full_matrix == 'true' }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Install CLI build dependencies
        run: sudo apt-get install -y libncurses-dev
      - name: Build and bind the Linux CLI to the preflight candidate
        run: |
          # The repository ignores MODULE.bazel.lock. Resolve once, then prove
          # the build is complete under that generated, retained lockfile.
          # The compiler identity probe shares the CLI's configuration, so provenance
          # names the compiler Bazel used rather than the runner's default c++.
          bazelisk build --lockfile_mode=update -c opt //tools/ci:release_svg //tools/ci:release_svg_notice \
            //tools/ci:release_compiler_identity
          bazelisk build --lockfile_mode=error -c opt //tools/ci:release_svg //tools/ci:release_svg_notice \
            //tools/ci:release_compiler_identity
          # The NOTICE must attribute every third-party component in this configuration's closure.
          bazelisk test --lockfile_mode=error -c opt //tools/ci:release_svg_notice_coverage
          python3 -B -m tools.release_cli package \
            --platform linux-x86-64 --binary bazel-bin/donner/svg/tool/donner-svg \
            --notice bazel-bin/third_party/licenses/notice_cli.txt \
            --compiler-probe bazel-bin/tools/ci/release_compiler_identity \
            --output "$RUNNER_TEMP/donner-cli-linux" --commit "$SOURCE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v7
        with:
          name: donner-svg-linux-x86-64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-cli-linux/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  cli-macos:
    needs: prepare
    if: ${{ needs.prepare.outputs.full_matrix == 'true' }}
    runs-on: xcode-27
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Build and bind the macOS CLI to the preflight candidate
        run: |
          bazelisk build --lockfile_mode=update -c opt //tools/ci:release_svg //tools/ci:release_svg_notice \
            //tools/ci:release_compiler_identity
          bazelisk build --lockfile_mode=error -c opt //tools/ci:release_svg //tools/ci:release_svg_notice \
            //tools/ci:release_compiler_identity
          # The NOTICE must attribute every third-party component in this configuration's closure.
          bazelisk test --lockfile_mode=error -c opt //tools/ci:release_svg_notice_coverage
          python3 -B -m tools.release_cli package \
            --platform darwin-arm64 --binary bazel-bin/donner/svg/tool/donner-svg \
            --notice bazel-bin/third_party/licenses/notice_cli.txt \
            --compiler-probe bazel-bin/tools/ci/release_compiler_identity \
            --output "$RUNNER_TEMP/donner-cli-macos" --commit "$SOURCE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v7
        with:
          name: donner-svg-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-cli-macos/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest-artifacts:
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.full_matrix == 'true'
    needs: [prepare, cli-linux, cli-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_artifact }}
          path: ${{ runner.temp }}/donner-bcr/source
      # The CLI artifacts are bound to the attempt that built them; the release path pins that.
      - id: cli-linux-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-linux-x86-64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-linux
      - id: cli-macos-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-macos
      - name: Explain missing CLI artifacts
        if: failure() && (steps.cli-linux-artifact.outcome == 'failure' || steps.cli-macos-artifact.outcome == 'failure')
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            echo "::error::If the download error above is 'Artifact not found', this attempt reran only failed jobs, and the CLI artifacts are bound to the attempt that built them; rerun all jobs."
          fi
          echo "::error::Otherwise the download failed for another reason; see the error above and the GitHub status page before rerunning."
          exit 1
      - name: Verify the exact preflight source and CLI bytes
        run: |
          python3 -B -m tools.bcr_source verify \
            --artifacts "$RUNNER_TEMP/donner-bcr/source" --commit "$SOURCE_COMMIT"
          python3 -B -m tools.release_cli verify \
            --artifacts "$RUNNER_TEMP/donner-bcr/cli-linux" --platform linux-x86-64 \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python3 -B -m tools.release_cli verify \
            --artifacts "$RUNNER_TEMP/donner-bcr/cli-macos" --platform darwin-arm64 \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Attest the preflight build artifacts
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/donner-bcr/source/*.tar.gz
            ${{ runner.temp }}/donner-bcr/cli-linux/donner-svg_linux_x86_64
            ${{ runner.temp }}/donner-bcr/cli-linux/donner-svg_linux_x86_64.bazel.lock
            ${{ runner.temp }}/donner-bcr/cli-linux/donner-svg_linux_x86_64.NOTICE.txt
            ${{ runner.temp }}/donner-bcr/cli-macos/donner-svg_darwin_arm64
            ${{ runner.temp }}/donner-bcr/cli-macos/donner-svg_darwin_arm64.bazel.lock
            ${{ runner.temp }}/donner-bcr/cli-macos/donner-svg_darwin_arm64.NOTICE.txt

  qualify:
    needs: [prepare, consumer, cli-linux, cli-macos]
    if: ${{ needs.prepare.outputs.full_matrix == 'true' }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.source_artifact }}
          path: ${{ runner.temp }}/donner-bcr/artifacts
      # The CLI artifacts are bound to the attempt that built them; the release path pins that.
      - id: cli-linux-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-linux-x86-64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-linux
      - id: cli-macos-artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-darwin-arm64-${{ needs.prepare.outputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/cli-macos
      - name: Explain missing CLI artifacts
        if: failure() && (steps.cli-linux-artifact.outcome == 'failure' || steps.cli-macos-artifact.outcome == 'failure')
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            echo "::error::If the download error above is 'Artifact not found', this attempt reran only failed jobs, and the CLI artifacts are bound to the attempt that built them; rerun all jobs."
          fi
          echo "::error::Otherwise the download failed for another reason; see the error above and the GitHub status page before rerunning."
          exit 1
      - name: Verify both CLI artifacts from this preflight attempt
        run: |
          python3 -B -m tools.release_cli verify \
            --artifacts "$RUNNER_TEMP/donner-bcr/cli-linux" --platform linux-x86-64 \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python3 -B -m tools.release_cli verify \
            --artifacts "$RUNNER_TEMP/donner-bcr/cli-macos" --platform darwin-arm64 \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Bind the source archive to the completed test matrix
        run: |
          python3 -B -m tools.bcr_source qualify --artifacts "$RUNNER_TEMP/donner-bcr/artifacts" \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v7
        with:
          name: donner-bcr-qualified-${{ github.run_attempt }}
          path: ${{ runner.temp }}/donner-bcr/artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
