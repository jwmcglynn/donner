name: Sanitizers

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Runs the sanitizer variants on a nightly schedule, but first checks whether
# main has advanced since the last successful run so idle days don't consume CI.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether nightly sanitizer jobs should run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py main-advanced --workflow sanitizers.yml

  asan:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'buildbuddy-write' || '' }}
      deployment: false
    # Budget: this job is an uncached full build, and its time appears to track hosted-runner
    # speed; test steps have taken about 68 to 120 minutes. Building only the tests that run under
    # the sanitizer saves an estimated 11 to 15 minutes, and 135 leaves headroom for a slow
    # runner. If a nightly approaches this limit, cut work or restore caching; do not raise it.
    timeout-minutes: 135
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # v2: older snapshots may hold remote cache hits from the partition that trusted pull
          # requests also wrote, before main got a partition of its own.
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-v2
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Configure BuildBuddy remote cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          download-outputs: minimal

      - name: Test //donner/... with ASan
        run: |
          python3 tools/ci/test_with_exclusions.py --exclude-suite //tools/ci:asan_exclusions -- \
            bazelisk test --config=asan-lane -- //donner/... -//donner/svg/renderer/geode/...
          bazelisk test --config=asan-lane-no-leaks \
            //donner/svg/renderer/geode/... //tools/ci:asan_no_leak_tests

      - name: Retain failed test evidence
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: sanitizers-${{ github.job }}-${{ runner.os }}

  ubsan:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'buildbuddy-write' || '' }}
      deployment: false
    # A cold sanitizer build plus the full sharded suite has exceeded 60 minutes while still
    # making forward progress. Keep the test command bounded without truncating its results.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # v2: older snapshots may hold remote cache hits from the partition that trusted pull
          # requests also wrote, before main got a partition of its own.
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-ubsan-v2
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Configure BuildBuddy remote cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          download-outputs: minimal

      - name: Test //donner/... with UBSan
        run: |
          python3 tools/ci/test_with_exclusions.py --exclude-suite //tools/ci:ubsan_exclusions -- \
            bazelisk test --config=ubsan-lane -- //donner/...

      - name: Replay untrusted-input fuzzer corpora with UBSan
        run: |
          bazelisk test --config=ubsan-corpus //...
          bazelisk test --config=ubsan-corpus-text-full //...
          bazelisk test --config=ubsan-corpus-geode //...

      - name: Retain failed test evidence
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: sanitizers-${{ github.job }}-${{ runner.os }}
