name: Sanitizers

# Runs the sanitizer variants on a nightly schedule, but first checks whether
# main has advanced since the last successful run so idle days don't consume CI.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether nightly sanitizer jobs should run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch requested; running sanitizer jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse origin/main)"
          last_success_sha="$(gh run list \
            --workflow=sanitizers.yml \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha')"

          if [[ -z "$last_success_sha" || "$last_success_sha" == "null" ]]; then
            echo "No previous successful sanitizers.yml run found; running sanitizer jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$last_success_sha" == "$main_sha" ]]; then
            echo "origin/main has not advanced since the last successful sanitizers.yml run; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "origin/main advanced from $last_success_sha to $main_sha; running sanitizer jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  asan:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    # Budget: this job is an uncached full build, and its time appears to track hosted-runner
    # speed; test steps have taken about 68 to 120 minutes. Building only the tests that run under
    # the sanitizer saves an estimated 11 to 15 minutes, and 135 leaves headroom for a slow
    # runner. If a nightly approaches this limit, cut work or restore caching; do not raise it.
    timeout-minutes: 135
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6 clang-tidy-19

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Configure BuildBuddy remote cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Test //donner/... with ASan
        run: |
          # The scheduled Fuzz workflow owns fuzz_target tests under ASan. Excluding them here keeps
          # this job focused on unit and integration coverage without running each timed fuzzer twice.
          # The GL replay suite is a wall-clock race/performance harness whose far-zoom case exceeds
          # its 180 s per-case watchdog under ASan; normal and UBSan lanes retain that coverage.
          # Allocation-tracker binaries replace the sanitizer allocator; keep them in normal lanes.
          # The WebAssembly package check only reads that package; keep it in normal lanes too.
          # Native Geode tests use raw non-owning webgpu.hpp handles in their harnesses, so run that
          # package separately with leak detection disabled while retaining ASan memory-safety checks.
          # Tag filters replace the .bazelrc default rather than adding to it, so repeat its
          # ci-remote-gpu exclusion: those remote-lane wrappers rerun the executable and tests of a
          # local twin that this lane already selects.
          # Build only the selected tests and their dependencies. Non-test targets never execute
          # here, so building them again under the sanitizer adds compile time but no sanitizer
          # signal; the normal CI lanes keep building them.
          python3 tools/ci/test_with_exclusions.py --exclude-suite //tools/ci:asan_exclusions -- \
            bazelisk test \
            --config=asan \
            --test_output=errors \
            --build_tests_only \
            --test_tag_filters=-fuzz_target,-ci-remote-gpu \
            --build_tag_filters=-fuzz_target,-ci-remote-gpu \
            -- \
            //donner/... \
            -//donner/svg/renderer/geode/...

          bazelisk test \
            --config=asan \
            --test_output=errors \
            --test_env=ASAN_OPTIONS=detect_leaks=0 \
            --build_tests_only \
            --test_tag_filters=-fuzz_target,-ci-remote-gpu \
            --build_tag_filters=-fuzz_target,-ci-remote-gpu \
            //donner/svg/renderer/geode/... \
            //tools/ci:asan_no_leak_tests

      - name: Retain failed test evidence
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: sanitizers-${{ github.job }}-${{ runner.os }}

  ubsan:
    runs-on: ubuntu-24.04
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    # A cold sanitizer build plus the full sharded suite has exceeded 60 minutes while still
    # making forward progress. Keep the test command bounded without truncating its results.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6 clang-tidy-19

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-ubsan
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Configure BuildBuddy remote cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Test //donner/... with UBSan
        run: |
          # The scheduled Fuzz workflow owns exploratory mutation under ASan. Keep the broad unit and
          # integration sweep here separate from deterministic corpus replay below.
          # Allocation-tracker binaries replace the sanitizer allocator; keep them in normal lanes.
          # The WebAssembly package check only reads that package; keep it in normal lanes too.
          # Tag filters replace the .bazelrc default rather than adding to it, so repeat its
          # ci-remote-gpu exclusion: those remote-lane wrappers rerun the executable and tests of a
          # local twin that this lane already selects.
          # Build only the selected tests and their dependencies. Non-test targets never execute
          # here, so building them again under the sanitizer adds compile time but no sanitizer
          # signal; the normal CI lanes keep building them.
          python3 tools/ci/test_with_exclusions.py --exclude-suite //tools/ci:ubsan_exclusions -- \
            bazelisk test \
            --config=ubsan \
            --test_output=errors \
            --build_tests_only \
            --test_tag_filters=-fuzz_target,-ci-remote-gpu \
            --build_tag_filters=-fuzz_target,-ci-remote-gpu \
            -- \
            //donner/...

      - name: Replay untrusted-input fuzzer corpora with UBSan
        run: |
          bazelisk test \
            --config=ubsan \
            --test_output=errors \
            --test_tag_filters=fuzz_ubsan \
            --build_tag_filters=fuzz_ubsan \
            //...

          bazelisk test \
            --config=ubsan \
            --config=text-full \
            --test_output=errors \
            --test_tag_filters=fuzz_ubsan_text_full \
            --build_tag_filters=fuzz_ubsan_text_full \
            //...

          bazelisk test \
            --config=ubsan \
            --config=geode \
            --test_output=errors \
            --test_tag_filters=fuzz_ubsan_geode \
            --build_tag_filters=fuzz_ubsan_geode \
            //...

      - name: Retain failed test evidence
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: sanitizers-${{ github.job }}-${{ runner.os }}
