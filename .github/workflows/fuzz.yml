name: Fuzz

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Runs the libFuzzer-tagged corpus regression suite. Split out of `main.yml`
# so it doesn't gate every main push (it adds 5–7 min and uses a separate
# toolchain that fights with the main build for cache slots).
#
# This lane owns exploratory mutation. `--config=fuzz-soak` raises the
# `{fuzzer}_soak` targets' libFuzzer budget ABOVE the old fixed 10 s, and PR CI
# excludes those targets by their `fuzz_soak` tag. That is where the mutation
# belongs: this lane builds with `--config=asan-fuzzer`, so an input it discovers
# reports a diagnosable sanitizer failure, while the PR sweep builds without
# sanitizers. The existing `{fuzzer}` corpus targets still replay on PRs. The
# production-budget image corpus is a separate manual nightly lane so the short PR
# target stays fast.
#
# - Schedule: 06:00 UTC daily — catches new corpus regressions within 24h.
# - workflow_dispatch — manual trigger for ad-hoc runs.
# Pull requests retain deterministic corpus replay through the normal Bazel test suite. The
# sanitizer-backed mutation lane runs after merge or on demand so it does not delay PR signal.
#
# macOS uses the LLVM 21 toolchain (--config=asan-fuzzer activates
# --config=latest_llvm) because Apple Clang lacks libclang_rt.fuzzer_osx.a.
# Linux fuzzers also run here so scheduled mutation covers both supported host toolchains.
#
# Each phase is `tools/ci/fuzz_lane.py <lane> <patterns>`: `bazelisk test --config=<lane>`, which
# reproduces it locally, then a check of the phase's build events. A soak result replayed from a
# cache did no fuzzing, so the fuzz lane configs disable test result caching and the check fails
# a phase that reports any cached test result, or none at all.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Dedicated cache slot for the asan-fuzzer toolchain so it doesn't
          # evict the default-config cache used by main.yml.
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-fuzzer
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Test fuzzers (libFuzzer via LLVM 21 toolchain)
        run: python3 tools/ci/fuzz_lane.py fuzz-lane //...

      - name: Test text-full fuzzers
        run: python3 tools/ci/fuzz_lane.py fuzz-lane-text-full //...

      - name: Soak image loader at production decode budget
        run: python3 tools/ci/fuzz_lane.py fuzz-lane-production-soak //tools/ci:image_loader_production_soak

      - name: Test Geode render fuzzers
        run: python3 tools/ci/fuzz_lane.py fuzz-lane-geode //...

      - name: Retain failed test evidence
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: fuzz-${{ github.job }}-${{ runner.os }}

  macos:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Dedicated cache slot for the asan-fuzzer toolchain so it doesn't
          # evict the default-config cache used by main.yml.
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-fuzzer
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Test fuzzers (libFuzzer via LLVM 21 toolchain)
        run: python3 tools/ci/fuzz_lane.py fuzz-lane //...

      - name: Test text-full fuzzers
        run: python3 tools/ci/fuzz_lane.py fuzz-lane-text-full //...

      - name: Soak image loader at production decode budget
        run: python3 tools/ci/fuzz_lane.py fuzz-lane-production-soak //tools/ci:image_loader_production_soak

      - name: Retain failed test evidence
        if: failure()
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: fuzz-${{ github.job }}-${{ runner.os }}
