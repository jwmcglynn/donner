name: Fuzz

# Runs the libFuzzer-tagged corpus regression suite. Split out of `main.yml`
# so it doesn't gate every main push (it adds 5–7 min and uses a separate
# toolchain that fights with the main build for cache slots).
#
# This lane owns exploratory mutation. `--config=fuzz-soak` raises the
# `{fuzzer}_soak` targets' libFuzzer budget ABOVE the old fixed 10 s, whereas
# the PR gate now runs them briefly. That is where the mutation belongs: this
# lane builds with `--config=asan-fuzzer`, so an input it discovers reports a
# diagnosable sanitizer failure, while the PR sweep builds without sanitizers
# and its mutation time was searching with the detectors switched off. Corpus
# REGRESSION coverage did not move - the `{fuzzer}` targets replay every
# checked-in corpus input with no time budget and still run on every PR.
#
# - Schedule: 06:00 UTC daily — catches new corpus regressions within 24h.
# - workflow_dispatch — manual trigger for ad-hoc runs.
# - pull_request paths — re-runs on PRs that touch fuzz-relevant code.
#
# macOS uses the LLVM 21 toolchain (--config=asan-fuzzer activates
# --config=latest_llvm) because Apple Clang lacks libclang_rt.fuzzer_osx.a.
# Linux fuzzers also run here so PRs touching fuzz code get a single signal
# from one workflow rather than two.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".bazelrc"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "**/*_fuzzer.cc"
      - "**/*_fuzzer.cpp"
      - "**/*_fuzzer.h"
      - "**/corpus/**"
      - "build_defs/**"
      - "donner/base/**"
      - "donner/css/**"
      - "donner/editor/**"
      - "donner/svg/**"
      - "tools/mcp-servers/editor-control/**"
      - "third_party/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('run-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sudo apt-get update
            sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
              mesa-vulkan-drivers libvulkan1 libvulkan-dev \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
              libgl1-mesa-dev

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Dedicated cache slot for the asan-fuzzer toolchain so it doesn't
          # evict the default-config cache used by main.yml.
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-fuzzer
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Test fuzzers (libFuzzer via LLVM 21 toolchain)
        run: |
          bazelisk test \
            --config=asan-fuzzer \
            --config=fuzz-soak \
            --test_output=errors \
            --test_tag_filters=fuzz_target \
            --build_tag_filters=fuzz_target \
            //...

      - name: Test text-full fuzzers
        run: |
          bazelisk test \
            --config=asan-fuzzer \
            --config=fuzz-soak \
            --config=text-full \
            --test_output=errors \
            //donner/base/fonts:woff2_parser_fuzzer \
            //donner/base/fonts:woff2_parser_fuzzer_soak \
            //donner/svg/parser:svg_parser_structured_fuzzer \
            //donner/svg/parser:svg_parser_structured_fuzzer_soak \
            //donner/svg/renderer/tests:svg_document_render_fuzzer \
            //donner/svg/renderer/tests:svg_document_render_fuzzer_soak

      - name: Test Geode render fuzzer
        run: |
          bazelisk test \
            --config=geode \
            --config=asan-fuzzer \
            --config=fuzz-soak \
            --test_output=errors \
            //donner/svg/renderer/tests:svg_document_render_fuzzer \
            //donner/svg/renderer/tests:svg_document_render_fuzzer_soak

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Dedicated cache slot for the asan-fuzzer toolchain so it doesn't
          # evict the default-config cache used by main.yml.
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-asan-fuzzer
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Test fuzzers (libFuzzer via LLVM 21 toolchain)
        run: |
          bazelisk test \
            --config=asan-fuzzer \
            --config=fuzz-soak \
            --test_output=errors \
            --test_tag_filters=fuzz_target \
            --build_tag_filters=fuzz_target \
            //...

      - name: Test text-full fuzzers
        run: |
          bazelisk test \
            --config=asan-fuzzer \
            --config=fuzz-soak \
            --config=text-full \
            --test_output=errors \
            //donner/base/fonts:woff2_parser_fuzzer \
            //donner/base/fonts:woff2_parser_fuzzer_soak \
            //donner/svg/parser:svg_parser_structured_fuzzer \
            //donner/svg/parser:svg_parser_structured_fuzzer_soak \
            //donner/svg/renderer/tests:svg_document_render_fuzzer \
            //donner/svg/renderer/tests:svg_document_render_fuzzer_soak
