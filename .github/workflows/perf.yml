name: Perf

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Runs wall-clock perf targets on a nightly schedule after checking whether
# origin/main advanced since the last successful run.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether nightly perf jobs should run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py main-advanced --workflow perf.yml

  perf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            target_tag: perf
            # The interaction latency gates miss their targets on this hosted runner (#1666), so
            # this job records them without failing on a miss. Every other run enforces them.
            latency_gates: report
            # Likewise the tracked completion checks, each only in the browser (and phase) it fails
            # in, until their fixes (#1675, #1676, #2106).
            completion_checks: report
          - os: ubuntu-24.04
            target_tag: perf_linux
            latency_gates: enforce
            completion_checks: enforce
    runs-on: ${{ matrix.os }}
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-perf
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Discover perf-tagged test targets
        id: discover
        shell: bash
        env:
          TARGET_TAG: ${{ matrix.target_tag }}
        run: |
          set -euo pipefail

          targets="$(
            bazelisk query "tests(//...) intersect attr(\"tags\", \"${TARGET_TAG}\", //...)" |
              python3 -c 'import sys; print(" ".join(line.strip() for line in sys.stdin if line.strip()))'
          )"

          if [[ -z "$targets" ]]; then
            if [[ "$TARGET_TAG" == "perf_linux" ]]; then
              echo "No Linux GPU perf targets found; the nightly lane must measure recording and Vulkan."
              exit 1
            fi
            echo "No perf-tagged test targets found."
            echo "targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Test perf-tagged targets
        id: perf
        if: steps.discover.outputs.targets != ''
        env:
          TARGET_TAG: ${{ matrix.target_tag }}
        run: |
          set -euo pipefail
          common_flags=(
            --config=ci
            -c opt
            --build_tag_filters="$TARGET_TAG"
            --test_tag_filters="$TARGET_TAG"
            --test_env=DONNER_BROWSER_LATENCY_GATES=${{ matrix.latency_gates }}
            --test_env=DONNER_BROWSER_COMPLETION_CHECKS=${{ matrix.completion_checks }}
          )
          # Finish compilation before measuring, then run one uncached test at a time.
          bazelisk build "${common_flags[@]}" ${{ steps.discover.outputs.targets }}
          bazelisk test "${common_flags[@]}" \
            --test_output=all --local_test_jobs=1 --nocache_test_results \
            ${{ steps.discover.outputs.targets }}

      - name: Summarize interaction latency gates
        if: ${{ !cancelled() && matrix.target_tag == 'perf' && steps.perf.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          node donner/editor/wasm/tests/latency-gate-summary.mjs bazel-testlogs/donner/editor/wasm/tests/browser_responsiveness_perf_test/test.log >> "$GITHUB_STEP_SUMMARY"

      # Both matrix entries run this job, so artifact names carry the entry's target tag.
      - name: Upload perf test failure artifacts
        if: failure() && steps.perf.outcome == 'failure'
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: perf-test-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.target_tag }}

      # A passing browser responsiveness run prints more than Bazel's console limit, so its
      # measured values are kept only in its test log; retain passing runs' logs as well.
      - name: Upload perf test logs
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: perf-test-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.target_tag }}
