name: Perf

# Runs wall-clock perf targets on a nightly schedule after checking whether
# origin/main advanced since the last successful run.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether nightly perf jobs should run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch requested; running perf jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse origin/main)"
          last_success_sha="$(gh run list \
            --workflow=perf.yml \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha')"

          if [[ -z "$last_success_sha" || "$last_success_sha" == "null" ]]; then
            echo "No previous successful perf.yml run found; running perf jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$last_success_sha" == "$main_sha" ]]; then
            echo "origin/main has not advanced since the last successful perf.yml run; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "origin/main advanced from $last_success_sha to $main_sha; running perf jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  perf:
    strategy:
      matrix:
        include:
          - os: macos-26
            target_tag: perf
            # The interaction latency gates miss their targets on this hosted runner (#1666), so
            # this job records them without failing on a miss. Every other run enforces them.
            latency_gates: report
            # Likewise two tracked checks of the same case, each only in the browser it fails in,
            # until their fixes (#1675, #1676).
            completion_checks: report
    runs-on: ${{ matrix.os }}
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            pkg-config libfontconfig1-dev libfreetype6-dev mesa-vulkan-drivers libvulkan1
            libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            libgl1-mesa-dev libosmesa6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-perf
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Discover perf-tagged test targets
        id: discover
        shell: bash
        env:
          TARGET_TAG: ${{ matrix.target_tag }}
        run: |
          set -euo pipefail

          targets="$(
            bazelisk query "tests(//...) intersect attr(\"tags\", \"${TARGET_TAG}\", //...)" |
              python3 -c 'import sys; print(" ".join(line.strip() for line in sys.stdin if line.strip()))'
          )"

          if [[ -z "$targets" ]]; then
            if [[ "$TARGET_TAG" == "perf_linux" ]]; then
              echo "No Linux GPU perf targets found; the nightly lane must measure recording and Vulkan."
              exit 1
            fi
            echo "No perf-tagged test targets found."
            echo "targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Test perf-tagged targets
        id: perf
        if: steps.discover.outputs.targets != ''
        env:
          TARGET_TAG: ${{ matrix.target_tag }}
        run: |
          # Diagnostic only: the Firefox held-drag case observed by per-frame pixel readback (the
          # old path, forced) and by presented-frame statistics, six serialized runs each.
          status=0
          for mode in pixel stats; do
            force=0
            [[ "$mode" == "pixel" ]] && force=1
            echo "::group::held drag in Firefox, $mode"
            bazelisk test \
              --config=ci \
              -c opt \
              --build_tag_filters=perf \
              --test_tag_filters=perf \
              --experimental_ui_max_stdouterr_bytes=8000000 \
              --test_output=all \
              --nocache_test_results \
              --runs_per_test=6 \
              --local_test_jobs=1 \
              --test_env=DIAG_FORCE_PIXEL_PROBE="$force" \
              '--test_arg=--grep=held drag advances' \
              --test_arg=--project=firefox \
              //donner/editor/wasm/tests:browser_responsiveness_perf_test || status=1
            echo "::endgroup::"
            mkdir -p "$RUNNER_TEMP/heldrag/$mode"
            cp -RL bazel-testlogs/donner/editor/wasm/tests/browser_responsiveness_perf_test/. \
              "$RUNNER_TEMP/heldrag/$mode/" || true
          done
          exit $status

      - name: Upload held-drag diagnostic logs
        if: ${{ !cancelled() && steps.perf.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: heldrag-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heldrag
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize interaction latency gates
        if: ${{ !cancelled() && matrix.target_tag == 'perf' && steps.perf.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          node donner/editor/wasm/tests/latency-gate-summary.mjs bazel-testlogs/donner/editor/wasm/tests/browser_responsiveness_perf_test/test.log >> "$GITHUB_STEP_SUMMARY"

      # Both matrix entries run this job, so artifact names carry the entry's target tag.
      - name: Upload perf test failure artifacts
        if: failure() && steps.perf.outcome == 'failure'
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: perf-test-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.target_tag }}

      # A passing browser responsiveness run prints more than Bazel's console limit, so its
      # measured values are kept only in its test log; retain passing runs' logs as well.
      - name: Upload perf test logs
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: perf-test-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.target_tag }}
