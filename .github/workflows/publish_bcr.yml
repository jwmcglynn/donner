name: Prepare BCR submission

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# A maintainer approves one published release and its candidate record. The record supplies the
# approved source digest, the preflight attempt and the registry entry that preflight generated
# and ran through the upstream BCR validator; that exact entry is submitted, never regenerated.
# The workflow prepares a fork branch only. It never opens an upstream pull request.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release workflow run approved for BCR submission
        required: true
        type: string
      record_sha256:
        description: SHA-256 of the release's candidate record, from its Release-Candidate-Record line
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bcr-publication
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'jwmcglynn/donner' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      source_sha256: ${{ steps.plan.outputs.source_sha256 }}
      record_sha256: ${{ steps.plan.outputs.record_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RECORD_SHA256: ${{ inputs.record_sha256 }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Checks the release body names the approved retained assembly record and verifies
      # its attestation, the published source digest and the record's exact preflight attempt.
      - name: Verify the release and its candidate record and plan the submission
        id: plan
        run: |
          python3 -B -m tools.bcr_release plan-submission \
            --release-run-id "$RELEASE_RUN_ID" \
            --record-sha256 "$RECORD_SHA256" \
            --work "$RUNNER_TEMP/bcr-plan" \
            --github-output "$GITHUB_OUTPUT"

  promote-entry:
    needs: validate
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      base: ${{ steps.commit.outputs.base }}
      commit: ${{ steps.commit.outputs.commit }}
      tree: ${{ steps.commit.outputs.tree }}
      bundle_sha256: ${{ steps.commit.outputs.bundle_sha256 }}
    steps:
      - name: Checkout trusted publication checks
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout approved module source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          path: this
          persist-credentials: false
      - name: Checkout BCR for the proposed entry
        uses: actions/checkout@v7
        with:
          repository: bazelbuild/bazel-central-registry
          ref: main
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the admission-validated entry the record names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RECORD_SHA256: ${{ needs.validate.outputs.record_sha256 }}
        run: |
          PYTHONPATH=trusted python3 -B -m tools.bcr_release fetch-entry \
            --tag "$TAG" --record-sha256 "$RECORD_SHA256" --source this \
            --work "$RUNNER_TEMP/validated-entry"
      - name: Stage the validated entry with derived metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          PYTHONPATH=trusted python3 -B -m tools.bcr_release stage-entry \
            --entry "$RUNNER_TEMP/validated-entry/entry" --registry registry --source this \
            --version "$VERSION"
      # Checks the staged change as verify-generated does, then commits it on the submission
      # branch and bundles that one commit. Outputs its base, commit, tree and bundle digest.
      - name: Verify and bundle the proposed entry without a fork token
        id: commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_SOURCE_SHA256: ${{ needs.validate.outputs.source_sha256 }}
        run: |
          PYTHONPATH=trusted python3 -B -m tools.bcr_release bundle-entry \
            --registry registry --source this --tag "$TAG" --version "$VERSION" \
            --approved-sha256 "$APPROVED_SOURCE_SHA256" \
            --validated-entry "$RUNNER_TEMP/validated-entry/entry" \
            --bundle "$GITHUB_WORKSPACE/bcr-entry.bundle" --github-output "$GITHUB_OUTPUT"
      - name: Retain the exact proposed entry
        uses: actions/upload-artifact@v7
        with:
          name: bcr-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: bcr-entry.bundle
          if-no-files-found: error
          retention-days: 90

  prepare-fork:
    needs: [validate, promote-entry]
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout trusted publication checks
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout approved module source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          path: this
          persist-credentials: false
      - name: Checkout the exact BCR base
        uses: actions/checkout@v7
        with:
          repository: bazelbuild/bazel-central-registry
          ref: ${{ needs.promote-entry.outputs.base }}
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Download the proposed entry
        uses: actions/download-artifact@v8
        with:
          name: bcr-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared
      - name: Fetch the admission-validated entry again
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RECORD_SHA256: ${{ needs.validate.outputs.record_sha256 }}
        run: |
          PYTHONPATH=trusted python3 -B -m tools.bcr_release fetch-entry \
            --tag "$TAG" --record-sha256 "$RECORD_SHA256" --source this \
            --work "$RUNNER_TEMP/validated-entry"
      # Checks the bundle digest, the base checkout and the bundled commit, parent and tree, then
      # checks that commit as verify-generated does.
      - name: Verify the exact proposed commit without a fork token
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_SOURCE_SHA256: ${{ needs.validate.outputs.source_sha256 }}
          PREPARED_BASE: ${{ needs.promote-entry.outputs.base }}
          PREPARED_COMMIT: ${{ needs.promote-entry.outputs.commit }}
          PREPARED_TREE: ${{ needs.promote-entry.outputs.tree }}
          BUNDLE_SHA256: ${{ needs.promote-entry.outputs.bundle_sha256 }}
        run: |
          PYTHONPATH=trusted python3 -B -m tools.bcr_release verify-bundle \
            --registry registry --source this --tag "$TAG" --version "$VERSION" \
            --approved-sha256 "$APPROVED_SOURCE_SHA256" \
            --bundle "$GITHUB_WORKSPACE/prepared/bcr-entry.bundle" \
            --bundle-sha256 "$BUNDLE_SHA256" --base "$PREPARED_BASE" --tree "$PREPARED_TREE" \
            --validated-entry "$RUNNER_TEMP/validated-entry/entry" \
            --proposed-commit "$PREPARED_COMMIT"

  publish-fork:
    needs: [validate, promote-entry, prepare-fork]
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    environment: bcr-fork-preparation
    steps:
      - name: Download and reverify the entry without a fork token
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PREPARED_BASE: ${{ needs.promote-entry.outputs.base }}
          PREPARED_COMMIT: ${{ needs.promote-entry.outputs.commit }}
          PREPARED_TREE: ${{ needs.promote-entry.outputs.tree }}
          BUNDLE_SHA256: ${{ needs.promote-entry.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          mkdir prepared
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n "bcr-entry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -D prepared
          test "$(find prepared -type f | wc -l)" -eq 1
          printf '%s  %s\n' "$BUNDLE_SHA256" prepared/bcr-entry.bundle | sha256sum -c -
          PUSH_DIR="$RUNNER_TEMP/bcr-push"
          mkdir "$PUSH_DIR"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git init -q --template=/dev/null "$PUSH_DIR"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git -C "$PUSH_DIR" fetch --no-tags \
              https://github.com/bazelbuild/bazel-central-registry.git "$PREPARED_BASE"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git -C "$PUSH_DIR" bundle verify "$GITHUB_WORKSPACE/prepared/bcr-entry.bundle"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git -C "$PUSH_DIR" fetch --no-tags \
              "$GITHUB_WORKSPACE/prepared/bcr-entry.bundle" "refs/heads/donner-${TAG}"
          test "$(git -C "$PUSH_DIR" rev-parse FETCH_HEAD)" = "$PREPARED_COMMIT"
          test "$(git -C "$PUSH_DIR" rev-parse 'FETCH_HEAD^')" = "$PREPARED_BASE"
          test "$(git -C "$PUSH_DIR" rev-parse 'FETCH_HEAD^{tree}')" = "$PREPARED_TREE"
      - name: Create the fork branch only if absent
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PREPARED_COMMIT: ${{ needs.promote-entry.outputs.commit }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo 'The protected fork token is missing.' >&2
            exit 1
          fi
          PUSH_DIR="$RUNNER_TEMP/bcr-push"
          test "$(git -C "$PUSH_DIR" rev-parse FETCH_HEAD)" = "$PREPARED_COMMIT"
          FORK_URL="https://x-access-token:${PUBLISH_TOKEN}@github.com/jwmcglynn/bazel-central-registry.git"
          if /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git ls-remote --exit-code "$FORK_URL" "refs/heads/donner-${TAG}" \
            >/dev/null; then
            echo 'The fork branch already exists; inspect it before retrying.' >&2
            exit 1
          else
            test "$?" -eq 2
          fi
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git -C "$PUSH_DIR" -c core.hooksPath=/dev/null push \
              --force-with-lease="refs/heads/donner-${TAG}:" \
              "$FORK_URL" \
              "FETCH_HEAD:refs/heads/donner-${TAG}"
          echo "Prepared fork branch: jwmcglynn/bazel-central-registry:donner-${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the exact fork diff, then seek separate approval for an upstream PR.' >> "$GITHUB_STEP_SUMMARY"
          echo "Compare: https://github.com/bazelbuild/bazel-central-registry/compare/main...jwmcglynn:bazel-central-registry:donner-${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Suggested title: Publish donner@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Suggested body: Release: https://github.com/jwmcglynn/donner/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
