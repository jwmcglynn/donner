name: Prepare BCR submission

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release workflow run approved for BCR submission
        required: true
        type: string
      approved_source_commit:
        description: Reviewed full release source commit SHA
        required: true
        type: string
      approved_source_sha256:
        description: Reviewed release source archive SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bcr-publication
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'jwmcglynn/donner' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      APPROVED_SOURCE_COMMIT: ${{ inputs.approved_source_commit }}
      APPROVED_SOURCE_SHA256: ${{ inputs.approved_source_sha256 }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release and plan its registry submission
        id: plan
        run: |
          python3 -B -m tools.bcr_release plan-submission \
            --release-run-id "$RELEASE_RUN_ID" \
            --approved-commit "$APPROVED_SOURCE_COMMIT" \
            --approved-sha256 "$APPROVED_SOURCE_SHA256" \
            --github-output "$GITHUB_OUTPUT"


  generate-entry:
    needs: validate
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.commit.outputs.base }}
      commit: ${{ steps.commit.outputs.commit }}
      tree: ${{ steps.commit.outputs.tree }}
      bundle_sha256: ${{ steps.commit.outputs.bundle_sha256 }}
    steps:
      - name: Checkout trusted publication checks
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout approved module source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          path: this
          persist-credentials: false
      - name: Checkout BCR for the proposed entry
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: bazelbuild/bazel-central-registry
          ref: main
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Generate the registry entry
        uses: bazel-contrib/publish-to-bcr@f9cfe7aca4256bb57b9d96648ce408c77593665b # v1.5.0 action
        with:
          tag: ${{ needs.validate.outputs.tag }}
          module-version: ${{ needs.validate.outputs.version }}
          module-roots: .
          local-registry: registry
          templates-dir: this/.bcr
      - name: Verify and bundle the proposed entry without a fork token
        id: commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_SOURCE_SHA256: ${{ inputs.approved_source_sha256 }}
        run: |
          set -euo pipefail
          git -C registry add -- modules/donner
          PYTHONPATH=trusted python3 -B -m tools.bcr_release verify-generated \
            --registry registry --source this --version "$VERSION" \
            --approved-sha256 "$APPROVED_SOURCE_SHA256"
          TREE=$(git -C registry write-tree)
          BASE=$(git -C registry rev-parse HEAD)
          git -C registry checkout -b "donner-${TAG}"
          git -C registry -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -c user.name='Donner release' \
            -c user.email='donner-release@users.noreply.github.com' \
            commit -m "Publish donner@${VERSION}"
          COMMIT=$(git -C registry rev-parse HEAD)
          test "$(git -C registry rev-parse 'HEAD^{tree}')" = "$TREE"
          git -C registry bundle create "$GITHUB_WORKSPACE/bcr-entry.bundle" \
            "refs/heads/donner-${TAG}" "^$BASE"
          git -C registry bundle verify "$GITHUB_WORKSPACE/bcr-entry.bundle"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$(sha256sum bcr-entry.bundle | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain the exact proposed entry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bcr-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: bcr-entry.bundle
          if-no-files-found: error
          retention-days: 90

  prepare-fork:
    needs: [validate, generate-entry]
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    environment: bcr-fork-preparation
    steps:
      - name: Checkout trusted publication checks
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout approved module source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          path: this
          persist-credentials: false
      - name: Checkout the exact BCR base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: bazelbuild/bazel-central-registry
          ref: ${{ needs.generate-entry.outputs.base }}
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Download the proposed entry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bcr-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared
      - name: Verify the exact proposed commit without a fork token
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_SOURCE_SHA256: ${{ inputs.approved_source_sha256 }}
          PREPARED_BASE: ${{ needs.generate-entry.outputs.base }}
          PREPARED_COMMIT: ${{ needs.generate-entry.outputs.commit }}
          PREPARED_TREE: ${{ needs.generate-entry.outputs.tree }}
          BUNDLE_SHA256: ${{ needs.generate-entry.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$BUNDLE_SHA256" prepared/bcr-entry.bundle | sha256sum -c -
          test "$(git -C registry rev-parse HEAD)" = "$PREPARED_BASE"
          git -C registry bundle verify "$GITHUB_WORKSPACE/prepared/bcr-entry.bundle"
          git -C registry fetch --no-tags "$GITHUB_WORKSPACE/prepared/bcr-entry.bundle" \
            "refs/heads/donner-${TAG}"
          test "$(git -C registry rev-parse FETCH_HEAD)" = "$PREPARED_COMMIT"
          test "$(git -C registry rev-parse 'FETCH_HEAD^')" = "$PREPARED_BASE"
          test "$(git -C registry rev-parse 'FETCH_HEAD^{tree}')" = "$PREPARED_TREE"
          PYTHONPATH=trusted python3 -B -m tools.bcr_release verify-generated \
            --registry registry --source this --version "$VERSION" \
            --approved-sha256 "$APPROVED_SOURCE_SHA256" \
            --proposed-commit "$PREPARED_COMMIT"
      - name: Create the fork branch only if absent
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PREPARED_COMMIT: ${{ needs.generate-entry.outputs.commit }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo 'The protected fork token is missing.' >&2
            exit 1
          fi
          PUSH_DIR=$(/usr/bin/mktemp -d "$RUNNER_TEMP/bcr-push.XXXXXX")
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git init -q --template=/dev/null "$PUSH_DIR"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git -C "$PUSH_DIR" fetch --no-tags "$GITHUB_WORKSPACE/registry" \
              "$PREPARED_COMMIT"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git -C "$PUSH_DIR" -c core.hooksPath=/dev/null push \
              --force-with-lease="refs/heads/donner-${TAG}:" \
              "https://x-access-token:${PUBLISH_TOKEN}@github.com/jwmcglynn/bazel-central-registry.git" \
              "FETCH_HEAD:refs/heads/donner-${TAG}"
          echo "Prepared fork branch: jwmcglynn/bazel-central-registry:donner-${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the exact fork diff, then seek separate approval for an upstream PR.' >> "$GITHUB_STEP_SUMMARY"
          echo "Compare: https://github.com/bazelbuild/bazel-central-registry/compare/main...jwmcglynn:bazel-central-registry:donner-${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Suggested title: Publish donner@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Suggested body: Release: https://github.com/jwmcglynn/donner/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
