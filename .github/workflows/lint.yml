name: Lint

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, feature/ci-hardening-2026q2]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || (github.ref == 'refs/heads/main' && format('push-{0}-{1}', github.workflow, github.run_id) || format('push-{0}-{1}', github.workflow, github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

# Fast lint jobs covering checks that don't live inside `bazel test //...`:
#
# - build_defs/check_banned_patterns.py (covers the examples/ dir which
#   is not fully enumerated by the donner_cc_* py_test lint macros)
# - check_design_doc_provenance.py (ratchets exact model metadata on design docs)
# - gen_cmakelists.py unit tests + full --check validator (reentrant bazel
#   prevents running --check from inside bazel test; see design doc 0016)
# - tools/gpu_inventory checks (design doc 0053): manifest freshness and the
#   report-only no-Rust-dependency verifier; whole-tree scans that a sandboxed
#   bazel test cannot perform
jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      is_duplicate_push: ${{ steps.dup_push.outputs.is_duplicate_push }}
    steps:
      - id: dup_push
        name: Detect duplicate push (PR already open for this branch)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # See main.yml for rationale; same dup-push detection.
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "is_duplicate_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is_duplicate_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open_prs="$(gh pr list --repo "${{ github.repository }}" \
            --state open --head "${{ github.ref_name }}" \
            --json number -q 'length')"
          if [[ "${open_prs}" -gt 0 ]]; then
            echo "Skipping push CI: open PR already covers branch '${{ github.ref_name }}'"
            echo "is_duplicate_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_duplicate_push=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-lint-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-lint-
            ${{ runner.os }}-bazel-

      # Whole-repo banned-patterns gate. This replaces the 476 per-target
      # `{name}_lint` py_tests the donner_cc_* macros used to emit, which cost
      # 714 of the test suite's 2297 CPU-seconds to do what takes ~2.5 s here in
      # one process. The file set is strictly larger than the macros reached:
      # select()-valued and label-form srcs, manual-tagged targets, and files no
      # target enumerates are all covered now. `tools/lint.sh` is also the
      # documented local command, so this job and a contributor's machine run
      # exactly the same check.
      - name: Check banned patterns
        shell: bash
        run: tools/lint.sh

      - name: Check design document provenance
        run: python3 tools/check_design_doc_provenance.py

      - name: Check GPU inventory manifests are up to date
        run: python3 tools/gpu_inventory/generate_gpu_manifests.py --check

      - name: No-Rust-dependency verifier (report-only)
        run: python3 tools/gpu_inventory/check_no_rust_dependencies.py

  cmake-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: gen_cmakelists.py --check
        run: python3 tools/cmake/gen_cmakelists.py --check
