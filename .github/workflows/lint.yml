name: Lint

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: ["*"]
  pull_request:

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read
  pull-requests: read

# Fast lint jobs covering checks that don't live inside `bazel test //...`: the whole-tree
# checks in tools/ci/lint_lane.sh, and the gen_cmakelists.py --check validator (reentrant Bazel
# prevents running it from inside `bazel test`).

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      is_duplicate_push: ${{ steps.dup_push.outputs.is_duplicate_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools/ci

      - id: dup_push
        name: Detect duplicate push (PR already open for this branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py duplicate-push

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Local complexity lint compares the whole PR diff to its target branch.
          fetch-depth: 0
          persist-credentials: false

      # Every run restores; only main pushes save (end of job), so pull
      # requests and branch pushes read main's entry without writing their own.
      - name: Restore Bazel
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-lint-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-lint-
            ${{ runner.os }}-bazel-

      # The whole-tree checks that `bazel test //...` cannot run, in one documented local command;
      # tools/ci/lint_lane.sh lists them and why.
      - name: Lint
        run: tools/ci/lint_lane.sh

      - name: Save main Bazel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazel
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  cmake-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This check queries the Bazel graph, so retry it once when the first
      # attempt fails. Deterministic generator failures fail again on retry;
      # source lint checks remain single-attempt.
      - id: cmake-generator-check
        name: gen_cmakelists.py --check
        continue-on-error: true
        run: python3 tools/cmake/gen_cmakelists.py --check

      - name: Retry gen_cmakelists.py --check
        if: steps.cmake-generator-check.outcome == 'failure'
        run: python3 tools/cmake/gen_cmakelists.py --check
