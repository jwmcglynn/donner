name: Lint

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: ["*"]
  pull_request:

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read
  pull-requests: read

# Fast lint jobs covering checks that don't live inside `bazel test //...`: the whole-tree
# checks in tools/ci/lint_lane.sh, and the gen_cmakelists.py --check validator (reentrant Bazel
# prevents running it from inside `bazel test`).

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
      is_duplicate_push: ${{ steps.dup_push.outputs.is_duplicate_push }}
      use_self_hosted_linux: ${{ steps.runner_gate.outputs.use_self_hosted_linux }}
      use_self_hosted_macos: ${{ steps.runner_gate.outputs.use_self_hosted_macos }}
      # The one pull request trust rule (.github/actions/pr-trust), shared with BuildBuddy.
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
    steps:
      - id: admission_source
        name: Checkout trusted admission code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: |
            tools/ci/gatekeeper.py
            tools/ci/github_rate_limit.py
            .github/actions/pr-trust
          sparse-checkout-cone-mode: false

      - id: comparison_source
        name: Checkout PR files for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          path: pr-input
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      # Admission and trust execute only base-pinned code; PR files are comparison data.
      - id: dup_push
        name: Detect duplicate push (PR already open for this branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gatekeeper.py duplicate-push

      - id: docs_only
        name: Detect docs-only PR
        working-directory: ${{ github.event_name == 'pull_request' && 'pr-input' || '.' }}
        run: python3 "$GITHUB_WORKSPACE/tools/ci/gatekeeper.py" docs-only

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust

      - id: runner_gate
        name: Determine trusted self-hosted runner routing
        env:
          TRUSTED_PR: ${{ steps.pr_trust.outputs.trusted_pr }}
          SELFHOSTED_LINUX_RUNNER: ${{ vars.SELFHOSTED_LINUX_RUNNER }}
          SELFHOSTED_MACOS_RUNNER: ${{ vars.SELFHOSTED_MACOS_RUNNER }}
        shell: bash
        run: |
          set -euo pipefail

          hosted_macos_label="$(
            python3 - <<'PY'
          import json
          import os

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          labels = (event.get("pull_request") or {}).get("labels") or []
          print("true" if isinstance(labels, list) and any(
              isinstance(label, dict) and label.get("name") == "ci:hosted-macos"
              for label in labels
          ) else "false")
          PY
          )"

          use_linux=false
          use_macos=false
          if [[ "$TRUSTED_PR" == "true" && "$SELFHOSTED_LINUX_RUNNER" == "true" ]]; then
            use_linux=true
          fi
          # An operator PR can select hosted macOS for this run without changing Linux routing.
          if [[ "$TRUSTED_PR" == "true" && "$SELFHOSTED_MACOS_RUNNER" == "true" &&
                "$hosted_macos_label" != "true" ]]; then
            use_macos=true
          fi

          echo "use_self_hosted_linux=$use_linux" >> "$GITHUB_OUTPUT"
          echo "use_self_hosted_macos=$use_macos" >> "$GITHUB_OUTPUT"
          echo "runner_route trusted_pr=$TRUSTED_PR linux=$use_linux macos=$use_macos"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && needs.gatekeeper.outputs.use_self_hosted_linux != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Local complexity lint compares the whole PR diff to its target branch.
          fetch-depth: 0
          persist-credentials: false

      # Every run restores; only main pushes save (end of job), so pull
      # requests and branch pushes read main's entry without writing their own.
      - name: Restore Bazel
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-lint-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-lint-
            ${{ runner.os }}-bazel-

      # The whole-tree checks that `bazel test //...` cannot run, in one documented local command;
      # tools/ci/lint_lane.sh lists them and why.
      - name: Lint
        run: tools/ci/lint_lane.sh

      - name: Save main Bazel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazel
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  cmake-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: gatekeeper
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && needs.gatekeeper.outputs.use_self_hosted_linux != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This check queries the Bazel graph, so retry it once when the first
      # attempt fails. Deterministic generator failures fail again on retry;
      # source lint checks remain single-attempt.
      - id: cmake-generator-check
        name: gen_cmakelists.py --check
        continue-on-error: true
        run: python3 tools/cmake/gen_cmakelists.py --check

      - name: Retry gen_cmakelists.py --check
        if: steps.cmake-generator-check.outcome == 'failure'
        run: python3 tools/cmake/gen_cmakelists.py --check

  lint-self-hosted:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    needs: gatekeeper
    # Lint and provenance checks also run on documentation-only PRs.
    if: ${{ needs.gatekeeper.outputs.is_duplicate_push != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && needs.gatekeeper.outputs.use_self_hosted_linux == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate nested Bazel invocations
        shell: bash
        run: |
          set -euo pipefail
          bazel_binary="$(command -v bazelisk)"
          wrapper_dir="${RUNNER_TEMP}/lint-bazel"
          mkdir -p "$wrapper_dir"
          printf '#!/usr/bin/env bash\nexec %q --nohome_rc --nosystem_rc "$@"\n' "$bazel_binary" > "$wrapper_dir/bazel"
          chmod +x "$wrapper_dir/bazel"
          ln -s bazel "$wrapper_dir/bazelisk"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Lint
        run: tools/ci/lint_lane.sh

      - id: cmake-generator-check
        name: gen_cmakelists.py --check
        continue-on-error: true
        run: python3 tools/cmake/gen_cmakelists.py --check

      - name: Retry gen_cmakelists.py --check
        if: steps.cmake-generator-check.outcome == 'failure'
        run: python3 tools/cmake/gen_cmakelists.py --check
