name: Coverage

# Measures line and branch coverage of the complete product tree on main and
# uploads it to Codecov as the project baseline (the `unittests` flag).
#
# Coverage runs nightly and on manual dispatch only. It is the most expensive
# workflow in the repository, and its result ends in a third-party upload:
# running it on every pull request and main push let an outage of that service
# turn unrelated changes red. Pull requests therefore get no coverage run, no
# Codecov upload and no patch-coverage status or comment (codecov.yml turns
# both off). Their tests still run uninstrumented in main.yml.
#
# Every run measures main. A scheduled run always checks out the default
# branch; a manual dispatch from any other ref fails at its first step rather
# than uploading a branch report under the main baseline flag.
on:
  schedule:
    # After the other nightly workflows (06:00 fuzz, 07:00 sanitizers, 07:18
    # editor Wasm, 07:30 perf, 07:45 hosted nightly; all UTC).
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Produces the report and hands it to upload-coverage as an artifact. The
  # Codecov upload lives in that separate job so a failed upload can be re-run
  # on its own ("Re-run failed jobs") in seconds with the report this job
  # already produced, instead of repeating the whole instrumented build.
  build:
    runs-on: ubuntu-24.04
    env:
      # The complete product tree. GPU implementation files enter the report
      # as SVG and editor dependencies, so their owning tests must run too; an
      # enumerated package list once silently omitted the entire GPU suite.
      COVERAGE_TARGETS: "//donner/..."
    outputs:
      report_artifact_id: ${{ steps.upload_report.outputs.artifact-id }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Coverage measures the main baseline; dispatch it on main, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free hosted runner disk
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Disk before cleanup"
          df -h /
          echo "::endgroup::"

          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /usr/share/swift
          docker system prune --all --force || true
          sudo apt-get clean

          echo "::group::Disk after cleanup"
          df -h /
          echo "::endgroup::"

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: "microsoft"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Coverage already keeps large instrumented objects, profraw files,
          # and LCOV merge outputs in Bazel's output tree. A second local
          # disk cache duplicates enough of that data to fill hosted runners.
          repository-cache: true
          external-cache: true
          cache-save: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncurses-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            mesa-vulkan-drivers libvulkan1 libvulkan-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libosmesa6-dev
          sudo apt-get clean

      - id: coverage
        name: Generate coverage
        shell: bash
        run: |
          set -euo pipefail
          read -r -a TARGETS <<< "$COVERAGE_TARGETS"
          printf "Coverage targets:\n"
          printf "  %s\n" "${TARGETS[@]}"
          echo "::group::Disk before coverage"
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          echo "::endgroup::"
          tools/coverage.sh --quiet --no-html "${TARGETS[@]}"
          echo "::group::Disk after coverage"
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          echo "::endgroup::"

          # tools/coverage.sh exits 0 without a report when every selected
          # target was skipped as incompatible with the host platform. That is
          # a legitimate local outcome for explicit labels, but the complete
          # product tree on this runner always has compatible tests, so here it
          # means a classification regression. Fail rather than finish green
          # with no baseline uploaded.
          if [[ -f coverage-report/coverage_skipped ]]; then
            echo "::error::Coverage produced no report: every selected target was skipped as incompatible with this runner. The complete product tree must produce a report."
            exit 1
          fi

      - name: Generate coverage proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/coverage_run_proof.py \
            --bep coverage-report/bep.json \
            --report coverage-report/filtered_report.dat \
            --patterns "$COVERAGE_TARGETS" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --revision "$GITHUB_SHA" \
            --output coverage-report/coverage-proof.json \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage test failure artifacts
        if: failure() && steps.coverage.outcome == 'failure'
        uses: ./.github/actions/upload-bazel-test-artifacts
        with:
          name: coverage-test-failure-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          path: coverage-report/*.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload coverage proof
        uses: actions/upload-artifact@v7
        with:
          name: coverage-proof-${{ github.job }}-${{ github.run_attempt }}
          path: coverage-report/coverage-proof.json
          if-no-files-found: error
          retention-days: 30

      # The handoff to upload-coverage, which downloads it by the artifact id
      # this step outputs, never by name. A re-run of only the upload job
      # reuses this job's outputs and so fetches the exact report this attempt
      # built, and a later attempt that uploads its own report hands over its
      # own id. The upload action refuses a second artifact with the same name
      # in a run unless told to overwrite; whether an earlier attempt's
      # artifact counts is not documented, so this is the job's last step: an
      # attempt that fails before it has uploaded nothing under this name.
      # if-no-files-found stays `error`: every earlier step succeeded, so a
      # missing report is a real defect. Three days lets a re-run of the upload
      # outlast a short outage of the upload service; the next nightly run
      # supersedes it.
      - id: upload_report
        name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/filtered_report.dat
          if-no-files-found: error
          retention-days: 3

  upload-coverage:
    needs: build
    runs-on: ubuntu-24.04
    # Runs only after a successful build, which always ends by uploading the
    # report; a failed or cancelled build skips this job. An upload failure
    # still fails the workflow run.

    steps:
      # The Codecov uploader maps report paths onto the repository's tracked
      # files, so it needs the source tree that produced the report.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.report_artifact_id }}
          path: coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-report/filtered_report.dat
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
          verbose: false
