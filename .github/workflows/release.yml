name: Release

# Publish only immutable artifacts built and qualified before the release event.
on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      attempt: ${{ steps.source.outputs.attempt }}
      artifact: ${{ steps.source.outputs.artifact }}
      linux_artifact: ${{ steps.source.outputs.linux_artifact }}
      macos_artifact: ${{ steps.source.outputs.macos_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event.release.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require preflight for the exact release source
        id: source
        run: |
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/donner-release-body.md"
          python3 -B -m tools.bcr_release select-preflight \
            --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --release-body-file "$RUNNER_TEMP/donner-release-body.md" \
            --github-output "$GITHUB_OUTPUT"

  publish-release-artifacts:
    needs: resolve-source
    runs-on: ubuntu-24.04
    env:
      RELEASE_ID: ${{ github.event.release.id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_UPLOAD_URL: ${{ github.event.release.upload_url }}
      SOURCE_RUN_ID: ${{ needs.resolve-source.outputs.run_id }}
      SOURCE_ATTEMPT: ${{ needs.resolve-source.outputs.attempt }}
    permissions:
      contents: write
      attestations: read
      actions: read
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Reverify release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$GITHUB_SHA"

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve-source.outputs.linux_artifact }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve-source.outputs.macos_artifact }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/macos

      - name: Download qualified source archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve-source.outputs.artifact }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/source

      - name: Verify source artifact provenance and contents
        run: |
          python3 -B -m tools.bcr_source verify --artifacts release/source \
            --commit "$GITHUB_SHA" --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

      - name: Verify immutable artifacts
        run: |
          python3 -B -m tools.release_cli verify --artifacts release/linux \
            --platform linux-x86-64 --commit "$GITHUB_SHA" \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"
          python3 -B -m tools.release_cli verify --artifacts release/macos \
            --platform darwin-arm64 --commit "$GITHUB_SHA" \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

      - name: Verify preflight build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/linux/donner-svg_linux_x86_64 \
            --repo jwmcglynn/donner \
            --signer-workflow jwmcglynn/donner/.github/workflows/bcr_preflight.yml \
            --source-digest "$GITHUB_SHA" > /dev/null
          gh attestation verify release/macos/donner-svg_darwin_arm64 \
            --repo jwmcglynn/donner \
            --signer-workflow jwmcglynn/donner/.github/workflows/bcr_preflight.yml \
            --source-digest "$GITHUB_SHA" > /dev/null
          gh attestation verify release/source/*.tar.gz \
            --repo jwmcglynn/donner \
            --signer-workflow jwmcglynn/donner/.github/workflows/bcr_preflight.yml \
            --source-digest "$GITHUB_SHA" > /dev/null

      - name: Upload verified release artifacts without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_artifact_publisher.py \
            release/linux/donner-svg_linux_x86_64 \
            release/linux/donner-svg_linux_x86_64.sha256 \
            release/linux/donner-svg_linux_x86_64.provenance \
            release/macos/donner-svg_darwin_arm64 \
            release/macos/donner-svg_darwin_arm64.sha256 \
            release/macos/donner-svg_darwin_arm64.provenance \
            release/source/*
