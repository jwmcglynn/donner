name: Release

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Publish only the immutable artifacts that one verified release candidate record names. The
# release body selects that record with `Release-Candidate-Record: <run>/<attempt> sha256:<digest>`.
on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-candidate:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.record.outputs.run_id }}
      attempt: ${{ steps.record.outputs.attempt }}
      artifact_id: ${{ steps.record.outputs.artifact_id }}
      record_sha256: ${{ steps.record.outputs.record_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event.release.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the candidate record for the exact release source
        id: record
        run: |
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/donner-release-body.md"
          python3 -B -m tools.bcr_release select-record \
            --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --release-body-file "$RUNNER_TEMP/donner-release-body.md" \
            --github-output "$GITHUB_OUTPUT"

  publish-release-artifacts:
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    env:
      RELEASE_ID: ${{ github.event.release.id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_UPLOAD_URL: ${{ github.event.release.upload_url }}
      RECORD_RUN_ID: ${{ needs.resolve-candidate.outputs.run_id }}
      RECORD_ATTEMPT: ${{ needs.resolve-candidate.outputs.attempt }}
      RECORD_ARTIFACT_ID: ${{ needs.resolve-candidate.outputs.artifact_id }}
      RECORD_SHA256: ${{ needs.resolve-candidate.outputs.record_sha256 }}
    permissions:
      contents: write
      attestations: read
      actions: read
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      # Runs before any repository code: the code this job runs with a write token must be the
      # published release commit, so the check stays here instead of in that code.
      - name: Reverify release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$GITHUB_SHA"

      # Downloads the named record and every artifact it binds by artifact ID, then reruns the
      # candidate verifier with the publication retention window. Only the source and CLI files
      # the record names are staged; nothing is selected by name or rebuilt.
      - name: Reverify the candidate record and stage its release files
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m tools.release_candidate release --source-root . \
            --record-run-id "$RECORD_RUN_ID" --record-attempt "$RECORD_ATTEMPT" \
            --record-artifact-id "$RECORD_ARTIFACT_ID" --record-sha256 "$RECORD_SHA256" \
            --work "$RUNNER_TEMP/candidate-work" --output "$RUNNER_TEMP/release" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify the candidate record attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$RUNNER_TEMP/candidate-work/record/candidate.json" \
            --repo jwmcglynn/donner \
            --signer-workflow jwmcglynn/donner/.github/workflows/release_candidate.yml \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main > /dev/null

      - name: Verify source artifact provenance and contents
        env:
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.preflight_run_id }}
          SOURCE_ATTEMPT: ${{ steps.candidate.outputs.preflight_attempt }}
        run: |
          python3 -B -m tools.bcr_source verify --artifacts "$RUNNER_TEMP/release/source" \
            --commit "$GITHUB_SHA" --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

      - name: Verify immutable artifacts
        env:
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.preflight_run_id }}
          SOURCE_ATTEMPT: ${{ steps.candidate.outputs.preflight_attempt }}
        run: |
          python3 -B -m tools.release_cli verify-release --release "$RUNNER_TEMP/release" \
            --commit "$GITHUB_SHA" --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

      - name: Verify preflight build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64 \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64.bazel.lock \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64.NOTICE.txt \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64 \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64.bazel.lock \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64.NOTICE.txt \
            "$RUNNER_TEMP"/release/source/*.tar.gz; do
            gh attestation verify "$subject" \
              --repo jwmcglynn/donner \
              --signer-workflow jwmcglynn/donner/.github/workflows/bcr_preflight.yml \
              --source-digest "$GITHUB_SHA" > /dev/null
          done

      - name: Upload verified release artifacts without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_artifact_publisher.py \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64 \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64.sha256 \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64.provenance \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64.bazel.lock \
            "$RUNNER_TEMP"/release/cli-linux/donner-svg_linux_x86_64.NOTICE.txt \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64 \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64.sha256 \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64.provenance \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64.bazel.lock \
            "$RUNNER_TEMP"/release/cli-macos/donner-svg_darwin_arm64.NOTICE.txt \
            "$RUNNER_TEMP"/release/source/* \
            "$RUNNER_TEMP"/release/donner-*.candidate.json
