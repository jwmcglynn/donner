name: Release

# Build and publish an immutable artifact set exactly once for each release.
on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      attempt: ${{ steps.source.outputs.attempt }}
      artifact: ${{ steps.source.outputs.artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require preflight for the exact release source
        id: source
        run: |
          python3 -B -m tools.bcr_release select-preflight \
            --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  linux:
    needs: resolve-source
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$GITHUB_SHA"

      - name: Install Clang dependencies
        run: |
          sudo apt-get install -y libncurses-dev

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build Binaries
        run: |
          mkdir release
          bazelisk build --lockfile_mode=off -c opt //tools/ci:release_svg
          cp bazel-bin/donner/svg/tool/donner-svg release/donner-svg_linux_x86_64
          (cd release && sha256sum donner-svg_linux_x86_64 > donner-svg_linux_x86_64.sha256)
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "release_tag=${RELEASE_TAG}"
            sha256sum .bazelversion .bazelrc MODULE.bazel third_party/bazel/non_bcr_deps.bzl
          } > release/donner-svg_linux_x86_64.provenance

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v7
        with:
          name: donner-svg-linux-x86-64-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  macos:
    needs: resolve-source
    if: github.run_attempt == 1
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$GITHUB_SHA"

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: |
            /private/var/tmp/_bazel_runner/
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build Binaries
        run: |
          mkdir release
          bazelisk build --lockfile_mode=off -c opt //tools/ci:release_svg
          cp bazel-bin/donner/svg/tool/donner-svg release/donner-svg_darwin_arm64
          (cd release && shasum -a 256 donner-svg_darwin_arm64 > donner-svg_darwin_arm64.sha256)
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "release_tag=${RELEASE_TAG}"
            shasum -a 256 .bazelversion .bazelrc MODULE.bazel third_party/bazel/non_bcr_deps.bzl
          } > release/donner-svg_darwin_arm64.provenance

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v7
        with:
          name: donner-svg-darwin-arm64-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish-release-artifacts:
    if: >-
      !cancelled() && needs.resolve-source.result == 'success' &&
      (needs.linux.result == 'success' ||
       (github.run_attempt > 1 && needs.linux.result == 'skipped')) &&
      (needs.macos.result == 'success' ||
       (github.run_attempt > 1 && needs.macos.result == 'skipped'))
    needs: [resolve-source, linux, macos]
    runs-on: ubuntu-24.04
    env:
      RELEASE_ID: ${{ github.event.release.id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_UPLOAD_URL: ${{ github.event.release.upload_url }}
      SOURCE_RUN_ID: ${{ needs.resolve-source.outputs.run_id }}
      SOURCE_ATTEMPT: ${{ needs.resolve-source.outputs.attempt }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Reverify release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$GITHUB_SHA"

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-linux-x86-64-${{ github.sha }}
          path: release/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: donner-svg-darwin-arm64-${{ github.sha }}
          path: release/macos

      - name: Download qualified source archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve-source.outputs.artifact }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/source

      - name: Verify source artifact provenance and contents
        run: |
          python3 -B -m tools.bcr_source verify --artifacts release/source \
            --commit "$GITHUB_SHA" --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

      - name: Verify immutable artifacts
        run: |
          (cd release/linux && sha256sum --check --strict donner-svg_linux_x86_64.sha256)
          (cd release/macos && sha256sum --check --strict donner-svg_darwin_arm64.sha256)
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "release_tag=${RELEASE_TAG}"
            sha256sum .bazelversion .bazelrc MODULE.bazel third_party/bazel/non_bcr_deps.bzl
          } > expected.provenance
          cmp --silent expected.provenance release/linux/donner-svg_linux_x86_64.provenance
          cmp --silent expected.provenance release/macos/donner-svg_darwin_arm64.provenance

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: |
            release/linux/donner-svg_linux_x86_64
            release/macos/donner-svg_darwin_arm64
            release/source/*.tar.gz

      - name: Upload verified release artifacts without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_artifact_publisher.py \
            release/linux/donner-svg_linux_x86_64 \
            release/linux/donner-svg_linux_x86_64.sha256 \
            release/linux/donner-svg_linux_x86_64.provenance \
            release/macos/donner-svg_darwin_arm64 \
            release/macos/donner-svg_darwin_arm64.sha256 \
            release/macos/donner-svg_darwin_arm64.provenance \
            release/source/*
