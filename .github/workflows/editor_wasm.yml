name: Editor WASM

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: ["main"]
    paths:
      - "tools/ci/**"
      - ".bazelignore"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/editor_wasm.yml"
      - ".github/actions/cache-bazel-actions/**"
      - "tools/ci_disk_cache.py"
      - ".github/actions/buildbuddy-cache/**"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "build_defs/**"
      - "config/**"
      - "donner/**"
      - "donner_icon.svg"
      - "third_party/**"
      - "tools/BUILD.bazel"
      - "tools/ci_check_runner_disk.sh"
      - "tools/ci_macos_xcode.txt"
      - "tools/ci_select_macos_xcode.sh"
      - "tools/http/**"
      - "tools/render_notice.py"
      - "tools/run-browser-ci.sh"
      - "tools/svg_suite/**"
  pull_request:
    paths:
      - "tools/ci/**"
      - ".bazelignore"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/editor_wasm.yml"
      - ".github/actions/cache-bazel-actions/**"
      - "tools/ci_disk_cache.py"
      - ".github/actions/buildbuddy-cache/**"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "build_defs/**"
      - "config/**"
      - "donner/**"
      - "donner_icon.svg"
      - "third_party/**"
      - "tools/BUILD.bazel"
      - "tools/ci_check_runner_disk.sh"
      - "tools/ci_macos_xcode.txt"
      - "tools/ci_select_macos_xcode.sh"
      - "tools/http/**"
      - "tools/render_notice.py"
      - "tools/run-browser-ci.sh"
      - "tools/svg_suite/**"
  schedule:
    - cron: "18 7 * * *"
  workflow_dispatch:

# A new commit on a pull request cancels the runs, queued or in progress, of its previous head.
# Only opened, synchronize and reopened events share the per-PR group. Every other run (push,
# schedule, dispatch, or a call from an edit) has a group of its own and is never cancelled.
# tools/ci_concurrency_policy_tests.py owns this exact setting.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}

permissions:
  contents: read

jobs:
  # Only the base revision may admit a PR to the BuildBuddy write environment.
  trust:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
      unified_macos: ${{ steps.pr_trust.outputs.unified_macos }}
    steps:
      - name: Checkout trust action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/actions/pr-trust

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust
        with:
          selfhosted_linux_runner: ${{ vars.SELFHOSTED_LINUX_RUNNER }}
          unified_re_canary: ${{ vars.UNIFIED_RE_CANARY }}

  hosted-selection:
    # This preflight reads the PR loading graph. It receives no cache-write or
    # deployment credentials, and no verdict can affect runner trust.
    if: github.event_name == 'pull_request' && needs.trust.outputs.unified_macos != 'true'
    needs: trust
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      mode: ${{ steps.determine.outcome == 'success' && steps.determine.outputs.hosted_editor_mode || 'full' }}
      browser-targets: ${{ steps.determine.outputs.hosted_editor_browser_targets }}
    steps:
      - name: Checkout the tested PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the planner to the tested merge parent
        id: planner-ref
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ancestry="$(git rev-list --parents -1 HEAD)"
          read -r checkout first second extra <<< "$ancestry"
          [[ "$checkout" == "$GITHUB_SHA" && "$first" =~ ^[0-9a-f]{40}$ && "$second" == "$PR_HEAD" && -z "$extra" ]]
          echo "revision=$first" >> "$GITHUB_OUTPUT"

      - name: Checkout the trusted planner
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.planner-ref.outputs.revision }}
          path: hosted-planner
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: |
            tools/ci
            .github/actions/prepare-bazel-diff

      - name: Identify the tested base for the hash cache
        id: pr-meta
        shell: bash
        run: bash hosted-planner/tools/ci/determine_targets.sh pr-meta

      - name: Prepare bazel-diff and restore base hashes
        if: steps.pr-meta.outputs.identical_tree != 'true'
        uses: ./hosted-planner/.github/actions/prepare-bazel-diff
        with:
          base-sha: ${{ steps.pr-meta.outputs.base_sha }}
          fetch-script: hosted-planner/tools/ci/fetch_bazel_diff.sh

      - name: Determine affected hosted Editor Wasm targets
        id: determine
        shell: bash
        run: bash hosted-planner/tools/ci/determine_targets.sh determine-hosted-editor

  build:
    # The hosted fallback runs unless a successful planner proves no input changed.
    # Main, schedule and dispatch retain the complete release-candidate graph.
    if: ${{ !cancelled() && needs.trust.result == 'success' && (github.event_name != 'pull_request' || (needs.trust.outputs.unified_macos != 'true' && (needs.hosted-selection.result != 'success' || needs.hosted-selection.outputs.mode != 'unaffected'))) }}
    runs-on: xcode-27
    needs: [trust, hosted-selection]
    env:
      HOSTED_EDITOR_BROWSER_TARGETS: ${{ github.event_name == 'pull_request' && needs.hosted-selection.result == 'success' && needs.hosted-selection.outputs.mode == 'browser_subset' && needs.hosted-selection.outputs.browser-targets || '' }}
      # Free space, in GiB, required after the caches are restored.
      MIN_FREE_DISK_GIB: "45"
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.trust.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      # The xcode-27 image starts with far less free disk than a cold build of the tree needs.
      - name: Free hosted macOS disk
        shell: bash
        run: tools/ci/free_hosted_macos_disk.sh

      - name: Setup Bazel for native browser comparison and Wasm build
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Restore Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: editor-wasm

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.trust.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.trust.outputs.trusted_pr }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: toplevel

      - name: Configure BuildBuddy read-only cache
        if: needs.trust.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          cache-partition: ${{ steps.xcode.outputs.cache_partition }}
          download-outputs: toplevel

      # Before Bazel, so a full disk fails in seconds with a clear error instead of an ENOSPC
      # late in the build.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # Repository downloads are the only retried part of this lane. Keeping
      # them separate prevents a compile or test failure from passing on retry.
      # tools/ci/editor_wasm_lane.sh holds each Bazel phase's commands.
      - id: editor-wasm-prefetch
        name: Prefetch Editor WASM dependencies
        continue-on-error: true
        run: tools/ci/editor_wasm_lane.sh prefetch

      - name: Retry Editor WASM dependency prefetch
        if: steps.editor-wasm-prefetch.outcome == 'failure'
        run: tools/ci/editor_wasm_lane.sh prefetch

      - name: Build and size-check Geode editor Wasm package
        id: wasm_graph
        env:
          PAYLOAD_BUDGET_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'report' || 'enforce' }}
        run: tools/ci/editor_wasm_lane.sh build

      - name: Collect Bazel browser evidence
        if: ${{ !cancelled() && steps.wasm_graph.outcome != 'skipped' }}
        env:
          GRAPH_OUTCOME: ${{ steps.wasm_graph.outcome }}
        run: |
          args=()
          if [[ "$GRAPH_OUTCOME" != success ]]; then args+=(--partial); fi
          python3 tools/ci/editor_wasm_evidence.py "$RUNNER_TEMP/editor-wasm-graph.bep.json" "$RUNNER_TEMP/editor-wasm-browser-evidence" "${args[@]}"

      - name: Snapshot the browser-tested release files
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        run: python3 tools/ci/editor_wasm_stage.py snapshot

      # Proves the generated MODULE.bazel.lock in error mode and snapshots it before later steps
      # can resolve more modules; the deployment candidate retains that snapshot and its digest.
      - name: Prove the package's resolved module graph
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        run: tools/ci/editor_wasm_lane.sh prove-lockfile "$RUNNER_TEMP/editor-wasm-module.lock"

      - name: Stage package for handoff
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        id: stage-package
        run: python3 tools/ci/editor_wasm_stage.py package

      - name: Upload Geode package artifact
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-package-geode-${{ github.sha }}
          path: ${{ steps.stage-package.outputs.handoff_dir }}
          if-no-files-found: error
          retention-days: 3

      - name: Run quarantined Firefox cases
        if: ${{ !cancelled() && github.event_name == 'schedule' && (steps.wasm_graph.outcome == 'success' || steps.wasm_graph.outcome == 'failure') }}
        continue-on-error: true
        run: tools/ci/editor_wasm_lane.sh quarantine

      - name: Collect quarantine evidence
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        run: python3 tools/ci/editor_wasm_evidence.py "$RUNNER_TEMP/editor-wasm-quarantine.bep.json" "$RUNNER_TEMP/editor-wasm-browser-evidence" --quarantine --partial

      # The report-only lane never fails the job, so its outcome reaches the
      # reader through the job summary and its evidence through its own upload.
      # Neither step fails the job on a missing report or missing evidence
      # either: a scheduled run that passed the regular lanes stays usable as a
      # release candidate source.
      - name: Summarize quarantined cases
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -uo pipefail
          node donner/editor/wasm/tests/quarantine-report-summary.mjs "$RUNNER_TEMP/editor-wasm-browser-evidence/firefox-quarantine-report/quarantine-report.json" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::Could not summarize the quarantined cases"

      - name: Upload quarantined case evidence
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-quarantine-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-wasm-browser-evidence/firefox-quarantine-report
          if-no-files-found: warn
          retention-days: 14

      # Each Bazel browser action owns its outputs. Keep the per-target archives and
      # positive case counts together. Retry an evidence upload under a distinct name.
      - name: Upload Playwright evidence
        id: upload-playwright-evidence-1
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-wasm-browser-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright evidence (attempt 2)
        id: upload-playwright-evidence-2
        if: ${{ !cancelled() && steps.upload-playwright-evidence-1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-evidence-${{ github.sha }}-${{ github.run_attempt }}-upload-2
          path: ${{ runner.temp }}/editor-wasm-browser-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright evidence (attempt 3)
        if: ${{ !cancelled() && steps.upload-playwright-evidence-1.outcome == 'failure' && steps.upload-playwright-evidence-2.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-evidence-${{ github.sha }}-${{ github.run_attempt }}-upload-3
          path: ${{ runner.temp }}/editor-wasm-browser-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Stage immutable Geode deployment candidate
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        id: stage-candidate
        env:
          PACKAGE_TARGET: ${{ steps.stage-package.outputs.package_target }}
        run: python3 tools/ci/editor_wasm_stage.py candidate

      - name: Upload Geode deployment candidate
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        id: upload-candidate
        uses: actions/upload-artifact@v7
        with:
          name: donner-editor-wasm-geode-${{ github.sha }}
          path: ${{ steps.stage-candidate.outputs.candidate_dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Record deployment candidate digest
        if: env.HOSTED_EDITOR_BROWSER_TARGETS == ''
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
        run: python3 tools/ci/editor_wasm_stage.py record-digest

      # Last step, after every Bazel command: evicts the action cache to its budget and saves
      # it on a main push.
      - name: Save Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: editor-wasm
          mode: save
