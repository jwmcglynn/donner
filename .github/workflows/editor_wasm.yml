name: Editor WASM

on:
  pull_request:
    branches: [main]
    paths:
      - ".bazelignore"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/editor_wasm.yml"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "build_defs/**"
      - "donner/**"
      - "donner_icon.svg"
      - "third_party/**"
      - "tools/http/**"
  schedule:
    - cron: "18 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('run-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: editor-wasm-${{ runner.os }}-geode
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build and size-check Geode editor Wasm package
        run: |
          bazelisk test --test_output=errors \
            //donner/editor/wasm:editor_wasm_transition_tests \
            //donner/svg/renderer:geode_excludes_tiny_skia_audit
          bazelisk test --config=editor-wasm --test_output=errors --remote_download_outputs=all //donner/editor/wasm:wasm_geode_package_size_tests

      - name: Stage package for handoff
        id: stage-package
        run: |
          set -euo pipefail
          pkg_rel=$(bazelisk cquery --config=editor-wasm --output=files \
            //donner/editor/wasm:wasm_web_package | head -n1)
          pkg_dir=$(cd "${pkg_rel}" && pwd -P)
          handoff_dir="${RUNNER_TEMP}/editor-wasm-package-geode"
          mkdir -p "${handoff_dir}"
          cp -RL "${pkg_dir}/." "${handoff_dir}/"
          echo "handoff_dir=${handoff_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload Geode package artifact
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-package-geode-${{ github.sha }}
          path: ${{ steps.stage-package.outputs.handoff_dir }}
          if-no-files-found: error
          retention-days: 3

  test:
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download Geode package
        uses: actions/download-artifact@v8
        with:
          name: editor-wasm-package-geode-${{ github.sha }}
          path: ${{ runner.temp }}/editor-wasm-package-geode

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Playwright
        working-directory: donner/editor/wasm/tests
        run: |
          npm ci
          npx playwright install chromium firefox webkit

      - name: Verify Geode-only package contracts
        working-directory: donner/editor/wasm/tests
        run: npm run test:selector

      - name: Serve Geode package and run browser suites
        env:
          DONNER_WASM_BACKEND: geode
          DONNER_WASM_REQUIRE_WEBGPU: "1"
        run: |
          set -euo pipefail
          pkg_dir="${RUNNER_TEMP}/editor-wasm-package-geode"
          server_log="${RUNNER_TEMP}/editor-wasm-geode-server.log"
          PYTHONUNBUFFERED=1 python3 tools/http/simple_webserver.py --no-https --host 127.0.0.1 \
            --dir "${pkg_dir}" >"${server_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          server_url=""
          for _ in $(seq 1 60); do
            server_url=$(sed -n 's/^Serving at //p' "${server_log}" | head -n1)
            if [[ -n "${server_url}" ]]; then break; fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${server_log}"
              wait "${server_pid}" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          test -n "${server_url}"
          export DONNER_WASM_BASE_URL="${server_url}"
          curl -fsS -o /dev/null "${DONNER_WASM_BASE_URL}/index.html"

          # Chromium runs every spec in the tests directory EXCEPT
          # composited-invariants.spec.ts, which the default config ignores:
          # its per-rAF composited sampler starves under SwiftShader, so it
          # runs on the platform GPU via its own config below.
          bash donner/editor/wasm/tests/run_tests.sh --headed
          npm --prefix donner/editor/wasm/tests run test:compatibility -- --project=firefox-geode-resize --headed
          npm --prefix donner/editor/wasm/tests run test:compatibility -- --project=webkit-geode-carousel --headed
          # Gecko lane for the composited-output invariant suite. It gets its
          # own config rather than another compatibility project: that config
          # pins an explicit spec list and per-project grep filters, while this
          # suite runs whole and needs a longer per-test timeout.
          bash donner/editor/wasm/tests/run_tests.sh --headed \
            --config=playwright.composited-firefox.config.js
          # Hardware-Chromium lane for the same suite (full Chromium build on
          # the platform GPU; SwiftShader cannot sustain the sampler).
          bash donner/editor/wasm/tests/run_tests.sh --headed \
            --config=playwright.composited-chromium.config.js

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-failure-${{ github.sha }}
          path: donner/editor/wasm/tests/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Stage immutable Geode deployment candidate
        id: stage-candidate
        run: |
          set -euo pipefail
          pkg_dir="${RUNNER_TEMP}/editor-wasm-package-geode"
          candidate_dir="${RUNNER_TEMP}/donner-editor-wasm-geode-${GITHUB_SHA}"
          site_dir="${candidate_dir}/site"
          deploy_dir="${candidate_dir}/deploy"
          mkdir -p "${site_dir}" "${deploy_dir}"
          cp -R "${pkg_dir}/." "${site_dir}/"

          expected_site_files=$(
            printf '%s\n' \
              donner_icon.svg \
              editor-bootstrap.js \
              editor.css \
              editor.js \
              editor.wasm \
              enable-threads.js \
              index.html \
              worker-surface-selector.js \
              | LC_ALL=C sort
          )
          actual_site_files=$(cd "${site_dir}" && find . -type f | sed 's|^./||' | LC_ALL=C sort)
          test "${actual_site_files}" = "${expected_site_files}"

          for file in \
            donner_icon.svg editor-bootstrap.js editor.css editor.js \
            enable-threads.js index.html worker-surface-selector.js; do
            cp "${site_dir}/${file}" "${deploy_dir}/${file}"
          done
          gzip -n -9 -c "${site_dir}/editor.wasm" > "${deploy_dir}/editor.wasm.gz"
          test "$(wc -c < "${deploy_dir}/editor.wasm.gz")" -le 20971520

          lockfile_sha256=$(shasum -a 256 donner/editor/wasm/tests/package-lock.json | awk '{print $1}')
          printf '%s\n' \
            "{\"source_revision\":\"${GITHUB_SHA}\",\"lockfile_sha256\":\"${lockfile_sha256}\",\"bazel_configs\":[\"editor-wasm\"],\"targets\":[\"//donner/editor/wasm:wasm_web_package\"],\"renderer\":\"geode\",\"transport_encoding\":\"gzip\"}" \
            > "${candidate_dir}/provenance.json"

          (
            cd "${candidate_dir}"
            find site deploy -type f | LC_ALL=C sort | while IFS= read -r file; do
              shasum -a 256 "${file}"
            done > SHA256SUMS
          )
          echo "candidate_dir=${candidate_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload Geode deployment candidate
        id: upload-candidate
        uses: actions/upload-artifact@v7
        with:
          name: donner-editor-wasm-geode-${{ github.sha }}
          path: ${{ steps.stage-candidate.outputs.candidate_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Record deployment candidate digest
        run: |
          echo "### Geode deployment candidate" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Source revision: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact digest: \`${{ steps.upload-candidate.outputs.artifact-digest }}\`" \
            >> "${GITHUB_STEP_SUMMARY}"
