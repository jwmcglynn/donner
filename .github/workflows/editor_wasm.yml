name: Editor WASM

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

on:
  push:
    branches: ["main"]
    paths:
      - "tools/ci/**"
      - ".bazelignore"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/editor_wasm.yml"
      - ".github/actions/cache-bazel-actions/**"
      - "tools/ci_disk_cache.py"
      - ".github/actions/buildbuddy-cache/**"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "build_defs/**"
      - "donner/**"
      - "donner_icon.svg"
      - "third_party/**"
      - "tools/http/**"
      - "tools/run-browser-ci.sh"
  pull_request:
    paths:
      - "tools/ci/**"
      - ".bazelignore"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/editor_wasm.yml"
      - ".github/actions/cache-bazel-actions/**"
      - "tools/ci_disk_cache.py"
      - ".github/actions/buildbuddy-cache/**"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "build_defs/**"
      - "donner/**"
      - "donner_icon.svg"
      - "third_party/**"
      - "tools/http/**"
      - "tools/run-browser-ci.sh"
  schedule:
    - cron: "18 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Classify pull request trust at job level, so the build job can bind the
  # BuildBuddy write environment only for runs allowed to write.
  trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trusted_pr: ${{ steps.pr_trust.outputs.trusted_pr }}
      renovate_pr: ${{ steps.pr_trust.outputs.renovate_pr }}
    steps:
      - name: Checkout trust action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/pr-trust

      - id: pr_trust
        name: Classify pull request trust
        uses: ./.github/actions/pr-trust

  build:
    runs-on: xcode-27
    needs: trust
    env:
      # Free space, in GiB, required after the caches are restored.
      MIN_FREE_DISK_GIB: "45"
    # The read-write BuildBuddy key is a secret of the buildbuddy-write environment. Only
    # runs allowed to write bind it, so other runs never receive that key.
    environment:
      name: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.trust.outputs.trusted_pr == 'true') && 'buildbuddy-write' || '' }}
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        shell: bash
        run: tools/ci_select_macos_xcode.sh

      # The xcode-27 image starts with far less free disk than a cold build of the tree needs.
      - name: Free hosted macOS disk
        shell: bash
        run: tools/ci/free_hosted_macos_disk.sh

      - name: Setup Bazel for native browser comparison and Wasm build
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Restore Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: editor-wasm

      # BuildBuddy remote cache (docs/building.md). Main push, schedule and dispatch
      # runs and trusted maintainer pull requests read and write; Renovate pull
      # requests only read; every other run configures no remote cache. The
      # read-only repository secret still reaches every same-repository run of
      # this job, so it is treated as public: it can only read the cache.
      - name: Configure BuildBuddy remote cache
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || needs.trust.outputs.trusted_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          trusted-pr: ${{ needs.trust.outputs.trusted_pr }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          download-outputs: toplevel

      - name: Configure BuildBuddy read-only cache
        if: needs.trust.outputs.renovate_pr == 'true'
        uses: ./.github/actions/buildbuddy-cache
        with:
          read-only-api-key: ${{ secrets.BUILDBUDDY_API_KEY_READONLY }}
          renovate-pr: ${{ needs.trust.outputs.renovate_pr }}
          download-outputs: toplevel

      # Before Bazel, so a full disk fails in seconds with a clear error instead of an ENOSPC
      # late in the build.
      - name: Check runner disk space
        shell: bash
        run: tools/ci_check_runner_disk.sh

      # Repository downloads are the only retried part of this lane. Keeping
      # them separate prevents a compile or test failure from passing on retry.
      # tools/ci/editor_wasm_lane.sh holds each Bazel phase's commands.
      - id: editor-wasm-prefetch
        name: Prefetch Editor WASM dependencies
        continue-on-error: true
        run: tools/ci/editor_wasm_lane.sh prefetch

      - name: Retry Editor WASM dependency prefetch
        if: steps.editor-wasm-prefetch.outcome == 'failure'
        run: tools/ci/editor_wasm_lane.sh prefetch

      - name: Build and size-check Geode editor Wasm package
        run: tools/ci/editor_wasm_lane.sh build

      # Proves the generated MODULE.bazel.lock in error mode and snapshots it before later steps
      # can resolve more modules; the deployment candidate retains that snapshot and its digest.
      - name: Prove the package's resolved module graph
        run: tools/ci/editor_wasm_lane.sh prove-lockfile "$RUNNER_TEMP/editor-wasm-module.lock"

      - name: Stage package for handoff
        id: stage-package
        run: python3 tools/ci/editor_wasm_stage.py package

      - name: Upload Geode package artifact
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-package-geode-${{ github.sha }}
          path: ${{ steps.stage-package.outputs.handoff_dir }}
          if-no-files-found: error
          retention-days: 3

      # Links both bridge probes and the standalone Geode module, then audits its browser bridge.
      - name: Link the browser GPU bridge
        run: tools/ci/editor_wasm_lane.sh link-bridge

      # setup-node's own npm cache saves on every event, including pull
      # requests. Keep its automatic caching off and restore the npm download
      # cache explicitly; only main pushes save it.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('donner/editor/wasm/tests/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright
        working-directory: donner/editor/wasm/tests
        run: |
          npm ci
          npx playwright install chromium firefox webkit

      - name: Save main npm download cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Verify Geode-only package contracts
        working-directory: donner/editor/wasm/tests
        run: npm run test:selector

      # The lane sequence this job runs lives in tools/run-browser-ci.sh, so
      # that one local command reproduces this job exactly. Change the lanes
      # there, not here; this step only supplies the package directory. The
      # script serves a private copy of the package, verifies the served
      # editor.wasm hash, runs every lane (no fail-fast, so one run reports the
      # whole matrix), and exits nonzero if any lane failed. Only the scheduled
      # run adds the report-only lane for the cases quarantined by #1634.
      - name: Serve Geode package and run browser suites
        env:
          DONNER_WASM_PACKAGE_DIR: ${{ runner.temp }}/editor-wasm-package-geode
          DONNER_BROWSER_QUARANTINE_REPORT_LANE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: bash tools/run-browser-ci.sh

      # The report-only lane never fails the job, so its outcome reaches the
      # reader through the job summary and its evidence through its own upload.
      # Neither step fails the job on a missing report or missing evidence
      # either: a scheduled run that passed the regular lanes stays usable as a
      # release candidate source.
      - name: Summarize quarantined cases
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -uo pipefail
          node donner/editor/wasm/tests/quarantine-report-summary.mjs donner/editor/wasm/tests/playwright-failures/firefox-quarantine-report/quarantine-report.json >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::Could not summarize the quarantined cases"

      - name: Upload quarantined case evidence
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-quarantine-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: donner/editor/wasm/tests/playwright-failures/firefox-quarantine-report
          if-no-files-found: warn
          retention-days: 14

      # run-browser-ci.sh copies each lane's Playwright output here as the lane
      # ends. The live output directory cannot be uploaded instead: every lane
      # shares it and Playwright empties it on start, so a passing lane wipes
      # the evidence of the earlier lanes. Keep successful residency accounting too.
      # The browser command has exited and archived every lane before these reads.
      # Retry only evidence transport; keep uncertain uploads under distinct names.
      # The final upload failure remains a job failure, including non-DNS errors.
      - name: Upload Playwright evidence
        id: upload-playwright-evidence-1
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: donner/editor/wasm/tests/playwright-failures
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright evidence (attempt 2)
        id: upload-playwright-evidence-2
        if: ${{ !cancelled() && steps.upload-playwright-evidence-1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-evidence-${{ github.sha }}-${{ github.run_attempt }}-upload-2
          path: donner/editor/wasm/tests/playwright-failures
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright evidence (attempt 3)
        if: ${{ !cancelled() && steps.upload-playwright-evidence-1.outcome == 'failure' && steps.upload-playwright-evidence-2.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-evidence-${{ github.sha }}-${{ github.run_attempt }}-upload-3
          path: donner/editor/wasm/tests/playwright-failures
          if-no-files-found: warn
          retention-days: 14

      - name: Stage immutable Geode deployment candidate
        id: stage-candidate
        env:
          PACKAGE_TARGET: ${{ steps.stage-package.outputs.package_target }}
        run: python3 tools/ci/editor_wasm_stage.py candidate

      - name: Upload Geode deployment candidate
        id: upload-candidate
        uses: actions/upload-artifact@v7
        with:
          name: donner-editor-wasm-geode-${{ github.sha }}
          path: ${{ steps.stage-candidate.outputs.candidate_dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Record deployment candidate digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
        run: python3 tools/ci/editor_wasm_stage.py record-digest

      # Last step, after every Bazel command: evicts the action cache to its budget and saves
      # it on a main push.
      - name: Save Bazel action cache
        uses: ./.github/actions/cache-bazel-actions
        with:
          namespace: editor-wasm
          mode: save
