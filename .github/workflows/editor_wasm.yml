name: Editor WASM

on:
  pull_request:
    branches: [main]
    paths:
      - ".bazelignore"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/editor_wasm.yml"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "build_defs/**"
      - "donner/**"
      - "donner_icon.svg"
      - "third_party/**"
      - "tools/http/**"
      - "tools/run-browser-ci.sh"
  schedule:
    - cron: "18 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('run-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: editor-wasm-${{ runner.os }}-geode
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build and size-check Geode editor Wasm package
        run: |
          bazelisk test --test_output=errors \
            //donner/editor/wasm:editor_wasm_transition_tests \
            //donner/svg/renderer:geode_excludes_tiny_skia_audit
          bazelisk test --config=editor-wasm --test_output=errors --remote_download_outputs=all //donner/editor/wasm:wasm_geode_package_size_tests

      - name: Stage package for handoff
        id: stage-package
        run: |
          set -euo pipefail
          pkg_rel=$(bazelisk cquery --config=editor-wasm --output=files \
            //donner/editor/wasm:wasm_web_package | head -n1)
          pkg_dir=$(cd "${pkg_rel}" && pwd -P)
          handoff_dir="${RUNNER_TEMP}/editor-wasm-package-geode"
          mkdir -p "${handoff_dir}"
          cp -RL "${pkg_dir}/." "${handoff_dir}/"
          echo "handoff_dir=${handoff_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload Geode package artifact
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-package-geode-${{ github.sha }}
          path: ${{ steps.stage-package.outputs.handoff_dir }}
          if-no-files-found: error
          retention-days: 3

  test:
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download Geode package
        uses: actions/download-artifact@v8
        with:
          name: editor-wasm-package-geode-${{ github.sha }}
          path: ${{ runner.temp }}/editor-wasm-package-geode

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright
        working-directory: donner/editor/wasm/tests
        run: |
          npm ci
          npx playwright install chromium firefox webkit

      - name: Verify Geode-only package contracts
        working-directory: donner/editor/wasm/tests
        run: npm run test:selector

      # The lane sequence this job runs lives in tools/run-browser-ci.sh, so
      # that one local command reproduces this job exactly. Change the lanes
      # there, not here; this step only supplies the package directory. The
      # script serves a private copy of the package, verifies the served
      # editor.wasm hash, runs every lane (no fail-fast, so one run reports the
      # whole matrix), and exits nonzero if any lane failed.
      - name: Serve Geode package and run browser suites
        env:
          DONNER_WASM_PACKAGE_DIR: ${{ runner.temp }}/editor-wasm-package-geode
        run: bash tools/run-browser-ci.sh

      # run-browser-ci.sh copies each lane's Playwright output here as the lane
      # ends. The live output directory cannot be uploaded instead: every lane
      # shares it and Playwright empties it on start, so a passing lane wipes
      # the evidence of the failing lanes before it.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: editor-wasm-playwright-failure-${{ github.sha }}
          path: donner/editor/wasm/tests/playwright-failures
          if-no-files-found: warn
          retention-days: 14

      - name: Stage immutable Geode deployment candidate
        id: stage-candidate
        run: |
          set -euo pipefail
          pkg_dir="${RUNNER_TEMP}/editor-wasm-package-geode"
          candidate_dir="${RUNNER_TEMP}/donner-editor-wasm-geode-${GITHUB_SHA}"
          site_dir="${candidate_dir}/site"
          deploy_dir="${candidate_dir}/deploy"
          mkdir -p "${site_dir}" "${deploy_dir}"
          cp -R "${pkg_dir}/." "${site_dir}/"

          expected_site_files=$(
            printf '%s\n' \
              donner_icon.svg \
              editor-bootstrap.js \
              editor.css \
              editor.js \
              editor.wasm \
              enable-threads.js \
              index.html \
              | LC_ALL=C sort
          )
          actual_site_files=$(cd "${site_dir}" && find . -type f | sed 's|^./||' | LC_ALL=C sort)
          test "${actual_site_files}" = "${expected_site_files}"

          for file in \
            donner_icon.svg editor-bootstrap.js editor.css editor.js \
            enable-threads.js index.html; do
            cp "${site_dir}/${file}" "${deploy_dir}/${file}"
          done
          gzip -n -9 -c "${site_dir}/editor.wasm" > "${deploy_dir}/editor.wasm.gz"
          test "$(wc -c < "${deploy_dir}/editor.wasm.gz")" -le 20971520

          lockfile_sha256=$(shasum -a 256 donner/editor/wasm/tests/package-lock.json | awk '{print $1}')
          printf '%s\n' \
            "{\"source_revision\":\"${GITHUB_SHA}\",\"lockfile_sha256\":\"${lockfile_sha256}\",\"bazel_configs\":[\"editor-wasm\"],\"targets\":[\"//donner/editor/wasm:wasm_web_package\"],\"renderer\":\"geode\",\"transport_encoding\":\"gzip\"}" \
            > "${candidate_dir}/provenance.json"

          (
            cd "${candidate_dir}"
            find site deploy -type f | LC_ALL=C sort | while IFS= read -r file; do
              shasum -a 256 "${file}"
            done > SHA256SUMS
          )
          echo "candidate_dir=${candidate_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload Geode deployment candidate
        id: upload-candidate
        uses: actions/upload-artifact@v7
        with:
          name: donner-editor-wasm-geode-${{ github.sha }}
          path: ${{ steps.stage-candidate.outputs.candidate_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Record deployment candidate digest
        run: |
          echo "### Geode deployment candidate" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Source revision: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact digest: \`${{ steps.upload-candidate.outputs.artifact-digest }}\`" \
            >> "${GITHUB_STEP_SUMMARY}"
