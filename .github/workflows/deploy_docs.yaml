name: Build and manually deploy documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Retained github-pages artifact ID from the reviewed build
        required: true
        type: string
      source_run_id:
        description: Successful main docs build run ID
        required: true
        type: string
      source_attempt:
        description: Successful main docs build attempt
        required: true
        type: string
      source_commit:
        description: Full source commit SHA of the reviewed docs build
        required: true
        type: string
      artifact_digest:
        description: GitHub artifact digest (sha256:...)
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of the retained artifact.tar
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install graphviz -y

      - name: Install Doxygen
        env:
          DOXYGEN_SHA256: "0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1"
        run: |
          mkdir -p ${{ github.workspace }}/doxygen
          archive="${{ github.workspace }}/doxygen/doxygen.tar.gz"
          curl -fL https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz -o "$archive"
          echo "${DOXYGEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C ${{ github.workspace }}/doxygen
          echo "${{ github.workspace }}/doxygen/doxygen-1.15.0/bin" >> $GITHUB_PATH # Add Doxygen to PATH

      - name: Generate Doxygen documentation
        run: |
          tools/build_docs.sh

      - name: Bind the docs site to this source run
        run: |
          python3 -B -m tools.pages_artifact marker \
            --output generated-doxygen/html/docs-build.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload retained Pages artifact
        id: pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./generated-doxygen/html"
          retention-days: 90

      - name: Record the immutable docs selection
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: |
          archive_sha256="$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d' ' -f1)"
          {
            echo "### Retained documentation artifact"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Build run: \`$GITHUB_RUN_ID\`, attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Pages artifact ID: \`$ARTIFACT_ID\`"
            echo "- artifact.tar SHA-256: \`$archive_sha256\`"
            echo "- Artifact metadata digest: retrieve from the Actions artifact API before manual deployment"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      DOC_ARTIFACT_ID: ${{ inputs.artifact_id }}
      DOC_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      DOC_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      DOC_SOURCE_COMMIT: ${{ inputs.source_commit }}
      DOC_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      DOC_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate selected IDs and digests
        run: python3 -B -m tools.pages_artifact inputs

      - name: Download the retained Pages artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: selected-docs

      - name: Verify selected source, artifact, and exact archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DOC_ARTIFACT_ID" > "$RUNNER_TEMP/docs-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DOC_SOURCE_RUN_ID/attempts/$DOC_SOURCE_ATTEMPT" > "$RUNNER_TEMP/docs-run.json"
          python3 -B -m tools.pages_artifact verify \
            --artifact-json "$RUNNER_TEMP/docs-artifact.json" \
            --run-json "$RUNNER_TEMP/docs-run.json" \
            --archive selected-docs/artifact.tar

      # deploy-pages looks only in the current run; the Pages API accepts the
      # verified artifact ID from the retained build without re-uploading it.
      - name: Deploy the selected artifact without rebuilding
        id: deployment
        uses: actions/github-script@v9
        with:
          script: |
            const artifactId = Number(process.env.DOC_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('Invalid Pages artifact ID');
            }
            const buildVersion = `${process.env.DOC_SOURCE_COMMIT}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const idToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: buildVersion,
              oidc_token: idToken,
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages returned no deployment ID');
            const finalFailures = new Set([
              'deployment_failed', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost',
            ]);
            const deadline = Date.now() + 600000;
            let succeeded = false;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const {data: current} = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                {...context.repo, pages_deployment_id: deploymentId},
              );
              if (current.status === 'succeed') {
                succeeded = true;
                break;
              }
              if (finalFailures.has(current.status)) {
                throw new Error(`Pages deployment failed: ${current.status}`);
              }
            }
            if (!succeeded) throw new Error('Pages deployment timed out');
            if (!deployment.page_url) {
              throw new Error('Pages deployment returned no URL');
            }
            const pageUrl = deployment.page_url.startsWith('https://')
              ? deployment.page_url : `https://${deployment.page_url}`;
            const markerUrl = new URL('docs-build.json', pageUrl.endsWith('/') ? pageUrl : `${pageUrl}/`);
            markerUrl.searchParams.set('deploy_run', process.env.GITHUB_RUN_ID);
            let liveMatches = false;
            for (let attempt = 0; attempt < 24; attempt++) {
              try {
                const response = await fetch(markerUrl, {cache: 'no-store'});
                if (response.ok) {
                  const marker = await response.json();
                  liveMatches = marker.source_commit === process.env.DOC_SOURCE_COMMIT &&
                    String(marker.source_run_id) === process.env.DOC_SOURCE_RUN_ID &&
                    String(marker.source_attempt) === process.env.DOC_SOURCE_ATTEMPT;
                  if (liveMatches) break;
                }
              } catch (error) {
                core.info(`Waiting for the selected docs build marker: ${error.name}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!liveMatches) throw new Error('Live Pages site did not show the selected docs build');
            core.setOutput('page_url', pageUrl);
            core.summary.addRaw(`Published retained Pages artifact ${artifactId} from ${process.env.DOC_SOURCE_COMMIT} to ${pageUrl}`);
            await core.summary.write();
