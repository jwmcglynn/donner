name: Build and manually deploy documentation

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# A main push builds and retains the site; it never deploys. A manual dispatch promotes one
# retained build without rebuilding it. `record` deploys the docs build that a verified release
# candidate record names. `rollback` reselects a previous healthy build whose six values the
# release tracking issue records, because a record has no rollback slot. See
# docs/release_checklists/docs_artifact_promotion.md.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      selection:
        description: "record: the docs build a candidate record names; rollback: a recorded earlier build"
        required: true
        type: choice
        options: [record, rollback]
      record_run:
        description: "record: Assemble release candidate run ID/attempt (e.g. 123/1)"
        required: false
        type: string
      record_sha256:
        description: "record: SHA-256 of candidate.json, from its Release-Candidate-Record line"
        required: false
        type: string
      artifact_id:
        description: "rollback: retained github-pages artifact ID"
        required: false
        type: string
      source_run_id:
        description: "rollback: successful main docs build run ID"
        required: false
        type: string
      source_attempt:
        description: "rollback: successful main docs build attempt"
        required: false
        type: string
      source_commit:
        description: "rollback: full source commit SHA of the docs build"
        required: false
        type: string
      artifact_digest:
        description: "rollback: GitHub artifact digest (sha256:...)"
        required: false
        type: string
      archive_sha256:
        description: "rollback: SHA-256 of the retained artifact.tar"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Recommended packages stay installed: Graphviz recommends the fonts its diagrams use.
      - name: Install graphviz
        uses: ./.github/actions/apt-install
        with:
          packages: graphviz
          install-recommends: "true"

      # Downloads the pinned release and checks its SHA-256 before extracting it.
      - name: Install Doxygen
        run: tools/ci/docs_lane.sh install-doxygen

      - name: Generate Doxygen documentation
        run: tools/build_docs.sh

      - name: Bind the docs site to this source run
        run: python3 -B -m tools.pages_artifact marker --output generated-doxygen/html/docs-build.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload retained Pages artifact
        id: pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./generated-doxygen/html"
          retention-days: 90

      - name: Record the immutable docs selection
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: python3 -B -m tools.pages_artifact summary --archive "$RUNNER_TEMP/artifact.tar"

      - name: Setup Bazel for the module graph record
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      # Doxygen and Graphviz, not Bazel, generate the site, so their versions are recorded. The
      # module graph recorded is the production graph of the documented `donner` module,
      # resolved by this build: development-only modules are ignored, because their extensions
      # never run here. Error mode proves the generated lockfile complete for that graph, and
      # the lockfile is retained beside the Pages artifact rather than published on the site.
      - name: Record the docs build dependency state
        run: tools/ci/docs_lane.sh record-dependencies

      - name: Retain the docs build provenance
        uses: actions/upload-artifact@v7
        with:
          name: donner-docs-provenance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-provenance/
          if-no-files-found: error
          retention-days: 90

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      attestations: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Record mode first downloads only the record artifact, by ID, from the named successful
      # manual assembly on main, and checks it against the approved digest. Its attestation is
      # verified before anything the record names is used.
      - name: Fetch the candidate record
        id: record
        if: inputs.selection == 'record'
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_RUN: ${{ inputs.record_run }}
          RECORD_SHA256: ${{ inputs.record_sha256 }}
        run: |
          python3 -B -m tools.release_candidate docs-record \
            --record-run "$RECORD_RUN" --record-sha256 "$RECORD_SHA256" \
            --work "$RUNNER_TEMP/docs-record" --github-output "$GITHUB_OUTPUT"

      - name: Verify the candidate record attestation
        if: inputs.selection == 'record'
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_PATH: ${{ steps.record.outputs.record_path }}
          RECORD_COMMIT: ${{ steps.record.outputs.record_commit }}
        run: |
          gh attestation verify "$RECORD_PATH" \
            --repo jwmcglynn/donner \
            --signer-workflow jwmcglynn/donner/.github/workflows/release_candidate.yml \
            --source-digest "$RECORD_COMMIT" --source-ref refs/heads/main > /dev/null

      # The selected IDs and digests come only from the attested record's docs entry, after its
      # docs-provenance artifact is verified; rollback values must then be empty. In rollback
      # mode they are the six recorded values, and the record values must be empty.
      - name: Select the docs build to deploy
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.selection }}
          RECORD_RUN: ${{ inputs.record_run }}
          RECORD_PATH: ${{ steps.record.outputs.record_path }}
          RECORD_COMMIT: ${{ steps.record.outputs.record_commit }}
          RECORD_SHA256: ${{ inputs.record_sha256 }}
          DOC_ARTIFACT_ID: ${{ inputs.artifact_id }}
          DOC_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DOC_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          DOC_SOURCE_COMMIT: ${{ inputs.source_commit }}
          DOC_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          DOC_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          python3 -B -m tools.release_candidate docs-selection --selection "$SELECTION" \
            --record-run "$RECORD_RUN" --record-path "$RECORD_PATH" \
            --record-commit "$RECORD_COMMIT" --record-sha256 "$RECORD_SHA256" \
            --work "$RUNNER_TEMP/docs-selection" --github-output "$GITHUB_OUTPUT"

      - name: Download the retained Pages artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: selected-docs

      - name: Verify selected source, artifact, and exact archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          DOC_ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
          DOC_SOURCE_RUN_ID: ${{ steps.select.outputs.run_id }}
          DOC_SOURCE_ATTEMPT: ${{ steps.select.outputs.attempt }}
          DOC_SOURCE_COMMIT: ${{ steps.select.outputs.source_commit }}
          DOC_ARTIFACT_DIGEST: ${{ steps.select.outputs.artifact_digest }}
          DOC_ARCHIVE_SHA256: ${{ steps.select.outputs.archive_sha256 }}
        # Reads the artifact and source run attempt metadata from the Actions API itself.
        run: python3 -B -m tools.pages_artifact verify --archive selected-docs/artifact.tar

      # deploy-pages looks only in the current run; the Pages API accepts the
      # verified artifact ID from the retained build without re-uploading it.
      - name: Deploy the selected artifact without rebuilding
        id: deployment
        uses: actions/github-script@v9
        env:
          DOC_ARTIFACT_ID: ${{ steps.select.outputs.artifact_id }}
          DOC_SOURCE_RUN_ID: ${{ steps.select.outputs.run_id }}
          DOC_SOURCE_ATTEMPT: ${{ steps.select.outputs.attempt }}
          DOC_SOURCE_COMMIT: ${{ steps.select.outputs.source_commit }}
        with:
          script: |
            const artifactId = Number(process.env.DOC_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('Invalid Pages artifact ID');
            }
            const buildVersion = `${process.env.DOC_SOURCE_COMMIT}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const idToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: buildVersion,
              oidc_token: idToken,
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages returned no deployment ID');
            const finalFailures = new Set([
              'deployment_failed', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost',
            ]);
            const deadline = Date.now() + 600000;
            let succeeded = false;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const {data: current} = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                {...context.repo, pages_deployment_id: deploymentId},
              );
              if (current.status === 'succeed') {
                succeeded = true;
                break;
              }
              if (finalFailures.has(current.status)) {
                throw new Error(`Pages deployment failed: ${current.status}`);
              }
            }
            if (!succeeded) throw new Error('Pages deployment timed out');
            if (!deployment.page_url) {
              throw new Error('Pages deployment returned no URL');
            }
            const pageUrl = deployment.page_url.startsWith('https://')
              ? deployment.page_url : `https://${deployment.page_url}`;
            const markerUrl = new URL('docs-build.json', pageUrl.endsWith('/') ? pageUrl : `${pageUrl}/`);
            markerUrl.searchParams.set('deploy_run', process.env.GITHUB_RUN_ID);
            let liveMatches = false;
            for (let attempt = 0; attempt < 24; attempt++) {
              try {
                const response = await fetch(markerUrl, {cache: 'no-store'});
                if (response.ok) {
                  const marker = await response.json();
                  liveMatches = marker.source_commit === process.env.DOC_SOURCE_COMMIT &&
                    String(marker.source_run_id) === process.env.DOC_SOURCE_RUN_ID &&
                    String(marker.source_attempt) === process.env.DOC_SOURCE_ATTEMPT;
                  if (liveMatches) break;
                }
              } catch (error) {
                core.info(`Waiting for the selected docs build marker: ${error.name}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!liveMatches) throw new Error('Live Pages site did not show the selected docs build');
            core.setOutput('page_url', pageUrl);
            core.summary.addRaw(`Published retained Pages artifact ${artifactId} from ${process.env.DOC_SOURCE_COMMIT} to ${pageUrl}`);
            await core.summary.write();
