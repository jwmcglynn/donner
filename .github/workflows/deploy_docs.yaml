name: Build and manually deploy documentation

# Keep third-party Bazel module telemetry off, as the telemetry section of .bazelrc explains.
env:
  DO_NOT_TRACK: "1"
  ASPECT_TOOLS_TELEMETRY: "-all"

# Main pushes retain read-only source builds. Manual composition verifies selected source
# artifacts; publication accepts only an attested complete site and a verified recovery archive.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      selection:
        description: "Compose, publish, roll back a complete site, or approve the one-time legacy backup"
        required: true
        type: choice
        options: [compose, publish, rollback, seed]
      request:
        description: "Reviewed JSON selection; see docs/release_checklists/docs_artifact_promotion.md"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Recommended packages stay installed: Graphviz recommends the fonts its diagrams use.
      - name: Install graphviz
        uses: ./.github/actions/apt-install
        with:
          packages: graphviz
          install-recommends: "true"

      # Downloads the pinned release and checks its SHA-256 before extracting it.
      - name: Install Doxygen
        run: tools/ci/docs_lane.sh install-doxygen

      - name: Generate Doxygen documentation
        run: tools/build_docs.sh

      - name: Bind the docs site to this source run
        run: python3 -B -m tools.pages_artifact marker --output generated-doxygen/html/docs-build.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload retained Pages artifact
        id: pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./generated-doxygen/html"
          retention-days: 90

      - name: Record the immutable docs selection
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: python3 -B -m tools.pages_artifact summary --archive "$RUNNER_TEMP/artifact.tar"

      - name: Setup Bazel for the module graph record
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      # Doxygen and Graphviz, not Bazel, generate the site, so their versions are recorded. The
      # module graph recorded is the production graph of the documented `donner` module,
      # resolved by this build: development-only modules are ignored, because their extensions
      # never run here. Error mode proves the generated lockfile complete for that graph, and
      # the lockfile is retained beside the Pages artifact rather than published on the site.
      - name: Record the docs build dependency state
        run: tools/ci/docs_lane.sh record-dependencies

      - name: Retain the docs build provenance
        uses: actions/upload-artifact@v7
        with:
          name: donner-docs-provenance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-provenance/
          if-no-files-found: error
          retention-days: 90

  assemble:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.selection == 'compose'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify sources and compose every documentation version
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_REQUEST: ${{ inputs.request }}
        run: python3 -B -m tools.docs_publish prepare --work "$RUNNER_TEMP/docs-site"
      - name: Upload the complete Pages site
        id: pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/docs-site/site
          retention-days: 90
      - name: Bind the uploaded archive and source selections
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: |
          python3 -B -m tools.docs_publish finalize --work "$RUNNER_TEMP/docs-site" \
            --archive "$RUNNER_TEMP/artifact.tar" --artifact-id "$PAGES_ARTIFACT_ID"
      - name: Attest the composition record and exact Pages archive
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/docs-site/payload/composition.json
            ${{ runner.temp }}/artifact.tar
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site-payload-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-site/payload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  seed:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.selection == 'seed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-pages
    permissions:
      contents: write
      actions: read
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Preserve only the explicitly approved current legacy site
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_REQUEST: ${{ inputs.request }}
        run: python3 -B -m tools.docs_publish seed --work "$RUNNER_TEMP/docs-seed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-seed-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-seed/seed/
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.selection == 'publish' || inputs.selection == 'rollback')
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the attested composition and durable prior site
        if: inputs.selection == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_REQUEST: ${{ inputs.request }}
        run: python3 -B -m tools.docs_publish preflight --work "$RUNNER_TEMP/docs-publish"
      - name: Restore and verify the durable rollback selection
        if: inputs.selection == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_REQUEST: ${{ inputs.request }}
        run: python3 -B -m tools.docs_publish rollback-preflight --work "$RUNNER_TEMP/docs-publish"
      - name: Retain the verified prior Pages archive for recovery
        id: previous
        uses: actions/upload-artifact@v7
        with:
          name: docs-rollback-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-publish/previous-pages/artifact.tar
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload the verified durable rollback candidate
        id: candidate
        if: inputs.selection == 'rollback'
        uses: actions/upload-artifact@v7
        with:
          name: docs-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-publish/pages/artifact.tar
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish the verified complete site with approved recovery
        if: inputs.selection == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_PREVIOUS_ARTIFACT_ID: ${{ steps.previous.outputs.artifact-id }}
        run: |
          python3 -B -m tools.docs_publish promote --work "$RUNNER_TEMP/docs-publish" \
            --artifact-id "$VERIFIED_PREVIOUS_ARTIFACT_ID"
      - name: Roll back the complete site with approved recovery
        if: inputs.selection == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_PREVIOUS_ARTIFACT_ID: ${{ steps.previous.outputs.artifact-id }}
          VERIFIED_CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
        run: |
          python3 -B -m tools.docs_publish rollback --work "$RUNNER_TEMP/docs-publish" \
            --artifact-id "$VERIFIED_PREVIOUS_ARTIFACT_ID"
      - name: Retain publication and recovery evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-promotion-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docs-publish/preflight.json
            ${{ runner.temp }}/docs-publish/result.json
            ${{ runner.temp }}/docs-publish/composition-attestation.json
            ${{ runner.temp }}/docs-publish/pages-attestation.json
          if-no-files-found: ignore
          retention-days: 90
