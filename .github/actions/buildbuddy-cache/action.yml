name: Configure BuildBuddy remote cache
description: >-
  Point Bazel at the BuildBuddy remote cache on a GitHub-hosted lane, or on
  the self-hosted macOS lane for trusted maintainer pull requests. Remote
  execution is opt-in for trusted GitHub-hosted Linux writers. No build-event upload. The workflow
  passes at most one key, chosen by the event and the shared pull request
  trust rule (.github/actions/pr-trust); this action re-checks that choice and
  fails closed. With no key it writes nothing, and the try-import in .bazelrc
  leaves the build exactly as it is without a remote cache.

outputs:
  bazel-flags:
    description: Optional flags for commands that support Linux remote execution.
    value: ${{ steps.configure.outputs.bazel-flags }}

inputs:
  remote-execution:
    description: Enable Linux remote execution for explicitly selected Bazel commands.
    required: false
    default: "false"
  api-key:
    description: >-
      Read-write key. Pass `secrets.BUILDBUDDY_API_KEY`, a secret of the
      buildbuddy-write environment, only from a job that binds that
      environment and a step limited to main push, schedule and dispatch runs
      or to a trusted maintainer pull request.
    required: false
    default: ""
  read-only-api-key:
    description: >-
      Key whose cache writes are disabled. Pass
      `secrets.BUILDBUDDY_API_KEY_READONLY` from a step limited to Renovate
      pull requests; the action also turns off result upload. As a repository
      secret it reaches every same-repository run of the job, so treat it as
      public: it can only read the cache.
    required: false
    default: ""
  trusted-pr:
    description: The `trusted_pr` output of .github/actions/pr-trust.
    required: false
    default: "false"
  renovate-pr:
    description: The `renovate_pr` output of .github/actions/pr-trust.
    required: false
    default: "false"
  download-outputs:
    description: >-
      Value of `--remote_download_outputs`. "minimal" suits lanes that only
      need test results; use "toplevel" (Bazel's default) or "all" when a
      later step reads build outputs from bazel-bin.
    required: false
    default: toplevel
  cache-partition:
    description: >-
      Remote cache partition (`--remote_instance_name`) to use instead of the
      runner image identity. The macOS lanes pass the `cache_partition` output
      of tools/ci_select_macos_xcode.sh, which names the pinned Xcode, so the
      macOS lanes key their cache on the toolchain rather than on the weekly
      runner image.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure BuildBuddy remote cache
      id: configure
      shell: bash
      env:
        # Secrets are not readable in `if:` conditions, so each key arrives as
        # an environment value and the presence checks below are shell tests.
        REMOTE_EXECUTION: ${{ inputs.remote-execution }}
        WRITE_KEY: ${{ inputs.api-key }}
        READ_KEY: ${{ inputs.read-only-api-key }}
        TRUSTED_PR: ${{ inputs.trusted-pr }}
        RENOVATE_PR: ${{ inputs.renovate-pr }}
        DOWNLOAD_OUTPUTS: ${{ inputs.download-outputs }}
        CACHE_PARTITION: ${{ inputs.cache-partition }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        endpoint="remote.buildbuddy.io"
        fragment="${GITHUB_WORKSPACE}/.buildbuddy.bazelrc"
        rm -f "${fragment}"
        echo "bazel-flags=" >> "${GITHUB_OUTPUT}"

        if [[ -z "${WRITE_KEY}" && -z "${READ_KEY}" ]]; then
          echo "No BuildBuddy key for this run; remote cache disabled."
          exit 0
        fi
        # Never let a key surface in logs, even if a later step prints flags.
        if [[ -n "${WRITE_KEY}" ]]; then echo "::add-mask::${WRITE_KEY}"; fi
        if [[ -n "${READ_KEY}" ]]; then echo "::add-mask::${READ_KEY}"; fi

        # The checks below back up the workflow's own step conditions: a key
        # that reaches the wrong run is an error, never a silent downgrade.
        fail() { echo "::error::BuildBuddy: $1"; exit 1; }
        [[ -z "${WRITE_KEY}" || -z "${READ_KEY}" ]] || fail "pass one key, not both."
        main_writer=false
        if [[ "${REF}" == "refs/heads/main" ]]; then
          case "${EVENT_NAME}" in
            push|schedule|workflow_dispatch) main_writer=true ;;
          esac
        fi
        trusted_writer=false
        if [[ "${EVENT_NAME}" == "pull_request" && "${TRUSTED_PR}" == "true" &&
              "${RENOVATE_PR}" != "true" ]]; then
          trusted_writer=true
        fi
        # The one self-hosted exception: the macOS runner, for trusted maintainer
        # pull requests with the read-write key. Every other run is GitHub-hosted.
        case "${RUNNER_ENVIRONMENT:-}" in
          github-hosted) ;;
          self-hosted)
            [[ "${RUNNER_OS:-}" == "macOS" && "${trusted_writer}" == "true" &&
               -n "${WRITE_KEY}" ]] ||
              fail "a self-hosted runner gets a key only on macOS for a trusted maintainer pull request."
            ;;
          *) fail "unknown runner environment." ;;
        esac
        if [[ -n "${WRITE_KEY}" ]]; then
          mode=read-write
          upload=true
          [[ "${main_writer}" == "true" || "${trusted_writer}" == "true" ]] ||
            fail "the read-write key is only for main and trusted maintainer pull requests."
        else
          mode=read-only
          upload=false
          [[ "${EVENT_NAME}" == "pull_request" && "${RENOVATE_PR}" == "true" ]] ||
            fail "the read-only key is only for Renovate pull requests."
        fi
        case "${REMOTE_EXECUTION}" in
          false) ;;
          true)
            [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" &&
               "${RUNNER_OS:-}" == "Linux" && "${RUNNER_ARCH:-}" == "X64" &&
               "${mode}" == "read-write" ]] ||
              fail "remote execution requires a trusted GitHub-hosted Linux x86_64 writer."
            ;;
          *) fail "unsupported remote-execution value." ;;
        esac
        case "${DOWNLOAD_OUTPUTS}" in
          minimal|toplevel|all) ;;
          *) fail "unsupported download-outputs value." ;;
        esac

        # Hosted lanes compile with the runner image's compiler and system
        # headers, which are not action inputs, so an image update changes no
        # cache key. Partition the cache per runner image so an entry is only
        # ever reused on the image that produced it. The macOS lanes instead
        # name the pinned Xcode (tools/ci_macos_xcode.txt), which every macOS
        # runner builds with.
        # A self-hosted runner has no image identity: its partition must come
        # from the pinned Xcode, so a self-hosted job without one is an error.
        if [[ -n "${CACHE_PARTITION:-}" ]]; then
          [[ "${CACHE_PARTITION}" =~ ^[A-Za-z0-9]+(-[A-Za-z0-9.]+)+$ ]] ||
            fail "invalid cache-partition value."
          image="${CACHE_PARTITION}"
        elif [[ "${RUNNER_ENVIRONMENT}" == "self-hosted" ]]; then
          fail "a self-hosted runner needs the pinned Xcode's cache-partition."
        else
          image="${ImageOS:-}-${ImageVersion:-}-${RUNNER_ARCH:-}"
          if [[ ! "${image}" =~ ^[A-Za-z0-9]+-[A-Za-z0-9.]+-[A-Za-z0-9]+$ ]]; then
            echo "::warning::BuildBuddy: runner image identity unavailable; remote cache disabled."
            exit 0
          fi
        fi

        # An unreachable cache must cost nothing, so probe first and build
        # without it on any transport failure; the fallback flags below cover
        # an outage later in the job. Without --fail, curl succeeds on every
        # HTTP response, so any nonzero status means no usable endpoint.
        if ! curl --silent --output /dev/null --connect-timeout 5 --max-time 10 \
            "https://${endpoint}"; then
          echo "::warning::BuildBuddy unreachable; building without the remote cache."
          exit 0
        fi

        # Bazel gets the key from a credential helper, never as a flag: Bazel
        # writes every rc option into its server log in the output base, which
        # outlives the job on a persistent runner. The helper and the key live
        # outside the workspace, so no artifact or cache upload of workspace
        # paths can carry them, and Bazel caches the helper's answer only in
        # memory. A GitHub-hosted runner is discarded when the job ends; the
        # self-hosted job removes both files in its last step.
        if [[ "${mode}" == "read-write" ]]; then key="${WRITE_KEY}"; else key="${READ_KEY}"; fi
        # The helper prints the key inside JSON, so allow only key characters.
        [[ "${key}" =~ ^[A-Za-z0-9_-]+$ ]] || fail "the key has unexpected characters."
        credentials="${RUNNER_TEMP}/buildbuddy"
        mkdir -p "${credentials}"
        chmod 700 "${credentials}"
        (
          umask 077
          printf '%s' "${key}" > "${credentials}/key"
          {
            echo '#!/bin/sh'
            echo '# Bazel credential helper: answers every request with the BuildBuddy key.'
            echo 'cat > /dev/null'
            printf 'printf %s "$(cat %q)"\n' "'{\"headers\":{\"x-buildbuddy-api-key\":[\"%s\"]}}\\n'" \
              "${credentials}/key"
          } > "${credentials}/helper"
        )
        chmod 700 "${credentials}/helper"
        {
          echo "# Generated by .github/actions/buildbuddy-cache. Do not commit."
          if [[ "${REMOTE_EXECUTION}" == "true" ]]; then
            echo "build:buildbuddy-re --remote_executor=grpcs://${endpoint}"
          fi
          echo "build --remote_cache=grpcs://${endpoint}"
          echo "build --remote_instance_name=${image}"
          echo "build --remote_timeout=60s"
          echo "build --remote_cache_compression"
          # The probe sees the cache only now. When a later Bazel command
          # cannot reach it, the command's first cache lookup fails ("Failed
          # to query remote execution capabilities", exit code 34) unless both
          # flags let Bazel run the action locally instead.
          echo "build --remote_local_fallback"
          echo "build --incompatible_remote_local_fallback_for_remote_cache"
          echo "build --remote_download_outputs=${DOWNLOAD_OUTPUTS}"
          # rules_playwright unpacks each browser into a directory output. When
          # that output comes from a cache (remote or disk) and is fetched only
          # when a test needs it, its macOS app bundle cannot be staged into the
          # test sandbox. Download the browser trees in full on every cache hit.
          echo 'build --remote_download_regex=.*/rules_playwright[+][^/]*/browsers/.*'
          if [[ "${upload}" == "true" ]]; then
            echo "build --remote_upload_local_results"
          else
            echo "build --noremote_upload_local_results"
          fi
          echo "build --credential_helper=${endpoint}=${credentials}/helper"
        } > "${fragment}"

        echo "BuildBuddy remote cache enabled: mode=${mode} event=${EVENT_NAME}" \
          "instance=${image} download_outputs=${DOWNLOAD_OUTPUTS} upload=${upload}"

        if [[ "${REMOTE_EXECUTION}" == "true" ]]; then
          echo "bazel-flags=--config=buildbuddy-re" >> "${GITHUB_OUTPUT}"
          echo "BuildBuddy Linux remote execution configured for selected commands."
        fi
