name: Upload Bazel test artifacts
description: Collect Bazel test logs and undeclared outputs from a CI job.

inputs:
  name:
    description: Artifact name.
    required: true
  testlogs:
    description: The Bazel test log tree to collect from; bazel-testlogs when empty.
    required: false

runs:
  using: composite
  steps:
    - name: Collect Bazel test artifacts
      shell: bash
      env:
        TESTLOGS: ${{ inputs.testlogs }}
      run: |
        set -euo pipefail

        testlogs="${TESTLOGS:-bazel-testlogs}"
        output_dir="${RUNNER_TEMP}/bazel-test-artifacts"
        rm -rf "${output_dir}"
        mkdir -p "${output_dir}"

        if [[ ! -e "${testlogs}" ]]; then
          echo "No ${testlogs} found."
          exit 0
        fi

        while IFS= read -r -d '' file; do
          rel="${file#"${testlogs}"/}"
          dest="${output_dir}/${rel}"
          mkdir -p "$(dirname "${dest}")"
          cp "${file}" "${dest}"
        done < <(
          find -H "${testlogs}" \
            \( -name test.log -o -name test.xml -o -path '*/test.outputs/*' \) \
            -type f -print0
        )

        echo "Collected Bazel test artifacts:"
        find "${output_dir}" -type f -print | sort || true

    - name: Upload Bazel test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/bazel-test-artifacts
        if-no-files-found: ignore
        retention-days: 14
