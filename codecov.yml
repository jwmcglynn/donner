ignore:
  - "third_party/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        branches:
          - main
        flags:
          - unittests
    patch:
      default:
        target: auto
        threshold: 0%
        only_pulls: true
        # Report patch coverage as a status/comment but never block the
        # merge on it. For large backend-introduction PRs (Geode renderer
        # stack, future backends) patch coverage naturally dips below the
        # project baseline while follow-up test work lands. Keeping this
        # informational matches the `project` status above — both are
        # visibility, not merge gates. Coverage improvement is tracked
        # as a follow-up in docs/design_docs/0017-geode_renderer.md.
        informational: true

comment:
  # PR uploads are selected subsets. Show their explicit flag without a
  # project-coverage header or summary derived from that subset.
  layout: "diff, flags, files, footer"
  hide_project_coverage: true

flags:
  unittests:
    carryforward: true
  pr-incremental:
    carryforward: false

parsers:
  gcov:
    branch_detection:
      conditional: no
      loop: yes
      method: no
      macro: no
