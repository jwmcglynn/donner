ignore:
  - "third_party/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        branches:
          - main
        flags:
          - unittests
    patch:
      default:
        target: auto
        threshold: 0%
        only_pulls: true
        # Report patch coverage as a status/comment but never block the
        # merge on it. For large backend-introduction PRs (Geode renderer
        # stack, future backends) patch coverage naturally dips below the
        # project baseline while follow-up test work lands. Keeping this
        # informational matches the `project` status above — both are
        # visibility, not merge gates. Coverage improvement is measured
        # against the complete main baseline, not selected PR uploads.
        informational: true

comment:
  # PR uploads are selected subsets. The diff component prints a project
  # comparison even with the project header hidden, so show patch-only details
  # and the explicit incremental flag instead.
  layout: "condensed_header, flags, condensed_files, condensed_footer"
  hide_project_coverage: true

flags:
  unittests:
    carryforward: true
  pr-incremental:
    carryforward: false

parsers:
  gcov:
    branch_detection:
      conditional: no
      loop: yes
      method: no
      macro: no
