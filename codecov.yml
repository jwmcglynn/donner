ignore:
  - "third_party/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        branches:
          - main
        flags:
          - unittests
    # Coverage is uploaded only by the nightly and manually dispatched runs of
    # the Coverage workflow on main; pull requests upload nothing. Without a
    # head upload there is no patch to measure, so the patch status is off
    # rather than left pending on every pull request.
    patch: false

# Pull requests have no coverage upload to report on.
comment: false

flags:
  unittests:
    carryforward: true

parsers:
  gcov:
    branch_detection:
      conditional: no
      loop: yes
      method: no
      macro: no
